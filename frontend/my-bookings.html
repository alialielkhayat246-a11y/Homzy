<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homzy — حجوزات المعاينة</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=7">
<style>
  .wrap2{max-width:760px;margin:0 auto;padding:20px 14px 48px;}
  h1{font-size:22px;margin:4px 0 4px;} .sub{color:var(--muted);font-size:14px;margin-bottom:16px;}
  .tabs{display:inline-flex;background:var(--cream);border-radius:11px;padding:3px;margin-bottom:12px;}
  .tabs button{border:none;background:none;font-family:var(--ff);font-weight:800;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--navy);}
  .tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .bk{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;display:flex;flex-wrap:wrap;}
  .bk .im{width:150px;min-height:120px;background:#e9e2da center/cover no-repeat;flex:none;}
  @media(max-width:520px){.bk .im{width:100%;height:140px;}}
  .bk .in{flex:1;min-width:220px;padding:12px 14px;}
  .bk .t{font-weight:900;color:var(--navy);font-size:15.5px;} .bk .m{font-size:13.5px;color:#40506a;margin-top:4px;line-height:1.7;}
  .badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:100px;display:inline-block;margin-top:6px;}
  .s-pending{background:#FFF4E5;color:#9A5B00;} .s-confirmed{background:#E1F4F1;color:#0B5563;} .s-completed{background:#E6F6EC;color:#137a3e;}
  .s-rejected,.s-cancelled{background:#F1F1F1;color:#6b7280;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .acts button,.acts a{font-family:var(--ff);font-size:12.5px;font-weight:800;border-radius:9px;padding:7px 11px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;color:var(--navy);text-decoration:none;}
  .acts .no{color:#B42318;border-color:#F0C9C4;} .acts .wa{background:#22C55E;border-color:#22C55E;color:#fff;}
  .note{font-size:12.5px;font-weight:700;margin-top:6px;color:#9A5B00;}
  .empty{color:var(--muted);text-align:center;padding:30px;background:#fff;border:1px solid var(--line);border-radius:16px;}
  .ntf{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;}
  .ntf b{display:block;color:var(--navy);} .ntf small{color:var(--muted);} .ntf.unread{background:#F2FBFA;}
  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:18px;}
  .sec h2{font-size:15.5px;margin:0 0 6px;color:var(--navy);}
  .ov{position:fixed;inset:0;background:rgba(11,29,54,.5);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:90;overflow:auto;}
  .ov.open{display:flex;} .modal{background:var(--cream);width:min(520px,100%);border-radius:18px;overflow:hidden;margin:auto;}
  .modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);}
  .modal .mh h3{margin:0;font-size:17px;} .modal .mb{padding:14px;}
  .mx{width:32px;height:32px;border:none;background:var(--cream);border-radius:8px;font-size:18px;cursor:pointer;}
  .s-no_show{background:#FDECEC;color:#B42318;}
  .acts .go{background:var(--teal);border-color:var(--teal);color:#fff;} .acts .vid{background:#3949AB;border-color:#3949AB;color:#fff;}
  .sig{font-size:12.5px;font-weight:800;color:#0B5563;margin-top:6px;}
  .cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--navy);margin-top:8px;cursor:pointer;}
  .cmpbar{position:sticky;bottom:12px;display:none;justify-content:center;margin-top:10px;z-index:5;}
  .cmpbar button{font-family:var(--ff);font-weight:900;font-size:14px;background:var(--navy);color:#fff;border:none;border-radius:100px;padding:10px 20px;box-shadow:0 6px 18px rgba(11,29,54,.25);cursor:pointer;}
  .ctab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;}
  .ctab th,.ctab td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;}
  .ctab th{color:var(--muted);font-weight:800;width:92px;} .ctab td b{color:var(--navy);} .ctab .best{color:#137a3e;font-weight:900;}
  .rate{display:flex;gap:4px;direction:ltr;justify-content:flex-end;} .rate button{border:none;background:none;font-size:28px;cursor:pointer;color:#D9D4CC;padding:0 2px;} .rate button.on{color:#F59E0B;}
  .fl{font-weight:800;font-size:13.5px;color:var(--navy);margin:10px 0 4px;} .stars{color:#F59E0B;}
  textarea.in2{width:100%;box-sizing:border-box;font-family:var(--ff);font-size:14px;border:1.5px solid var(--line-2);border-radius:10px;padding:8px;min-height:70px;}
  .btn2{font-family:var(--ff);font-weight:900;font-size:14px;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;margin-top:10px;}
  .msg{font-size:13px;font-weight:700;margin-top:8px;} .msg.err{color:#B42318;} .msg.ok{color:#137a3e;}
</style>
</head>
<body data-mode="client">
<div id="hz-header"></div>
<div class="wrap2" id="app">
  <h1 data-ar="حجوزات المعاينة" data-en="My viewings">حجوزات المعاينة</h1>
  <div class="sub" data-ar="مواعيد المعاينة اللي طلبتها، وحالة كل واحد." data-en="The viewings you requested and their status.">مواعيد المعاينة اللي طلبتها، وحالة كل واحد.</div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">…</div></div>
  <div class="cmpbar" id="cmpBar"><button onclick="openCompare()"></button></div>
  <div class="sec"><h2 data-ar="التنبيهات" data-en="Notifications">التنبيهات</h2><div id="ntf"></div></div>
</div>
<div class="ov" id="ovMove" onclick="if(event.target===this)this.classList.remove('open')"><div class="modal">
  <div class="mh"><h3 data-ar="طلب تغيير الميعاد" data-en="Request a new time">طلب تغيير الميعاد</h3><button class="mx" onclick="document.getElementById('ovMove').classList.remove('open')">×</button></div>
  <div class="mb"><div id="moveBox"></div></div>
</div></div>
<div class="ov" id="ovRate" onclick="if(event.target===this)this.classList.remove('open')"><div class="modal">
  <div class="mh"><h3 data-ar="قيّم المعاينة" data-en="Rate your viewing">قيّم المعاينة</h3><button class="mx" onclick="document.getElementById('ovRate').classList.remove('open')">×</button></div>
  <div class="mb" id="rateBox"></div>
</div></div>
<div class="ov" id="ovCmp" onclick="if(event.target===this)this.classList.remove('open')"><div class="modal" style="width:min(760px,100%)">
  <div class="mh"><h3 data-ar="مقارنة الوحدات اللي عاينتها" data-en="Compare viewed properties">مقارنة الوحدات اللي عاينتها</h3><button class="mx" onclick="document.getElementById('ovCmp').classList.remove('open')">×</button></div>
  <div class="mb" style="overflow-x:auto" id="cmpBox"></div>
</div></div>
<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=19"></script>
<script src="/assets/broker-session.js?v=1"></script>
<script src="/assets/booking.js?v=2"></script>
<script>
const $=id=>document.getElementById(id);
const L=(a,e)=>(window.HZ&&HZ.lang==='en')?e:a;
const esc=s=>(s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=iso=>new Date(iso).toLocaleString(L('ar-EG','en-GB'),{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',timeZone:'Africa/Cairo'});
const STATUS={pending:['مستني تأكيد البروكر','Waiting for the broker'],confirmed:['مؤكد ✅','Confirmed ✅'],completed:['تمت','Completed'],no_show:['اتسجّلت إنك ماجيتش','Marked as missed'],rejected:['مرفوض','Rejected'],cancelled:['ملغي','Cancelled']};
const ERR={bad_status:['الزرار ده بيشتغل يوم الميعاد بس.','Only available on the day of the viewing.'],already_rated:['إنت قيّمت المعاينة دي قبل كده.','You already rated this viewing.'],bad_rating:['اختار النجوم الأول.','Pick the stars first.']};
const stars=n=>'★'.repeat(n||0)+'☆'.repeat(5-(n||0));
const fmtN=n=>n==null?'—':Number(n).toLocaleString(L('ar-EG','en-US'));
let S=null, ROWS=[], TAB='up', PICK=new Set(), RATE_DONE=false;
async function boot(){
  S=await HZ.requireSession(); if(!S) return;
  $('tabs').innerHTML=[['up',L('الجاية','Upcoming')],['past',L('السابقة','Past')]].map(([k,t])=>`<button data-k="${k}" onclick="TAB='${k}';render()">${t}</button>`).join('');
  await load(); setInterval(()=>{ if(!document.hidden) load(); },30000);
}
async function load(){
  try{ ROWS=await HZ.sbAuth('/rpc/appt_my_list',S.token,'POST',{})||[]; }catch(e){ ROWS=[]; }
  let n=[]; try{ n=await HZ.sbAuth('/crm_notifications?user_id=eq.'+S.uid+'&or=(type.like.appt_*,type.eq.price_alert)&select=*&order=created_at.desc&limit=10',S.token)||[]; }catch(e){}
  $('ntf').innerHTML=n.length?n.map(x=>`<div class="ntf${x.read_at?'':' unread'}"><div><b>${x.url?`<a href="${esc(x.url)}" style="color:inherit">${esc(x.title)}</a>`:esc(x.title)}</b>${esc(x.body||'')}<br><small>${esc(new Date(x.created_at).toLocaleString(L('ar-EG','en-GB'),{dateStyle:'short',timeStyle:'short'}))}</small></div></div>`).join('')
    :`<div style="color:var(--muted);font-size:13px;padding:8px">${L('مفيش تنبيهات لسه.','No notifications yet.')}</div>`;
  const unread=n.filter(x=>!x.read_at).map(x=>x.id);
  if(unread.length) HZ.sbAuth('/crm_notifications?id=in.('+unread.join(',')+')',S.token,'PATCH',{read_at:new Date().toISOString()},{Prefer:'return=minimal'}).catch(()=>{});
  render();
  // a "rate your viewing" notification links here with ?rate=<id>
  const rid=new URLSearchParams(location.search).get('rate');
  if(rid&&!RATE_DONE){ RATE_DONE=true; const r=ROWS.find(x=>x.id===rid); if(r&&r.status==='completed'&&!r.interest) openRate(rid); }
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===TAB));
  const now=Date.now();
  const up=r=>(r.status==='pending'||r.status==='confirmed')&&new Date(r.ends_at)>now;
  const list=ROWS.filter(r=>TAB==='up'?up(r):!up(r));
  if(TAB==='up') list.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  $('list').innerHTML=list.length?list.map(r=>{
    const st=r.status==='cancelled'&&r.status_reason==='expired'?L('انتهى من غير رد','Expired — no reply'):L(STATUS[r.status][0],STATUS[r.status][1]);
    const open=r.status==='pending'||r.status==='confirmed';
    const wa=r.broker_phone?String(r.broker_phone).replace(/\D/g,'').replace(/^0/,'20'):'';
    // "on my way / arrived" buttons: confirmed, from 4h before the start until 1h after the end
    const live=r.status==='confirmed'&&now>=new Date(r.starts_at)-4*36e5&&now<=new Date(r.ends_at).getTime()+36e5;
    const video=r.kind==='video';
    return `<div class="bk"><div class="im" style="${r.cover?`background-image:url('${esc(r.cover)}')`:''}"></div><div class="in">
      <div class="t">${esc(r.listing_title||'')}</div>
      <div class="m">📅 ${esc(dt(r.starts_at))}<br>${video?`🎥 ${L('معاينة بمكالمة فيديو','Video-call viewing')}`:`📍 ${esc([r.area,r.address].filter(Boolean).join(' — ')||'—')}`}${r.broker_name?`<br>🏢 ${esc(r.broker_name)}`:''}</div>
      <span class="badge s-${r.status}">${esc(st)}</span>
      ${r.client_signal&&open?`<div class="sig">${r.client_signal==='arrived'?L('📍 البروكر عرف إنك وصلت','📍 The broker knows you arrived'):L('🚗 البروكر عرف إنك في الطريق','🚗 The broker knows you are on the way')}</div>`:''}
      ${r.interest?`<div class="sig">${L('تقييمك','Your rating')}: <span class="stars">${stars(r.interest)}</span></div>`:''}
      ${video&&r.status==='pending'?`<div class="note">${L('لينك المكالمة هيظهر هنا أول ما البروكر يأكّد.','The call link appears here once the broker confirms.')}</div>`:''}
      ${r.status==='pending'?`<div class="note">⏳ ${L('الميعاد محجوز ليك لحد','Held for you until')} ${esc(dt(r.hold_expires_at))}</div>`:''}
      ${r.status_reason&&r.status_reason!=='expired'?`<div class="note">${L('السبب','Reason')}: ${esc(r.status_reason)}</div>`:''}
      <div class="acts">
        ${video&&r.video_url?`<a class="vid" target="_blank" rel="noopener" href="${esc(r.video_url)}">🎥 ${L('ادخل مكالمة الفيديو','Join the video call')}</a>`:''}
        ${live&&!video&&r.client_signal!=='arrived'?`${r.client_signal!=='on_the_way'?`<button class="go" onclick="signal('${r.id}','on_the_way')">🚗 ${L('أنا في الطريق','On my way')}</button>`:''}<button class="go" onclick="signal('${r.id}','arrived')">📍 ${L('وصلت','I have arrived')}</button>`:''}
        ${r.status==='completed'&&!r.interest?`<button class="go" onclick="openRate('${r.id}')">⭐ ${L('قيّم المعاينة','Rate the viewing')}</button>`:''}
        ${r.listing_id?`<a href="/listing/${r.listing_id}">🏠 ${L('صفحة الوحدة','Property')}</a>`:''}
        ${wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wa}">${L('كلّم البروكر','Message the broker')}</a>`:''}
        ${open?`<button onclick="moveIt('${r.id}','${r.listing_id}')">🔁 ${L('غيّر الميعاد','Change time')}</button><button class="no" onclick="cancelIt('${r.id}')">${L('إلغاء الحجز','Cancel')}</button>`:''}
        ${!open&&r.listing_id&&r.status!=='completed'?`<a href="/listing/${r.listing_id}#book">📅 ${L('احجز ميعاد تاني','Book again')}</a>`:''}
      </div>
      ${r.listing_id&&r.price?`<label class="cmp"><input type="checkbox" ${PICK.has(r.id)?'checked':''} onchange="pick('${r.id}',this.checked)"> ${L('ضيفها للمقارنة','Add to compare')}</label>`:''}
      </div></div>`; }).join('')
    :`<div class="empty">${TAB==='up'?L('مفيش حجوزات جاية. افتح أي وحدة واحجز معاينة من صفحتها.','No upcoming viewings. Open any property and book from its page.'):L('مفيش حجوزات سابقة.','No past bookings.')}</div>`;
  cmpBar();
}
function cmpBar(){ const b=$('cmpBar'); b.style.display=PICK.size>=2?'flex':'none';
  b.firstElementChild.textContent=L(`قارن ${PICK.size} وحدات`,`Compare ${PICK.size} properties`); }
window.pick=(id,on)=>{ if(on){ if(PICK.size>=4){ alert(L('تقدر تقارن لحد 4 وحدات.','Up to 4 properties.')); render(); return; } PICK.add(id); } else PICK.delete(id); cmpBar(); };
window.openCompare=()=>{
  // one column per property (the same listing booked twice counts once)
  const seen=new Set(), rs=ROWS.filter(r=>PICK.has(r.id)&&!seen.has(r.listing_id)&&seen.add(r.listing_id));
  const ppm=r=>r.price&&r.size_sqm?Math.round(r.price/r.size_sqm):null;
  const best=(f,low)=>{ const v=rs.map(f).filter(x=>x!=null); return v.length>1?(low?Math.min(...v):Math.max(...v)):null; };
  const bP=best(r=>r.price,true), bS=best(r=>r.size_sqm,false), bM=best(ppm,true), bI=best(r=>r.interest,false);
  const cell=(v,b,txt)=>`<td class="${v!=null&&v===b?'best':''}">${txt}</td>`;
  const purpose=r=>r.purpose==='rent'?L('إيجار','Rent'):r.purpose==='sale'?L('بيع','Sale'):'—';
  $('cmpBox').innerHTML=`<table class="ctab">
    <tr><th></th>${rs.map(r=>`<td><b>${esc(r.listing_title||'')}</b></td>`).join('')}</tr>
    <tr><th>${L('المنطقة','Area')}</th>${rs.map(r=>`<td>${esc(r.area||'—')}</td>`).join('')}</tr>
    <tr><th>${L('الغرض','Purpose')}</th>${rs.map(r=>`<td>${purpose(r)}</td>`).join('')}</tr>
    <tr><th>${L('السعر','Price')}</th>${rs.map(r=>cell(r.price,bP,fmtN(r.price)+(r.price?L(' ج',' EGP'):''))).join('')}</tr>
    <tr><th>${L('المساحة','Size')}</th>${rs.map(r=>cell(r.size_sqm,bS,r.size_sqm?fmtN(r.size_sqm)+L(' م²',' m²'):'—')).join('')}</tr>
    <tr><th>${L('سعر المتر','Price / m²')}</th>${rs.map(r=>cell(ppm(r),bM,ppm(r)?fmtN(ppm(r))+L(' ج',' EGP'):'—')).join('')}</tr>
    <tr><th>${L('الغرف','Bedrooms')}</th>${rs.map(r=>`<td>${r.bedrooms??'—'}</td>`).join('')}</tr>
    <tr><th>${L('الحمامات','Bathrooms')}</th>${rs.map(r=>`<td>${r.bathrooms??'—'}</td>`).join('')}</tr>
    <tr><th>${L('إعجابك بيها','Your interest')}</th>${rs.map(r=>cell(r.interest,bI,r.interest?`<span class="stars">${stars(r.interest)}</span>`:'—')).join('')}</tr>
    <tr><th></th>${rs.map(r=>`<td><a href="/listing/${r.listing_id}" style="font-weight:800">${L('افتح الوحدة','Open')}</a></td>`).join('')}</tr></table>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">${L('الأخضر = الأفضل في الصف ده (أقل سعر، أكبر مساحة، أعلى تقييم منك).','Green = best in that row (lowest price, biggest size, your highest rating).')}</div>`;
  $('ovCmp').classList.add('open');
};
window.signal=async(id,sig)=>{
  try{ const r=await HZ.sbAuth('/rpc/appt_client_signal',S.token,'POST',{p_id:id,p_signal:sig});
    if(!r||!r.ok){ const e=ERR[r&&r.error]; alert(e?L(e[0],e[1]):L('تعذّر الإرسال.','Could not send.')); } }
  catch(e){ alert(L('تعذّر الإرسال.','Could not send.')); }
  load(); };
let RATE={};
window.openRate=(id)=>{ RATE={id,interest:0,broker:0};
  const row=(k,lbl)=>`<div class="fl">${lbl}</div><div class="rate" id="r_${k}">${[1,2,3,4,5].map(n=>`<button type="button" onclick="setStar('${k}',${n})">★</button>`).join('')}</div>`;
  $('rateBox').innerHTML=`${row('interest',L('الوحدة عجبتك قد إيه؟','How much did you like the property?'))}
    ${row('broker',L('تقييمك للبروكر (الالتزام والتعامل)','How was the broker (on time, helpful)?'))}
    <div class="fl">${L('تعليق (اختياري)','Comment (optional)')}</div><textarea class="in2" id="rComment" maxlength="500"></textarea>
    <button class="btn2" onclick="sendRate()">${L('إرسال التقييم','Send')}</button><div class="msg" id="rMsg"></div>`;
  $('ovRate').classList.add('open'); };
window.setStar=(k,n)=>{ RATE[k]=n; [...$('r_'+k).children].forEach((b,i)=>b.classList.toggle('on',i<n)); };
window.sendRate=async()=>{ const m=$('rMsg');
  if(!RATE.interest||!RATE.broker){ m.className='msg err'; m.textContent=L(ERR.bad_rating[0],ERR.bad_rating[1]); return; }
  try{ const r=await HZ.sbAuth('/rpc/appt_feedback_submit',S.token,'POST',{p_id:RATE.id,p_interest:RATE.interest,p_broker_rating:RATE.broker,p_comment:$('rComment').value.trim()||null});
    if(!r||!r.ok){ const e=ERR[r&&r.error]; m.className='msg err'; m.textContent=e?L(e[0],e[1]):L('تعذّر الإرسال.','Could not send.'); return; }
    m.className='msg ok'; m.textContent=L('شكراً! تقييمك وصل 🙏','Thanks! 🙏'); setTimeout(()=>{ $('ovRate').classList.remove('open'); load(); },1200);
  }catch(e){ m.className='msg err'; m.textContent=L('تعذّر الإرسال.','Could not send.'); } };
window.cancelIt=async(id)=>{ const reason=prompt(L('سبب الإلغاء (اختياري):','Reason (optional):'),''); if(reason===null) return;
  try{ const r=await HZ.sbAuth('/rpc/appt_action',S.token,'POST',{p_id:id,p_action:'cancel',p_reason:reason||null}); if(!r||!r.ok) alert(L('تعذّر الإلغاء.','Could not cancel.')); }catch(e){ alert(L('تعذّر الإلغاء.','Could not cancel.')); }
  load(); };
window.moveIt=(id,listing)=>{ $('ovMove').classList.add('open');
  HZBook.mount($('moveBox'),{listingId:listing,mode:'reschedule',apptId:id,onDone:()=>setTimeout(()=>{ $('ovMove').classList.remove('open'); load(); },1800)}); };
boot();
</script>
