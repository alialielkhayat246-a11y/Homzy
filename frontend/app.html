<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />

<meta name="keywords" content="مشاريع عقارية مصر, شقق للبيع, فيلات, عقارات التجمع, عقارات العاصمة الادارية, تصفح عقارات, أسعار الوحدات, خطط تقسيط" />

<style>
  .tabs{display:flex; gap:8px; padding:18px 0 0;}
  .tab{font-family:var(--ff); font-weight:700; font-size:15px; cursor:pointer; padding:10px 20px; border-radius:100px; border:1.5px solid var(--line-2); background:#fff; color:var(--navy);}
  .tab.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .filters{display:flex; gap:10px; flex-wrap:wrap; padding:16px 0; align-items:center;}
  .filters input, .filters select{font-family:var(--ff); font-size:14px; padding:11px 14px; border:1.5px solid var(--line-2); border-radius:12px; background:#fff; color:var(--navy); outline:none;}
  .filters input:focus, .filters select:focus{border-color:var(--teal);}
  .filters input[type=search]{flex:1; min-width:200px;}
  .rescount{color:var(--muted); font-size:14px; margin-inline-start:auto;}
  .infobar{background:var(--teal-l); color:var(--teal-d); border:1px solid var(--line); border-radius:12px; padding:11px 15px; font-size:14px; font-weight:600; margin-top:14px; display:none;}
  .infobar.show{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .infobar span{flex:1; min-width:200px;}
  .btn-sm{padding:8px 16px; font-size:13.5px; white-space:nowrap;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding-bottom:20px;}
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:36px 16px;}
  .mkempty{background:#fff; border:1px solid var(--line,#E6DDCF); border-radius:20px; padding:48px 28px; max-width:620px; margin:8px auto 40px;}
  .mkempty .mke-ic{font-size:44px; line-height:1;}
  .mkempty h3{margin:14px 0 8px; color:var(--navy,#0B1D36); font-size:22px;}
  .mkempty p{color:var(--muted,#66717F); font-size:15.5px; line-height:1.7; max-width:44ch; margin:0 auto;}
  .mkempty .mke-cta{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
  .loadmore{text-align:center; padding:6px 0 50px;}
  @media(max-width:1000px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:480px){ .grid{grid-template-columns:1fr;} .filters input[type=search]{min-width:100%;} }
  /* detail drawer */
  .overlay{position:fixed; inset:0; z-index:90; background:rgba(11,29,54,.55); backdrop-filter:blur(3px); display:none;}
  .overlay.open{display:flex; animation:fade .2s;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .drawer{background:var(--cream); width:min(560px,100%); height:100%; overflow-y:auto; box-shadow:var(--shadow); animation:slide .25s ease;}
  @keyframes slide{from{transform:translateX(-24px); opacity:.6;} to{transform:none; opacity:1;}}
  .dhead{position:relative; height:220px; background:#e9e2da center/cover no-repeat;}
  .dhead .close{position:absolute; top:14px; inset-inline-end:14px; width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.92); border:none; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;}
  .dhead .mk2{position:absolute; bottom:14px; inset-inline-start:14px; background:var(--teal); color:#fff; font-size:11px; font-weight:800; padding:5px 12px; border-radius:100px;}
  .dbody{padding:20px;}
  .dbody h2{font-size:23px;} .dbody .sub{color:var(--muted); font-size:15px; margin-top:4px;}
  .dchips{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
  .dchips .c{background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; font-weight:600; color:#40506a;}
  .dsec{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px;}
  .dsec h3{font-size:16px; margin-bottom:10px;} .dsec p{color:#40506a; font-size:14px;}
  .utable{width:100%; border-collapse:collapse; font-size:13px;}
  .utable th{text-align:start; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  .utable td{padding:9px 8px; border-bottom:1px solid var(--line); color:#40506a;}
  .utable tr:last-child td{border-bottom:none;} .utable .pr{color:var(--teal-d); font-weight:800; white-space:nowrap;}
  .gallery{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .gallery img{height:120px; border-radius:12px; flex:none; object-fit:cover; border:1px solid var(--line);}
  .dactions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; position:sticky; bottom:0; background:linear-gradient(transparent,var(--cream) 30%); padding:14px 0 4px;}
  .dactions .btn{flex:1; min-width:130px;}
  .utscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .utscroll .utable{min-width:560px;}
  .plans{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .plans p{color:#40506a; font-size:12.5px; line-height:1.5; background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:7px 10px;}
  .devlink{display:inline-block; margin-top:8px; color:var(--teal-d); font-size:13px; font-weight:700; text-decoration:none; word-break:break-all;}
  .devgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .devchip{text-align:start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer; font-family:var(--ff); transition:border-color .15s, transform .15s;}
  .devchip:hover{border-color:var(--teal); transform:translateY(-2px);}
  .devchip b{display:block; font-size:13.5px; color:var(--navy); line-height:1.3;}
  .devchip span{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
  .viewbox{border:1.5px solid var(--teal); background:var(--teal-l);}
  .viewbox .vin{width:100%; box-sizing:border-box; font-family:var(--ff); font-size:14px; padding:11px 13px; margin-bottom:9px; border:1.5px solid var(--line-2); border-radius:11px; background:#fff; color:var(--navy); outline:none;}
  .viewbox .vin:focus{border-color:var(--teal);}
  .viewbox textarea.vin{resize:vertical;}
  .viewbox .btn{width:100%;}
  .vmsg{margin-top:10px; font-size:13.5px; font-weight:700; line-height:1.6;}
  .vmsg.err{color:#B42318;} .vmsg.ok{color:#1E8E5A;}
  @media(max-width:480px){ .devgrid{grid-template-columns:1fr;} }
</style>
</head>

<div id="hz-header"></div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabProjects" onclick="switchTab('projects')" data-ar="مشاريع المطوّرين" data-en="Developer projects">مشاريع المطوّرين</button>
    <button class="tab" id="tabMarket" onclick="switchTab('market')" data-ar="سوق العقارات" data-en="Marketplace">سوق العقارات</button>
  </div>
  <div class="infobar" id="listInfo">
    <span data-ar="عايز تعرض وحدتك؟ سجّل كبروكر (اسم الشركة + رقم موبايل) وابدأ تضيف وحداتك وتظهر في السوق." data-en="Want to list your unit? Register as a broker (company + phone) and start adding units to appear in the market.">عايز تعرض وحدتك؟ سجّل كبروكر (اسم الشركة + رقم موبايل) وابدأ تضيف وحداتك وتظهر في السوق.</span>
    <a class="btn btn-teal btn-sm" href="/leads?register=1" data-ar="سجّل كبروكر" data-en="Register as broker">سجّل كبروكر</a>
  </div>

  <div class="filters" id="projFilters">
    <input type="search" id="q" data-ph-ar="ابحث باسم المشروع أو المطوّر…" data-ph-en="Search by project or developer…" oninput="debouncedLoad()" />
    <select id="fArea" onchange="loadProjects(true)"><option value="" data-ar="كل المناطق" data-en="All areas">كل المناطق</option></select>
    <select id="fBeds" onchange="loadProjects(true)">
      <option value="" data-ar="كل الغرف" data-en="Any rooms">كل الغرف</option>
      <option value="0" data-ar="استوديو" data-en="Studio">استوديو</option>
      <option value="1" data-ar="غرفة" data-en="1 bed">غرفة</option>

      <option value="3" data-ar="٣ غرف" data-en="3 beds">٣ غرف</option>
      <option value="4" data-ar="٤ غرف" data-en="4 beds">٤ غرف</option>

      <option value="" data-ar="أي ميزانية" data-en="Any budget">أي ميزانية</option>
      <option value="-2000000" data-ar="حتى ٢ مليون" data-en="Up to 2M">حتى ٢ مليون</option>
      <option value="2000000-4000000" data-ar="٢ – ٤ مليون" data-en="2 – 4M">٢ – ٤ مليون</option>
      <option value="4000000-6000000" data-ar="٤ – ٦ مليون" data-en="4 – 6M">٤ – ٦ مليون</option>
      <option value="6000000-10000000" data-ar="٦ – ١٠ مليون" data-en="6 – 10M">٦ – ١٠ مليون</option>
      <option value="10000000-20000000" data-ar="١٠ – ٢٠ مليون" data-en="10 – 20M">١٠ – ٢٠ مليون</option>
      <option value="20000000-" data-ar="أكتر من ٢٠ مليون" data-en="20M+">أكتر من ٢٠ مليون</option>
    </select>
    <select id="fReady" onchange="loadProjects(true)">
      <option value="" data-ar="كل الحالات" data-en="Any status">كل الحالات</option>
      <option value="ready" data-ar="استلام فوري" data-en="Ready to move">استلام فوري</option>
      <option value="offplan" data-ar="تحت الإنشاء" data-en="Off-plan">تحت الإنشاء</option>

    <select id="fSort" onchange="loadProjects(true)">
      <option value="recent" data-ar="الأحدث" data-en="Newest">الأحدث</option>
      <option value="price_asc" data-ar="السعر: من الأقل" data-en="Price: low to high">السعر: من الأقل</option>
      <option value="price_desc" data-ar="السعر: من الأعلى" data-en="Price: high to low">السعر: من الأعلى</option>

    <span class="rescount" id="projCount"></span>
  </div>

  <div class="filters" id="marketFilters" style="display:none">
    <input type="search" id="mq" data-ph-ar="ابحث في السوق…" data-ph-en="Search the marketplace…" oninput="debouncedLoadMarket()" />
    <select id="mPurpose" onchange="loadMarket()">
      <option value="" data-ar="بيع وإيجار" data-en="Buy & rent">بيع وإيجار</option>
      <option value="sale" data-ar="للبيع" data-en="For sale">للبيع</option>

  <div class="grid" id="grid"></div>
  <div class="loadmore" id="loadMoreWrap" style="display:none">
    <button class="btn btn-navy" id="loadMoreBtn" onclick="loadProjects(false)" data-ar="عرض المزيد" data-en="Load more">عرض المزيد</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeDetail()"><div class="drawer" id="drawer"></div></div>

<div id="hz-footer"></div>
<script src="/assets/homzy.js"></script>
<script>
const sb=HZ.sb, esc=HZ.esc;
const money=n=>{ if(n==null||isNaN(n)) return ''; return Number(n).toLocaleString('en-US')+(HZ.lang==='ar'?' ج.م':' EGP'); };
const L={
  ar:{beds:'غرف',br:'غرف',sqm:'م²',delivery:'التسليم',units:'الوحدات المتاحة',type:'النوع',size:'المساحة',price:'السعر',plan:'خطة السداد',from:'يبدأ من',about:'عن المطوّر',amen:'المميزات',noproj:'مفيش نتائج بالمعايير دي — جرّب تغيّر الفلاتر.',brochure:'تحميل البروشور',whatsapp:'تواصل واتساب',homzy:'اسأل Homzy عنه',studio:'استوديو',
      down:'المقدم',install:'التقسيط',years:'سنة',reqview:'اطلب معاينة',othersby:'مشاريع تانية لنفس المطوّر',ph_name:'اسمك',ph_phone:'رقم موبايلك',ph_time:'الوقت المفضّل للمعاينة (اختياري)',ph_note:'أي ملاحظة (اختياري)',send:'ابعت الطلب',sending:'بيتبعت…',reqok:'تمام! وصلنا طلبك، وهنتواصل معاك في أقرب وقت لترتيب المعاينة.',reqerr:'حصل خطأ، جرّب تاني.',needphone:'اكتب اسمك ورقم موبايلك عشان نتواصل.',viewtitle:'اطلب معاينة للمشروع'},
  en:{beds:'BR',br:'BR',sqm:'m²',delivery:'Delivery',units:'Available units',type:'Type',size:'Size',price:'Price',plan:'Payment plan',from:'from',about:'About the developer',amen:'Amenities',noproj:'No results — try changing the filters.',brochure:'Download brochure',whatsapp:'WhatsApp',homzy:'Ask Homzy about it',studio:'Studio',
      down:'Down payment',install:'Installments',years:'y',reqview:'Request a viewing',othersby:'More projects by the same developer',ph_name:'Your name',ph_phone:'Your phone',ph_time:'Preferred viewing time (optional)',ph_note:'Any note (optional)',send:'Send request',sending:'Sending…',reqok:'Done! We got your request and will contact you shortly to arrange the viewing.',reqerr:'Something went wrong, try again.',needphone:'Enter your name and phone so we can reach you.',viewtitle:'Request a viewing'}
};
const t=k=>(L[HZ.lang]||L.ar)[k];

/* Tabs */
let TAB='projects';
function switchTab(tab){
  TAB=tab;
  document.getElementById('tabProjects').classList.toggle('on',tab==='projects');
  document.getElementById('tabMarket').classList.toggle('on',tab==='market');
  document.getElementById('projFilters').style.display=tab==='projects'?'flex':'none';
  document.getElementById('marketFilters').style.display=tab==='market'?'flex':'none';
  if(tab==='projects') loadProjects(true); else loadMarket();
}

/* Projects */
let projOffset=0; const PAGE=12; let projLoading=false; let projTotal=0;
function skeletons(n){ document.getElementById('grid').innerHTML=Array.from({length:n}).map(()=>'<div class="pcard skeleton" style="height:300px"></div>').join(''); }
let AREA_GROUPS={};   // display label -> { variants:[raw area strings], projects }
async function loadAreas(){
  try{
    const rows=await sb('/v_city_counts?select=area,projects&order=projects.desc&limit=60');
    // Merge near-duplicate area names (same buckets as the Areas page) so the
    // filter shows ONE entry per area with the summed count — no "Zayed" and
    // "New Zayed" as two options with split numbers.
    const map=new Map();
    rows.forEach(r=>{ if(!r.area) return; const k=HZ.normArea(r.area); const cur=map.get(k);
      if(!cur) map.set(k,{label:r.area, variants:[r.area], projects:r.projects||0});
      else{ cur.projects+=r.projects||0; cur.variants.push(r.area);
        if((r.area||'').length>(cur.label||'').length) cur.label=r.area; } });
    const groups=[...map.values()].sort((a,b)=>b.projects-a.projects).slice(0,30);
    const sel=document.getElementById('fArea'); AREA_GROUPS={};
    groups.forEach(g=>{ AREA_GROUPS[g.label]=g; const o=document.createElement('option');
      o.value=g.label; o.textContent=`${g.label} (${g.projects})`; sel.appendChild(o); });
    const qa=new URLSearchParams(location.search).get('area');
    if(qa){ sel.value=qa;
      if(sel.value!==qa){ const k=HZ.normArea(qa); const g=groups.find(x=>HZ.normArea(x.label)===k); if(g) sel.value=g.label; }
    }
  }catch(e){}
}
function budgetRange(){
  const v=document.getElementById('fBudget').value; if(!v) return [null,null];
  const [a,b]=v.split('-'); return [a?+a:null, b?+b:null];
}
async function loadProjects(reset){
  if(projLoading) return; projLoading=true;
  if(reset){ projOffset=0; skeletons(6); }
  const q=document.getElementById('q').value.trim();
  const areaLabel=document.getElementById('fArea').value;
  const beds=document.getElementById('fBeds').value;
  const ready=document.getElementById('fReady').value;
  const sort=document.getElementById('fSort').value||'recent';
  const [pMin,pMax]=budgetRange();
  // Expand the chosen area into all its raw variants so counts + results agree.
  let areas=null;
  if(areaLabel){ const g=AREA_GROUPS[areaLabel]; areas=(g&&g.variants&&g.variants.length)?g.variants:[areaLabel]; }
  const args={ p_q:q||null, p_areas:areas, p_min:pMin, p_max:pMax,
    p_beds:beds===''?null:+beds, p_ready:ready||null, p_sort:sort,
    p_limit:PAGE, p_offset:projOffset };
  try{
    const rows=(await HZ.rpc('search_projects', args))||[];
    const grid=document.getElementById('grid');
    if(reset) grid.innerHTML='';
    if(reset && rows.length===0) grid.innerHTML='<div class="empty">'+t('noproj')+'</div>';
    rows.forEach(p=>grid.appendChild(projectCard(p)));
    if(rows.length) projTotal=rows[0].total_count||0; else if(reset) projTotal=0;
    projOffset+=rows.length;
    document.getElementById('loadMoreWrap').style.display=(projOffset<projTotal)?'block':'none';
    document.getElementById('projCount').textContent = projTotal
      ? projTotal.toLocaleString('en-US')+(HZ.lang==='ar'?' مشروع':' projects') : '';
    HZ.applyLang();
  }catch(e){ if(reset) document.getElementById('grid').innerHTML='<div class="empty">'+t('noproj')+'</div>'; }
  finally{ projLoading=false; }
}
function relTime(iso){
  if(!iso) return ''; const dt=new Date(iso); const days=Math.floor((Date.now()-dt)/86400000);
  const ar=HZ.lang==='ar';
  if(days<=0) return ar?'اتحدّث النهارده':'updated today';
  if(days===1) return ar?'اتحدّث امبارح':'updated yesterday';
  if(days<30) return ar?`اتحدّث من ${days} يوم`:`updated ${days}d ago`;
  const mo=Math.floor(days/30);
  return ar?`اتحدّث من ${mo} شهر`:`updated ${mo}mo ago`;
}
function bedsLabel(p){
  if(p.beds_min==null) return '';
  const one=v=>v===0?t('studio'):v+' '+t('br');
  return (p.beds_min===p.beds_max)?one(p.beds_min)
    :(p.beds_min===0?t('studio'):p.beds_min)+'–'+one(p.beds_max);
}
function projectCard(p){
  const d=document.createElement('div'); d.className='pcard';
  const name=HZ.lang==='ar'?(p.name_ar||p.name):(p.name||p.name_ar);
  const dev=p.developer_name||'';
  const img=p.cover_image_url?`background-image:url('${esc(p.cover_image_url)}')`:'';
  const ready=p.status&&/ready|available/i.test(p.status);
  const stTxt=ready?(HZ.lang==='ar'?'استلام فوري':'Ready'):(HZ.lang==='ar'?'تحت الإنشاء':'Off-plan');
  const price=p.price_from_min!=null?`<div class="pr">${t('from')} ${money(p.price_from_min)}</div>`:'';
  const chips=[];
  if(p.size_from_min!=null){ const s=p.size_from_min+((p.size_to_max&&p.size_to_max>p.size_from_min)?('–'+p.size_to_max):''); chips.push(`<span class="pill">${s} ${t('sqm')}</span>`); }
  const bl=bedsLabel(p); if(bl) chips.push(`<span class="pill">${bl}</span>`);
  if(p.installment_years_max) chips.push(`<span class="pill">${HZ.lang==='ar'?('تقسيط '+p.installment_years_max+' سنة'):(p.installment_years_max+'y plan')}</span>`);
  const delTxt=p.delivery?esc(p.delivery):(ready?(HZ.lang==='ar'?'جاهز':'ready'):'');
  d.innerHTML=`<div class="img" style="${img}">${p.area?`<span class="tag">${esc(p.area)}</span>`:''}<span class="mk2 ${ready?'rdy':'off'}">${stTxt}</span></div>
    <div class="b">
      <div class="nm">${esc(name)}</div>
      ${dev?`<div class="dv">${esc(dev)}</div>`:''}
      ${price}
      <div class="row">${chips.join('')}</div>
      <div class="meta2"><span class="del">${delTxt?('🔑 '+delTxt):''}</span><span class="upd">${relTime(p.updated_at)}</span></div>
      <button class="det" data-ar="اطلب التفاصيل" data-en="Request details">اطلب التفاصيل</button>
    </div>`;
  d.querySelector('.det').onclick=(e)=>{ e.stopPropagation(); openProject(p.id); };
  d.onclick=()=>openProject(p.id);
  return d;
}
async function openProject(id){
  const ov=document.getElementById('overlay'), dr=document.getElementById('drawer');
  dr.innerHTML='<div style="padding:40px;text-align:center;color:#6B7280">…</div>';
  ov.classList.add('open'); document.body.style.overflow='hidden';
  try{
    const p=(await sb('/projects?select=id,developer_id,name,name_ar,area,description,delivery,status,amenities,cover_image_url,developer:developers(name,about,track_record,phone,website)&id=eq.'+id))[0];
    const units=await sb('/unit_types?select=type,bedrooms,size_from,size_to,price_from,price_to,down_payment,installment_years,payment_plan,finishing,delivery&project_id=eq.'+id+'&order=price_from.asc&limit=40');
    const media=await sb('/project_media?select=kind,url,caption&project_id=eq.'+id+'&limit=20');
    // Other projects by the same developer (so the buyer can explore the portfolio).
    let others=[];
    if(p.developer_id){
      try{ others=await sb('/projects?select=id,name,name_ar,area&developer_id=eq.'+p.developer_id+'&id=neq.'+id+'&area=not.is.null&order=updated_at.desc&limit=8'); }catch(_){}
    }
    dr.innerHTML=projectDetail(p,units,media,others);
    HZ.applyLang();
  }catch(e){ dr.innerHTML='<div style="padding:40px;text-align:center;color:#6B7280">تعذّر تحميل التفاصيل.</div>'; }
}
function unitTypeLabel(u){
  const map={apartment:{ar:'شقة',en:'Apartment'},duplex:{ar:'دوبلكس',en:'Duplex'},penthouse:{ar:'بنتهاوس',en:'Penthouse'},studio:{ar:'استوديو',en:'Studio'},townhouse:{ar:'تاون هاوس',en:'Townhouse'},villa:{ar:'فيلا',en:'Villa'},office:{ar:'مكتب',en:'Office'},clinic:{ar:'عيادة',en:'Clinic'},shop:{ar:'محل',en:'Shop'}};
  const m=map[u.type]; return m?m[HZ.lang]:(u.type||'');
}
let VIEW_CTX=null;   // project context for the active viewing-request form
function projectDetail(p,units,media,others){
  others=others||[];
  const name=HZ.lang==='ar'?(p.name_ar||p.name):(p.name||p.name_ar);
  const dev=p.developer||{};
  const cover=p.cover_image_url||(media.find(m=>m.kind==='image')||{}).url||'';
  const images=media.filter(m=>m.kind==='image'&&m.url);
  const brochure=(media.find(m=>m.kind==='brochure')||{}).url;
  const minPrice=units.map(u=>u.price_from).filter(x=>x).sort((a,b)=>a-b)[0];
  const rows=units.map(u=>{
    const beds=u.bedrooms!=null?(u.bedrooms===0?t('studio'):u.bedrooms+' '+t('br')):'—';
    const size=u.size_from?(u.size_from+(u.size_to&&u.size_to!=u.size_from?('–'+u.size_to):'')+' '+t('sqm')):'—';
    const pr=u.price_from?money(u.price_from):'—';
    const dp=u.down_payment?esc(u.down_payment):'—';
    const inst=u.installment_years?(u.installment_years+' '+t('years')):'—';
    const dl=u.delivery?esc(u.delivery):'—';
    return `<tr><td>${esc(unitTypeLabel(u))}</td><td>${beds}</td><td>${size}</td><td class="pr">${pr}</td><td>${dp}</td><td>${inst}</td><td>${dl}</td></tr>`;
  }).join('');
  // Distinct payment plans across the units (not just the first one).
  const plans=[...new Set(units.map(u=>u.payment_plan).filter(Boolean))].slice(0,3);
  const broch=brochure?`<a class="btn btn-ghost" target="_blank" rel="noopener" href="${esc(brochure)}">📄 ${t('brochure')}</a>`:'';
  const othersHtml=others.length?`<div class="dsec"><h3>${t('othersby')}</h3><div class="devgrid">${
    others.map(o=>{const nm=HZ.lang==='ar'?(o.name_ar||o.name):(o.name||o.name_ar);
      return `<button class="devchip" onclick="openProject('${o.id}')"><b>${esc(nm)}</b>${o.area?`<span>${esc(o.area)}</span>`:''}</button>`;}).join('')
  }</div></div>`:'';
  // PRIMARY (developer project): NO WhatsApp — a viewing request captures the lead
  // (name+phone+project) and the Homzy advisor / team follows up.
  VIEW_CTX={project_id:p.id, name:name, area:p.area||'', developer:dev.name||''};
  const ctx=JSON.stringify({name:name, area:p.area||'', market:'primary'});
  return `
  <div class="dhead" style="${cover?`background-image:url('${esc(cover)}')`:''}">
    <button class="close" onclick="closeDetail()">×</button>
    <span class="mk2">PRIMARY${p.area?' · '+esc(p.area):''}</span>
  </div>
  <div class="dbody">
    <h2>${esc(name)}</h2>
    <div class="sub">${dev.name?esc(dev.name):''}${p.area?' · '+esc(p.area):''}</div>
    <div class="dchips">
      ${p.delivery?`<span class="c">🗓️ ${t('delivery')}: ${esc(p.delivery)}</span>`:''}
      ${p.status?`<span class="c">${esc(p.status)}</span>`:''}
      ${minPrice?`<span class="c">💰 ${t('from')} ${money(minPrice)}</span>`:''}
    </div>
    ${p.description?`<div class="dsec"><p>${esc(p.description)}</p></div>`:''}
    ${images.length?`<div class="dsec"><div class="gallery">${images.map(m=>`<img loading="lazy" src="${esc(m.url)}" alt="">`).join('')}</div></div>`:''}
    ${units.length?`<div class="dsec"><h3>${t('units')}</h3>
      <div class="utscroll"><table class="utable"><thead><tr><th>${t('type')}</th><th>${t('beds')}</th><th>${t('size')}</th><th>${t('price')}</th><th>${t('down')}</th><th>${t('install')}</th><th>${t('delivery')}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${plans.length?`<div class="plans">${plans.map(pl=>`<p>💳 ${esc(pl)}</p>`).join('')}</div>`:''}</div>`:''}
    ${(dev.about||dev.track_record)?`<div class="dsec"><h3>${t('about')}${dev.name?' — '+esc(dev.name):''}</h3><p>${esc(dev.about||'')} ${esc(dev.track_record||'')}</p>${dev.website?`<a class="devlink" target="_blank" rel="noopener" href="${esc(dev.website)}">🌐 ${esc(dev.website)}</a>`:''}</div>`:''}
    ${othersHtml}
    ${p.amenities?`<div class="dsec"><h3>${t('amen')}</h3><p>${esc(p.amenities)}</p></div>`:''}

    <div class="dsec viewbox" id="viewBox">
      <h3>📅 ${t('viewtitle')}</h3>
      <div id="viewForm">
        <input class="vin" id="vName" placeholder="${t('ph_name')}" />
        <input class="vin" id="vPhone" type="tel" inputmode="tel" placeholder="${t('ph_phone')}" />
        <input class="vin" id="vTime" placeholder="${t('ph_time')}" />
        <textarea class="vin" id="vNote" rows="2" placeholder="${t('ph_note')}"></textarea>
        <button class="btn btn-teal" id="vSend" onclick="submitViewing()">${t('send')}</button>
        <div class="vmsg" id="vMsg"></div>
      </div>
    </div>

    <div class="dactions">
      <button class="btn btn-teal" onclick='closeDetail();HZ.openChat({context:${ctx.replace(/'/g,"&#39;")}})'>💬 ${t('homzy')}</button>
      ${broch}
    </div>
  </div>`;
}
async function submitViewing(){
  const name=(document.getElementById('vName').value||'').trim();
  const phone=(document.getElementById('vPhone').value||'').trim();
  const time=(document.getElementById('vTime').value||'').trim();
  const note=(document.getElementById('vNote').value||'').trim();
  const msg=document.getElementById('vMsg');
  if(name.length<2 || phone.replace(/\D/g,'').length<8){ msg.className='vmsg err'; msg.textContent=t('needphone'); return; }
  const btn=document.getElementById('vSend'); btn.disabled=true; const old=btn.textContent; btn.textContent=t('sending');
  const c=VIEW_CTX||{};
  const ctxTxt=(HZ.lang==='ar'?'طلب معاينة':'Viewing request')+': '+(c.name||'')+(c.area?(' · '+c.area):'')+(c.developer?(' — '+c.developer):'');
  const clientMsg=ctxTxt+(time?(HZ.lang==='ar'?(' — الوقت المفضّل: '+time):(' — preferred time: '+time)):'')+(note?(' — '+note):'');
  try{
    await HZ.rpc('upsert_web_lead',{
      p_session_id:'view-'+Math.random().toString(36).slice(2),
      p_name:name||null, p_phone:phone||null, p_context:ctxTxt,
      p_messages:[{role:'user',content:clientMsg}],
      p_lang:HZ.lang,
      p_req:{type:'viewing_request', project_id:c.project_id||null, project:c.name||null, area:c.area||null, preferred_time:time||null, note:note||null}
    });
    document.getElementById('viewForm').innerHTML='<div class="vmsg ok">✅ '+t('reqok')+'</div>';
  }catch(e){ msg.className='vmsg err'; msg.textContent=t('reqerr'); btn.disabled=false; btn.textContent=old; }
}

/* Marketplace (resale, broker-posted) */
// Useful empty state — the marketplace fills as brokers post units. Never leave
// the user staring at "0 results": if they filtered, nudge them to loosen it;
// otherwise explain the market is being activated and capture their request.
function marketEmptyHTML(filtered){
  const ar=HZ.lang==='ar';
  if(filtered){
    return '<div class="empty mkempty"><div class="mke-ic">🔍</div>'
      +'<h3>'+(ar?'مفيش عروض بالمعايير دي':'No listings match these filters')+'</h3>'
      +'<p>'+(ar?'جرّب توسّع المنطقة أو الميزانية، أو سيب طلبك للمستشار وهو يدوّرلك.':'Try widening the area or budget, or leave your request with the advisor.')+'</p>'
      +'<div class="mke-cta"><button class="btn btn-teal" onclick="HZ.openChat()">'+(ar?'اكتب طلبك للمستشار':'Tell the advisor')+'</button></div></div>';
  }
  return '<div class="empty mkempty"><div class="mke-ic">🏗️</div>'
    +'<h3>'+(ar?'سوق العقارات بيتفعّل قريبًا':'The marketplace is being activated')+'</h3>'
    +'<p>'+(ar?'وحدات الـresale الحقيقية من البروكرز في الطريق. سيب طلبك للمستشار وأول ما تظهر وحدة مناسبة نبعتهالك — أو اتصفّح مشاريع المطوّرين دلوقتي.':'Real resale units from brokers are on the way. Leave your request with the advisor and we’ll ping you when a match appears — or browse developer projects now.')+'</p>'
    +'<div class="mke-cta"><button class="btn btn-teal" onclick="HZ.openChat()">'+(ar?'اكتب طلبك للمستشار':'Tell the advisor')+'</button>'
    +'<button class="btn btn-ghost" onclick="switchTab(\'projects\')">'+(ar?'تصفّح مشاريع المطوّرين':'Browse developer projects')+'</button></div></div>';
}
let marketLoading=false;
async function loadMarket(){
  if(marketLoading) return; marketLoading=true; skeletons(8);
  const q=document.getElementById('mq').value.trim();
  const purpose=document.getElementById('mPurpose').value;
  let path='/listings?select=id,title,description,purpose,type,price,area,address,bedrooms,bathrooms,size_sqm,listing_media(url,sort)&status=eq.active&order=created_at.desc&limit=60';
  if(purpose) path+='&purpose=eq.'+purpose;
  if(q){ const s=q.replace(/,/g,' '); path+='&or=('+encodeURIComponent(`title.ilike.*${s}*,area.ilike.*${s}*,description.ilike.*${s}*`)+')'; }
  try{
    const rows=await sb(path);
    const grid=document.getElementById('grid'); grid.innerHTML='';
    if(rows.length===0) grid.innerHTML=marketEmptyHTML(!!(q||purpose));
    rows.forEach(l=>grid.appendChild(listingCard(l)));
    document.getElementById('marketCount').textContent=rows.length+(HZ.lang==='ar'?' عرض':' listings');
    document.getElementById('loadMoreWrap').style.display='none';
    HZ.applyLang();
  }catch(e){ document.getElementById('grid').innerHTML=marketEmptyHTML(false); }
  finally{ marketLoading=false; }
}
function listingCard(l){
  const media=(l.listing_media||[]).map(m=>m.url).filter(Boolean);
  const img=media[0]?`background-image:url('${esc(media[0])}')`:'';
  const d=document.createElement('div'); d.className='pcard';
  const beds=l.bedrooms?`<span class="pill">${l.bedrooms} ${t('br')}</span>`:'';
  const size=l.size_sqm?`<span class="pill">${l.size_sqm} ${t('sqm')}</span>`:'';
  const pur=l.purpose==='rent'?(HZ.lang==='ar'?'إيجار':'Rent'):(HZ.lang==='ar'?'بيع':'Sale');
  d.innerHTML=`<div class="img" style="${img}">${l.area?`<span class="tag">${esc(l.area)}</span>`:''}<span class="mk2" style="background:${l.purpose==='rent'?'#0B5563':'#122744'}">${pur}</span></div>
    <div class="b"><div class="nm">${esc(l.title||'')}</div><div class="row">${beds}${size}</div>
    <div class="pr">${l.price?money(l.price)+(l.purpose==='rent'?(HZ.lang==='ar'?' /شهر':' /mo'):''):''}</div></div>`;
  d.onclick=()=>openListing(l);
  return d;
}
function openListing(l){
  const media=(l.listing_media||[]).map(m=>m.url).filter(Boolean);
  const cover=media[0]||'';
  const pur=l.purpose==='rent'?(HZ.lang==='ar'?'للإيجار':'For rent'):(HZ.lang==='ar'?'للبيع':'For sale');
  const title=l.title||'';
  const ctx=JSON.stringify({name:title, area:l.area||'', market:'resale'});
  // RESALE: WhatsApp allowed (to the broker) + Homzy advisor.
  let wa='';
  if(HZ.brokerWhatsApp){
    const msg=(HZ.lang==='ar'?'مهتم بعرض ':'Interested in ')+title+' — Homzy';
    wa=`<a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/${HZ.brokerWhatsApp}?text=${encodeURIComponent(msg)}">🟢 ${t('whatsapp')}</a>`;
  }
  document.getElementById('drawer').innerHTML=`
  <div class="dhead" style="${cover?`background-image:url('${esc(cover)}')`:''}">
    <button class="close" onclick="closeDetail()">×</button>
    <span class="mk2" style="background:#122744">RESALE · ${pur}</span>
  </div>
  <div class="dbody">
    <h2>${esc(title)}</h2>
    <div class="sub">${l.area?esc(l.area):''}${l.address?' · '+esc(l.address):''}</div>
    <div class="dchips">
      ${l.price?`<span class="c">💰 ${money(l.price)}${l.purpose==='rent'?(HZ.lang==='ar'?' /شهر':' /mo'):''}</span>`:''}
      ${l.bedrooms?`<span class="c">🛏️ ${l.bedrooms} ${t('br')}</span>`:''}
      ${l.size_sqm?`<span class="c">📐 ${l.size_sqm} ${t('sqm')}</span>`:''}
      ${l.bathrooms?`<span class="c">🚿 ${l.bathrooms}</span>`:''}
    </div>
    ${l.description?`<div class="dsec"><p>${esc(l.description)}</p></div>`:''}
    ${media.length>1?`<div class="dsec"><div class="gallery">${media.map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join('')}</div></div>`:''}
    <div class="dactions">
      <button class="btn btn-teal" onclick='closeDetail();HZ.openChat({context:${ctx.replace(/'/g,"&#39;")}})'>💬 ${t('homzy')}</button>
      ${wa}
    </div>
  </div>`;
  document.getElementById('overlay').classList.add('open'); document.body.style.overflow='hidden';
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow=''; }
addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });

let dt; function debouncedLoad(){ clearTimeout(dt); dt=setTimeout(()=>loadProjects(true),350); }
let dm; function debouncedLoadMarket(){ clearTimeout(dm); dm=setTimeout(()=>loadMarket(),350); }

/* React to language changes from the shared toggle. */
document.addEventListener('hz:lang',()=>{ if(TAB==='projects') loadProjects(true); else loadMarket(); });

/* init */
if(new URLSearchParams(location.search).get('list')) document.getElementById('listInfo').classList.add('show');
loadAreas().then(()=>loadProjects(true));
</script>
