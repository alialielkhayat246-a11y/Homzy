<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>/* auth gate */
(function(){try{var k=Object.keys(localStorage).find(function(x){return /sb-.*-auth-token/.test(x)});var t=k?JSON.parse(localStorage.getItem(k)):null;var ok=t&&t.access_token&&(!t.expires_at||t.expires_at*1000>Date.now());if(!ok){location.replace('/login?next='+encodeURIComponent(location.pathname));}}catch(e){location.replace('/login');}})();</script>
<title>Homzy Stays — رحلاتي</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css">
<style>
  .wrap2{max-width:920px;margin:0 auto;padding:26px 22px;}
  .tabs{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap;}
  .tab{padding:9px 16px;border-radius:100px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;cursor:pointer;font-size:14px;}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .bk{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;}
  .bk img{width:150px;height:130px;object-fit:cover;background:#e9eef1;flex:none;}
  .bk .b{padding:14px 16px;flex:1;}
  .bk .t{font-weight:800;font-size:16px;}
  .bk .d{color:#5b6b82;font-size:14px;margin-top:6px;}
  .bk .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .stt{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:100px;}
  .stt.confirmed{background:#E6F6EC;color:#137a3e;} .stt.payment_pending{background:#FFF4E5;color:#B45309;}
  .stt.completed{background:#EAF0FA;color:#1f4e9c;} .stt.cancelled,.stt.rejected{background:#FDECEC;color:#B42318;}
  .stt.pending{background:#F1F0EE;color:#555;} .stt.refunded{background:#EEF6F7;color:#0B5563;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  @media(max-width:560px){ .bk{flex-direction:column;} .bk img{width:100%;height:160px;} }
</style>
</head>
<body data-mode="client">
<div id="hz-header"></div>
<div class="wrap2">
  <h1 data-ar="رحلاتي" data-en="My Stays">رحلاتي</h1>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">…</div></div>
</div>
<div class="ov" id="rvOv" style="position:fixed;inset:0;background:rgba(11,29,54,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:18px">
  <div style="background:#fff;border-radius:18px;max-width:440px;width:100%;padding:24px;max-height:90vh;overflow:auto">
    <h2 style="font-size:20px" data-ar="قيّم إقامتك" data-en="Review your stay">قيّم إقامتك</h2>
    <div id="rvBody" style="margin-top:14px"></div>
    <div class="bkmsg" id="rvMsg" style="margin-top:10px;font-weight:800"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-teal" style="flex:1" onclick="submitReview()" data-ar="إرسال التقييم" data-en="Submit review">إرسال التقييم</button>
      <button class="btn btn-ghost" onclick="document.getElementById('rvOv').style.display='none'" data-ar="إلغاء" data-en="Cancel">إلغاء</button>
    </div>
  </div>
</div>
<style>.stars span{cursor:pointer;font-size:26px;color:#d8dee6;} .stars span.on{color:#F59E0B;} .rvline{display:flex;justify-content:space-between;align-items:center;margin:8px 0;} .rvline .stars span{font-size:20px;}</style>
<div id="hz-footer"></div>
<script src="/assets/homzy.js"></script>
<script>
const ar=()=>HZ.lang==='ar';
const money=n=> n==null?'':Number(n).toLocaleString(ar()?'ar-EG':'en-US');
let BKS=[], CARDS={}, TAB='upcoming', REVIEWED=new Set(), RV_BOOKING=null;
const RCATS=[['cleanliness','النظافة','Cleanliness'],['accuracy','مطابقة الوصف','Accuracy'],['location','الموقع','Location'],['value','القيمة','Value'],['communication','التواصل','Communication'],['checkin','تسجيل الوصول','Check-in']];
const TABS=[['upcoming','قادمة','Upcoming'],['current','حالية','Current'],['completed','منتهية','Completed'],['cancelled','ملغاة','Cancelled']];

function bucket(b){
  const today=new Date().toISOString().slice(0,10);
  if(['cancelled','rejected','refunded'].includes(b.status)) return 'cancelled';
  if(b.status==='completed' || b.check_out<today) return 'completed';
  if(b.check_in<=today && b.check_out>=today) return 'current';
  return 'upcoming';
}
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,a,e])=>{
    const n=BKS.filter(b=>bucket(b)===k).length;
    return `<div class="tab ${k===TAB?'on':''}" onclick="setTab('${k}')">${ar()?a:e}${n?` (${n})`:''}</div>`;
  }).join('');
  const list=BKS.filter(b=>bucket(b)===TAB);
  const el=document.getElementById('list');
  if(!list.length){ el.innerHTML=`<div class="empty">${ar()?'لا توجد حجوزات هنا.':'Nothing here yet.'} <a href="/stays" style="color:var(--teal-d);font-weight:800">${ar()?'ابحث عن إقامة':'Find a stay'}</a></div>`; return; }
  el.innerHTML=list.map(b=>{
    const c=CARDS[b.property_id]||{};
    const stLabels={confirmed:['مؤكد','Confirmed'],payment_pending:['بانتظار الدفع','Payment pending'],completed:['منتهية','Completed'],cancelled:['ملغى','Cancelled'],rejected:['مرفوض','Rejected'],pending:['قيد الانتظار','Pending'],refunded:['مسترجع','Refunded']};
    const sl=(stLabels[b.status]||[b.status,b.status])[ar()?0:1];
    return `<div class="bk">
      <img src="${HZ.esc(c.cover||'')}" onerror="this.style.opacity=.2"/>
      <div class="b">
        <div class="t">${HZ.esc(c.title||(ar()?'إقامة':'Stay'))}</div>
        <div class="d">${HZ.esc([c.area||c.city,c.governorate].filter(Boolean).join('، '))}</div>
        <div class="d">📅 ${b.check_in} → ${b.check_out} · ${b.nights} ${ar()?'ليالي':'nights'} · ${b.guests} ${ar()?'ضيوف':'guests'}</div>
        <div class="foot">
          <span class="stt ${b.status}">${sl}</span>
          <span><b>${money(b.total_amount)}</b> ${b.currency}</span>
        </div>
        ${b.status==='payment_pending'?`<div style="margin-top:10px"><a class="btn btn-teal btn-sm" href="/stays/${b.property_id}">${ar()?'أكمل الدفع':'Complete payment'}</a></div>`:''}
        ${b.status==='confirmed'?`<div class="d" style="margin-top:8px;color:#137a3e">${ar()?'مضيفك:':'Host:'} ${HZ.esc(c.host_name||'')}</div>`:''}
        ${bucket(b)==='completed'&&!REVIEWED.has(b.id)?`<div style="margin-top:10px"><button class="btn btn-teal btn-sm" onclick="openReview('${b.id}')">${ar()?'قيّم إقامتك':'Review your stay'}</button></div>`:''}
        ${REVIEWED.has(b.id)?`<div class="d" style="margin-top:8px;color:#137a3e">★ ${ar()?'شكرًا لتقييمك':'Thanks for your review'}</div>`:''}
      </div></div>`;
  }).join('');
}
window.setTab=(k)=>{ TAB=k; render(); };
async function boot(){
  const s=HZ.session(); if(!s){ location.href='/login?next=/my-stays'; return; }
  try{
    BKS=await HZ.sbAuth('/stay_bookings?guest_id=eq.'+s.uid+'&select=*&order=check_in.desc', s.token)||[];
    try{ const rv=await HZ.sbAuth('/stay_reviews?guest_id=eq.'+s.uid+'&author_role=eq.guest&select=booking_id', s.token)||[]; rv.forEach(r=>REVIEWED.add(r.booking_id)); }catch(e){}
    const ids=[...new Set(BKS.map(b=>b.property_id))];
    if(ids.length){
      const cards=await HZ.sb('/stay_cards?id=in.('+ids.join(',')+')&select=id,title,cover,city,area,governorate,host_name')||[];
      cards.forEach(c=>CARDS[c.id]=c);
    }
  }catch(e){ BKS=[]; }
  // default tab: first non-empty
  const firstNonEmpty=TABS.map(t=>t[0]).find(k=>BKS.some(b=>bucket(b)===k));
  TAB=firstNonEmpty||'upcoming';
  render(); HZ.applyLang();
}
/* ---- guest review ---- */
let RV={};
function starRow(key){ return `<div class="stars" data-key="${key}">`+[1,2,3,4,5].map(i=>`<span data-v="${i}" onclick="setStar('${key}',${i})">★</span>`).join('')+`</div>`; }
window.setStar=(key,v)=>{ RV[key]=v; document.querySelectorAll('.stars[data-key="'+key+'"] span').forEach(s=>s.classList.toggle('on', +s.dataset.v<=v)); };
window.openReview=(bid)=>{
  RV_BOOKING=bid; RV={overall:5}; RCATS.forEach(c=>RV[c[0]]=5);
  document.getElementById('rvBody').innerHTML=
      `<div style="text-align:center;margin-bottom:10px"><div style="font-weight:800;margin-bottom:6px">${ar()?'تقييمك العام':'Overall'}</div>${starRow('overall')}</div>`
    + RCATS.map(c=>`<div class="rvline"><span style="font-weight:700">${ar()?c[1]:c[2]}</span>${starRow(c[0])}</div>`).join('')
    + `<textarea id="rvComment" rows="3" placeholder="${ar()?'شاركنا رأيك (اختياري)':'Share your experience (optional)'}" style="width:100%;margin-top:12px;border:1.5px solid var(--line-2);border-radius:10px;padding:10px;font-family:var(--ff)"></textarea>`;
  ['overall'].concat(RCATS.map(c=>c[0])).forEach(k=>setStar(k,5));
  document.getElementById('rvMsg').textContent='';
  document.getElementById('rvOv').style.display='flex';
};
window.submitReview=async()=>{
  const s=HZ.session(); const msg=document.getElementById('rvMsg');
  const cats={}; RCATS.forEach(c=>cats[c[0]]=RV[c[0]]);
  let r; try{ r=await HZ.sbAuth('/rpc/stay_submit_review', s.token,'POST',{p_booking:RV_BOOKING,p_overall:RV.overall,p_categories:cats,p_comment:(document.getElementById('rvComment').value||'').trim()||null}); }catch(e){ r={ok:false,error:'network'}; }
  if(r&&r.ok){ REVIEWED.add(RV_BOOKING); msg.style.color='#137a3e'; msg.textContent=ar()?'شكرًا! تم إرسال تقييمك ✅':'Thanks! Review submitted ✅'; setTimeout(()=>{document.getElementById('rvOv').style.display='none'; render();},900); }
  else { msg.style.color='#B42318'; msg.textContent=(ar()?'تعذّر الإرسال: ':'Could not submit: ')+((r&&r.error)||''); }
};
document.addEventListener('hz:lang', render);
boot();
</script>
</body>
</html>
