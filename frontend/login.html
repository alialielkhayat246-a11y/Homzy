<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Homzy — تسجيل الدخول</title>
<meta name="description" content="سجّل دخولك إلى Homzy لتصفّح المشاريع والمناطق والتحدث مع المستشار العقاري." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B1D36" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=2">
<style>
  /* ===== Auth page — mobile-first, premium, RTL ===== */
  body{min-height:100svh; background:var(--cream,#F7F2EE);}
  .authwrap{position:relative; min-height:100svh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom)); overflow:hidden;}
  /* faint architectural backdrop (desktop only) — inspired by the Homzy house mark */
  .authbg{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; display:none;}
  .authbg svg{position:absolute; opacity:.05;}
  .authbg .s1{inset-inline-end:-80px; top:-40px; width:420px; color:var(--navy);}
  .authbg .s2{inset-inline-start:-120px; bottom:-90px; width:520px; color:var(--teal);}

  .authcard{position:relative; z-index:1; background:#fff; border:1px solid var(--line,#E6DDCF);
    border-radius:20px; box-shadow:0 18px 50px -30px rgba(11,29,54,.28); width:100%; max-width:400px;
    padding:26px 22px; }
  .brand{display:flex; align-items:center; gap:8px; justify-content:center;}
  .brand img{width:34px; height:34px;}
  .brand b{font-family:var(--fd,'Poppins'); font-size:19px; color:var(--navy,#0B1D36);} .brand b span{color:var(--teal,#0B5563);}
  h1{text-align:center; font-size:20px; color:var(--navy,#0B1D36); margin:14px 0 4px; font-weight:800;}
  .sub{text-align:center; color:var(--muted,#66717F); font-size:13.5px; margin:0 0 18px;}

  /* Google — full width, white, secondary look */
  .gbtn{width:100%; display:flex; align-items:center; justify-content:center; gap:10px; min-height:48px;
    background:#fff; border:1.5px solid var(--line-2,#D8CFC0); border-radius:12px; padding:12px;
    font-family:var(--ff,'Cairo'); font-weight:700; font-size:15px; color:var(--navy,#0B1D36); cursor:pointer;
    transition:border-color .18s, background .18s, box-shadow .18s;}
  .gbtn:hover{border-color:#c9bfae; background:#fcfbfa;}
  .gbtn:active{background:#f5f2ee; transform:translateY(.5px);}
  .gbtn img{width:19px; height:19px; flex:none;}

  .divider{display:flex; align-items:center; gap:12px; color:var(--muted,#66717F); font-size:12.5px; margin:16px 0 14px;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line,#E6DDCF);}

  .fld{display:none; flex-direction:column; margin-bottom:12px;}
  .fld.on{display:flex;}
  label{font-size:13px; font-weight:700; color:var(--navy,#0B1D36); margin-bottom:6px;}
  /* 16px inputs prevent iOS focus-zoom; 48px min height = comfy touch target */
  input{font-family:var(--ff,'Cairo'); font-size:16px; padding:13px 14px; border:1.5px solid var(--line-2,#D8CFC0);
    border-radius:12px; background:#fff; color:var(--navy,#0B1D36); outline:none; width:100%;
    transition:border-color .18s, box-shadow .18s;}
  input:focus{border-color:var(--teal,#0B5563); box-shadow:0 0 0 3px rgba(11,85,99,.12);}
  input::placeholder{color:#a9a196;}

  /* phone with Egypt country code (LTR group so +20 reads naturally) */
  .phone-wrap{display:flex; align-items:stretch; direction:ltr; border:1.5px solid var(--line-2,#D8CFC0);
    border-radius:12px; overflow:hidden; background:#fff; transition:border-color .18s, box-shadow .18s;}
  .phone-wrap:focus-within{border-color:var(--teal,#0B5563); box-shadow:0 0 0 3px rgba(11,85,99,.12);}
  .phone-wrap .cc{display:flex; align-items:center; gap:5px; padding:0 12px; background:#faf8f5;
    border-inline-end:1.5px solid var(--line,#E6DDCF); color:var(--navy,#0B1D36); font-weight:700; font-size:15px; white-space:nowrap;}
  .phone-wrap input{border:none; border-radius:0; box-shadow:none; flex:1; text-align:left; letter-spacing:.5px;}
  .phone-wrap input:focus{box-shadow:none;}

  /* password with eye toggle */
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-inline-end:46px;}
  .eye{position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%); width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; border:none; background:none; cursor:pointer;
    color:var(--muted,#66717F); border-radius:9px;}
  .eye:hover{color:var(--navy,#0B1D36); background:var(--cream,#F7F2EE);} .eye svg{width:20px; height:20px;}

  .forgot{text-align:end; margin:-4px 0 12px;}
  .forgot a{color:var(--muted,#66717F); font-size:12.5px; cursor:pointer; text-decoration:none;}
  .forgot a:hover{color:var(--teal-d,#08414C); text-decoration:underline;}

  /* primary CTA — navy filled, dominant */
  .cta{width:100%; min-height:50px; display:flex; align-items:center; justify-content:center; gap:9px;
    background:var(--navy,#0B1D36); color:#fff; border:1.5px solid var(--navy,#0B1D36); border-radius:12px;
    font-family:var(--ff,'Cairo'); font-weight:800; font-size:16px; cursor:pointer;
    transition:background .18s, transform .06s, box-shadow .18s;}
  .cta:hover{background:var(--navy-2,#122744);}
  .cta:active{transform:translateY(1px);}
  .cta:disabled{opacity:.7; cursor:default;}
  .cta .spin{width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .msg{margin-top:12px; font-size:13px; font-weight:700; text-align:center; line-height:1.6; min-height:16px;}
  .msg.err{color:#B42318;} .msg.ok{color:#137A3E;}

  .switch{text-align:center; margin-top:16px; font-size:14px; color:var(--muted,#66717F);}
  .switch a{color:var(--teal-d,#08414C); font-weight:800; cursor:pointer; text-decoration:none;}
  .switch a:hover{text-decoration:underline;}

  .legal{text-align:center; margin-top:18px; font-size:11.5px; color:#9a9186; line-height:1.7;}
  .legal .lk{color:var(--muted,#66717F); font-weight:700; text-decoration:underline; cursor:pointer;}
  .legal .lk:hover{color:var(--teal-d,#08414C);}

  .back{text-align:center; margin-top:14px;}
  .back a{color:#9a9186; font-size:12.5px; text-decoration:none;}
  .back a:hover{color:var(--muted,#66717F);}

  @media(min-width:768px){
    .authbg{display:block;}
    .authcard{padding:32px 30px; border-radius:22px;}
    h1{font-size:22px;}
  }
  @media(max-width:360px){ .authcard{padding:22px 16px;} .phone-wrap .cc{padding:0 9px; font-size:14px;} }
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://ceoqtkbpdxnkuptnnwjg.supabase.co';
const SB_KEY='sb_publishable_akQqDzkDbBhYJP0q6Z4Dtg_xjQh_Xfb';
const sb = createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
const $=id=>document.getElementById(id);

function nextPath(){
  const n=new URLSearchParams(location.search).get('next')||'';
  return (n.startsWith('/') && !n.startsWith('//')) ? n : '/app';
}
// Normalize any Egyptian input (01x…, +20…, 10x…) to the 20XXXXXXXXXX form the
// backend already expects — so the visual "+20" prefix never breaks auth.
function normPhone(v){
  let d=(v||'').replace(/[^\d]/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(d.startsWith('0')) d='20'+d.slice(1);
  else if(!d.startsWith('20')) d='20'+d;
  return d;
}
const phoneEmail = v => 'p'+normPhone(v)+'@homzy.app';
async function api(path, opts){
  const {data:{session}}=await sb.auth.getSession();
  const tok=session?session.access_token:SB_KEY;
  const r=await fetch(SB_URL+'/rest/v1'+path, Object.assign({headers:{apikey:SB_KEY, Authorization:'Bearer '+tok, 'Content-Type':'application/json'}}, opts||{}));
  if(!r.ok) throw new Error('sb '+r.status+' '+(await r.text()));
  const t=await r.text(); return t?JSON.parse(t):null;
}

// spinner + text for any CTA; guards against double submission
function setLoading(btn, txtEl, on, loadingText, idleText){
  btn.disabled = on;
  txtEl.innerHTML = on ? `<span class="spin" aria-hidden="true"></span>${loadingText}` : idleText;
}

// ---- routing after any successful auth (also handles OAuth redirect back) ----
async function afterAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ return; }
  let prof=null;
  try{ prof=(await api('/profiles?select=phone,full_name,onboarded,role&id=eq.'+session.user.id))[0]; }catch(e){ console.warn('profile fetch failed', e); }
  const hasPhone = prof && prof.phone && (''+prof.phone).replace(/\D/g,'').length>=10;
  if(hasPhone){
    if(prof.onboarded){ const requested=new URLSearchParams(location.search).get('next'); location.replace(prof.role==='broker'&&(!requested||requested==='/app'||requested==='/')?'/crm':nextPath()); }
    else { location.replace('/welcome?next='+encodeURIComponent(nextPath())); }
    return;
  }
  // Google user with no phone yet → completion step
  const meta=session.user.user_metadata||{};
  $('cName').value = (prof&&prof.full_name) || meta.full_name || meta.name || '';
  $('authView').style.display='none';
  $('completeView').style.display='block';
}
afterAuth();

// ---- Google ----
window.googleSignIn=async ()=>{
  const g=$('googleBtn'); g.disabled=true;
  try{
    const redirectTo = location.origin + '/login?next=' + encodeURIComponent(nextPath());
    const {error}=await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo } });
    if(error) throw error;
  }catch(err){ console.error('google signin', err); msg('تعذّر الدخول بجوجل، جرّب تاني.'); g.disabled=false; }
};

// ---- password show / hide ----
window.togglePw=()=>{
  const inp=$('password'), b=$('eyeBtn'), on=inp.type==='password';
  inp.type = on?'text':'password';
  b.setAttribute('aria-pressed', on?'true':'false');
  b.setAttribute('aria-label', on?'إخفاء كلمة المرور':'إظهار كلمة المرور');
  $('eyeIcon').innerHTML = on
    ? '<path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M9.9 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15 15 0 0 1-3.3 3.9M6.1 7.1A15 15 0 0 0 2.5 12S6 18.5 12 18.5c1 0 1.9-.1 2.7-.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
};

// ---- forgot password ----
// NOTE(TODO): phone accounts use synthetic p<phone>@homzy.app emails, so a
// standard email reset link can't be delivered. A real reset needs a WhatsApp/SMS
// OTP reset flow (the WhatsApp OTP hook exists for login OTP but isn't wired to
// password reset yet). Until then we guide the user honestly — no fake backend.
$('forgotLink').addEventListener('click', ()=>{
  msg('لإعادة تعيين كلمة المرور تواصل معنا على hello@homzy-ai.com، أو ادخل باستخدام Google.', false);
});
$('forgotLink').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('forgotLink').click(); }});

// ---- complete profile (Google users) ----
function cmsg(t,ok){ const e=$('cMsg'); e.textContent=t; e.className='msg '+(ok?'ok':(t?'err':'')); }
$('completeForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  if($('cBtn').disabled) return;
  const name=$('cName').value.trim();
  const phoneRaw=$('cPhone').value.trim();
  if(name.length<2){ cmsg('اكتب اسمك.'); $('cName').focus(); return; }
  if(normPhone(phoneRaw).length<11){ cmsg('تأكد من إدخال رقم موبايل مصري صحيح.'); $('cPhone').focus(); return; }
  setLoading($('cBtn'), $('cBtnTxt'), true, 'جاري الحفظ...', 'يلا نبدأ');
  try{
    const {data:{session}}=await sb.auth.getSession();
    await api('/profiles?on_conflict=id', {
      method:'POST',
      headers:{apikey:SB_KEY, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'},
      body:JSON.stringify({ id:session.user.id, full_name:name, phone:normPhone(phoneRaw) })
    });
    location.replace('/welcome?next='+encodeURIComponent(nextPath()));
  }catch(err){ console.error('complete profile', err); cmsg('حصل خطأ، جرّب تاني.'); setLoading($('cBtn'), $('cBtnTxt'), false, '', 'يلا نبدأ'); }
});
window.signOutReset=async ()=>{ await sb.auth.signOut(); location.reload(); };

// ---- phone + password (login / register) ----
let mode='login';
function setMode(m){
  mode=m; const reg=m==='register';
  $('fldName').classList.toggle('on', reg);
  $('authBtnTxt').textContent = reg?'إنشاء حساب':'تسجيل الدخول';
  $('password').autocomplete = reg?'new-password':'current-password';
  $('password').placeholder = reg?'اختر كلمة مرور (٦ أحرف على الأقل)':'أدخل كلمة المرور';
  $('switchTxt').textContent = reg?'عندك حساب؟':'مستخدم جديد؟';
  $('switchLink').textContent = reg?'سجّل دخول':'إنشاء حساب';
  $('forgotLink').parentElement.style.display = reg?'none':'block';
  msg('');
}
$('switchLink').onclick=()=>setMode(mode==='login'?'register':'login');
$('switchLink').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('switchLink').click(); }});

function msg(t,ok){ const el=$('msg'); el.textContent=t; el.className='msg '+(ok?'ok':(t?'err':'')); }
// Map raw Supabase errors → clear Arabic (never surface technical text)
function authErr(m){
  if(/Invalid login|credentials/i.test(m||'')) return 'رقم الموبايل أو كلمة المرور غير صحيحة.';
  if(/already registered|already exists|User already/i.test(m||'')) return 'الرقم ده مسجّل قبل كده — سجّل دخول.';
  if(/at least 6|password/i.test(m||'')) return 'كلمة المرور لازم ٦ أحرف على الأقل.';
  if(/network|fetch|Failed to/i.test(m||'')) return 'مشكلة في الاتصال — تأكد من النت وجرّب تاني.';
  return 'حصل خطأ، جرّب تاني.';
}
$('authForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  if($('authBtn').disabled) return;                 // prevent double submission
  const phone=normPhone($('phone').value), password=$('password').value;
  if(phone.length<11){ msg('تأكد من إدخال رقم موبايل مصري صحيح.'); $('phone').focus(); return; }
  if(password.length<6){ msg('كلمة المرور لازم ٦ أحرف على الأقل.'); $('password').focus(); return; }
  if(mode==='register' && $('name').value.trim().length<2){ msg('اكتب اسمك.'); $('name').focus(); return; }
  const email=phoneEmail($('phone').value);
  setLoading($('authBtn'), $('authBtnTxt'), true, mode==='register'?'جاري إنشاء الحساب...':'جاري تسجيل الدخول...', mode==='register'?'إنشاء حساب':'تسجيل الدخول');
  try{
    if(mode==='register'){
      const {error}=await sb.auth.signUp({ email, password, options:{ data:{ role:'client', phone, name:$('name').value.trim() } } });
      if(error) throw error;
    }else{
      const {error}=await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
    await afterAuth();
    if(!(await sb.auth.getSession()).data.session){ msg('تم إنشاء الحساب — سجّل دخول.', true); setMode('login'); setLoading($('authBtn'), $('authBtnTxt'), false, '', 'تسجيل الدخول'); }
  }catch(err){ console.error('auth', err); msg(authErr(err.message)); setLoading($('authBtn'), $('authBtnTxt'), false, '', mode==='register'?'إنشاء حساب':'تسجيل الدخول'); }
});
</script>
</body>
</html>
