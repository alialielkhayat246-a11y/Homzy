<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>/* auth gate */
(function(){try{var k=Object.keys(localStorage).find(function(x){return /sb-.*-auth-token/.test(x)});var t=k?JSON.parse(localStorage.getItem(k)):null;var ok=t&&t.access_token&&(!t.expires_at||t.expires_at*1000>Date.now());if(!ok){location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));}}catch(e){location.replace('/login');}})();</script>
<title>Homzy — مجتمع البروكرز</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=7">
<style>
  .cm{max-width:860px;margin:0 auto;padding:18px 14px 70px;}
  .cm h1{font-size:22px;margin:0 0 4px;color:var(--navy);} .cm .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px;}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--cream);border-radius:13px;padding:4px;margin-bottom:14px;}
  .tabs button{border:none;background:none;font-family:var(--ff);font-weight:800;font-size:13.5px;line-height:1.35;padding:8px 6px;border-radius:10px;cursor:pointer;color:var(--navy);position:relative;}
  @media(max-width:520px){ .tabs button{font-size:12.5px;} }
  .tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:100px;background:#E5484D;color:#fff;font-size:11px;padding:0 5px;margin-inline-start:4px;}
  .newrow{display:flex;gap:8px;margin-bottom:12px;}
  .newrow button{flex:1;border:none;border-radius:13px;padding:12px 10px;font-family:var(--ff);font-weight:900;font-size:14.5px;cursor:pointer;}
  .newrow .nr{background:#FFF4D6;color:#7A4E00;border:1.5px solid #F3D48A;} .newrow .nu{background:var(--teal);color:#fff;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .seg{display:inline-flex;background:var(--cream);border-radius:11px;padding:3px;}
  .seg button{border:none;background:none;font-family:var(--ff);font-weight:800;font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer;color:var(--navy);white-space:nowrap;}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .bar select,.bar input{border:1.5px solid var(--line-2);border-radius:11px;padding:8px 11px;font-family:var(--ff);font-size:13px;background:#fff;}
  .bar input{flex:1;min-width:140px;} .bar input[type=checkbox]{flex:none;min-width:0;width:16px;height:16px;}
  .note{background:var(--teal-l);color:var(--teal-d);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;margin-bottom:12px;}
  .note a{color:inherit;}
  .pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:11px;}
  .pc.request{border-inline-start:4px solid #F0B429;} .pc.unit{border-inline-start:4px solid var(--teal);}
  .pc.closed,.pc.expired{opacity:.72;}
  .ph{display:flex;gap:9px;align-items:center;}
  .av{width:38px;height:38px;border-radius:11px;background:var(--navy) center/cover no-repeat;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);}
  .who{flex:1;min-width:0;} .who a{font-weight:800;color:var(--navy);text-decoration:none;font-size:14px;}
  .who small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kb{font-size:11.5px;font-weight:900;border-radius:100px;padding:3px 10px;white-space:nowrap;}
  .kb.request{background:#FFF4D6;color:#7A4E00;} .kb.unit{background:var(--teal-l);color:var(--teal-d);}
  .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .facts span{background:var(--cream);border-radius:9px;padding:4px 9px;font-size:12.5px;font-weight:700;color:#40506a;}
  .facts .money{background:#E6F6EC;color:#137a3e;}
  .body{margin-top:9px;font-size:14.5px;color:#26313f;white-space:pre-wrap;line-height:1.7;}
  .lst{display:flex;gap:10px;margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;}
  .lst .im{width:96px;min-height:72px;background:#e9e2da center/cover no-repeat;flex:none;}
  .lst div{padding:7px 4px;font-size:13px;} .lst b{display:block;color:var(--navy);}
  .pill{display:block;width:100%;text-align:start;margin-top:10px;border:1.5px dashed #9ED9CF;background:#F2FBF9;color:var(--teal-d);font-family:var(--ff);font-weight:800;font-size:13px;border-radius:11px;padding:8px 11px;cursor:pointer;}
  .mlist{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .mrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;}
  .mrow .im{width:46px;height:38px;border-radius:7px;background:#e9e2da center/cover no-repeat;flex:none;}
  .mrow .t{flex:1;min-width:0;} .mrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .st{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:9px;padding:3px 9px;background:#F1F1F1;color:#6b7280;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;border-top:1px solid var(--line);padding-top:10px;}
  .acts button,.acts a{font-family:var(--ff);font-size:12.5px;font-weight:800;border-radius:9px;padding:7px 11px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;color:var(--navy);text-decoration:none;}
  .acts .go{background:var(--teal);border-color:var(--teal);color:#fff;} .acts .wait{background:#FFF4E5;border-color:#F3D48A;color:#9A5B00;}
  .acts .ok{background:#E6F6EC;border-color:#BDE5CB;color:#137a3e;} .acts .mute{color:var(--muted);margin-inline-start:auto;}
  .cmts{margin-top:10px;background:var(--cream);border-radius:12px;padding:8px 10px;}
  .cmt{font-size:13.5px;padding:6px 2px;border-bottom:1px solid var(--line);} .cmt:last-of-type{border:none;}
  .cmt b{color:var(--navy);font-size:12.5px;} .cmt small{color:var(--muted);font-size:11px;}
  .cform{display:flex;gap:6px;margin-top:6px;} .cform input{flex:1;border:1.5px solid var(--line-2);border-radius:100px;padding:8px 13px;font-family:var(--ff);font-size:13.5px;}
  .cform button{border:none;border-radius:100px;background:var(--teal);color:#fff;font-weight:800;padding:0 14px;font-family:var(--ff);cursor:pointer;}
  .empty{text-align:center;color:var(--muted);padding:38px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;}
  .more{display:block;margin:6px auto 0;border:1.5px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 18px;font-family:var(--ff);font-weight:800;cursor:pointer;}
  .sec h3{font-size:15px;color:var(--navy);margin:16px 0 8px;}
  .cb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;font-size:13.5px;}
  .cb .ctx{color:var(--muted);font-size:12.5px;margin-top:4px;}
  .du{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;}
  .du .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .du .h a{font-weight:900;color:var(--navy);text-decoration:none;font-size:14px;}
  .du .c{margin-top:6px;font-size:14px;line-height:1.75;color:#26313f;white-space:pre-wrap;}
  .cat{font-size:11px;font-weight:900;border-radius:100px;padding:2px 9px;background:#EEF2FF;color:#3949AB;}
  .cat.broker{background:#FDECEC;color:#B42318;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .chips button{flex:none;border:1.5px solid var(--line-2);background:#fff;border-radius:100px;padding:6px 12px;font-family:var(--ff);font-weight:800;font-size:12.5px;cursor:pointer;color:var(--navy);}
  .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .ov{position:fixed;inset:0;background:rgba(11,29,54,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow:auto;}
  .ov.open{display:flex;} .ovc{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:18px;margin:auto;}
  .ovc h3{margin:0 0 12px;font-size:17px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;}
  .ovc h3 button{border:none;background:var(--cream);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex:1;} .fld label{font-size:12.5px;font-weight:800;color:#40506a;}
  .fld input,.fld select,.fld textarea{border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;font-family:var(--ff);font-size:14px;width:100%;box-sizing:border-box;background:#fff;}
  .row2{display:flex;gap:8px;} .msg{font-weight:800;font-size:13px;margin:6px 0;} .msg.err{color:#B42318;} .msg.ok{color:#137a3e;}
  .btnp{width:100%;border:none;border-radius:12px;padding:12px;background:var(--teal);color:#fff;font-family:var(--ff);font-weight:900;font-size:15px;cursor:pointer;}
  .notbroker{padding:60px 20px;text-align:center;}
  .hl{animation:hl 2.4s ease;} @keyframes hl{0%{box-shadow:0 0 0 3px #F0B429}100%{box-shadow:none}}
</style>
</head>
<body data-mode="broker">
<div id="hz-header"></div>
<div class="cm" id="app"><div style="padding:50px;text-align:center;color:var(--muted)">…</div></div>

<!-- new post -->
<div class="ov" id="ovPost" onclick="if(event.target===this)closeOv('ovPost')"><div class="ovc">
  <h3><span id="pTitle"></span><button onclick="closeOv('ovPost')">×</button></h3>
  <div id="pBody"></div>
</div></div>
<!-- collaboration request -->
<div class="ov" id="ovCollab" onclick="if(event.target===this)closeOv('ovCollab')"><div class="ovc">
  <h3><span>🤝 اعرض تعاون</span><button onclick="closeOv('ovCollab')">×</button></h3>
  <div id="cBody"></div>
</div></div>

<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=19"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=[['apartment','شقة'],['villa','فيلا'],['townhouse','تاون هاوس'],['twinhouse','توين هاوس'],['duplex','دوبلكس'],['penthouse','بنتهاوس'],
  ['studio','ستوديو'],['chalet','شاليه'],['office','مكتب'],['shop','محل'],['clinic','عيادة'],['land','أرض'],['other','أخرى']];
const TYPE_AR=Object.fromEntries(TYPES);
const GRP={cairo:'القاهرة',giza:'الجيزة',alex:'الإسكندرية',coast:'الساحل والمدن الساحلية'};
const CATS=[['','الكل'],['price','💰 أسعار'],['launch','🚀 إطلاقات'],['new_phase','🏗️ مراحل جديدة'],['offer','🎁 عروض'],['payment_plan','📅 أنظمة سداد'],
  ['delivery','🔑 تسليم'],['construction','👷 إنشاءات'],['inventory','📦 متاح'],['event','📣 أحداث'],['brochure','📄 بروشورات'],['other','أخرى']];
const CAT_AR=Object.fromEntries(CATS.filter(c=>c[0]));
const ERR={brokers_only:'الكميونتي للبروكرز بس.',too_many:'وصلت للحد اليومي (15 مشاركة). جرّب بكرة.',area_required:'اختار المنطقة.',
  body_required:'اكتب التفاصيل.',listing_not_yours:'الوحدة دي مش منشورة باسمك.',already:'إنت بعت طلب تعاون على ده قبل كده.',
  own_post:'ده بوستك.',not_open:'البوست ده اتقفل.',bad_status:'الحالة اتغيّرت — حدّث الصفحة.',forbidden:'مش مسموح.'};

let S=null, AREAS=[], AREA_LABEL={}, MY_AREAS=[], MY_LISTINGS=[], TAB='feed';
let F={kind:'',areas:'mine',q:'',mine:false,closed:false}, POSTS=[], BEFORE=null, DONE=false, FOCUS=null;
let DU={cat:'',q:''}, DUS=[], DU_BEFORE=null, DU_DONE=false, COLLABS=[];

const call=(fn,args)=>HZ.sbAuth('/rpc/'+fn,S.token,'POST',args||{});
const ago=t=>{ const s=(Date.now()-new Date(t))/1000; if(s<60) return 'دلوقتي'; if(s<3600) return 'من '+Math.floor(s/60)+' د';
  if(s<86400) return 'من '+Math.floor(s/3600)+' س'; if(s<86400*7) return 'من '+Math.floor(s/86400)+' يوم';
  return new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}); };
// 5 → 5 مليون, 750 → 750 ألف, "٥ مليون", "2.5m", "800k"
function parseMoney(v){
  let s=String(v||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'').toLowerCase(); if(!s) return null;
  const n=parseFloat(s.replace(/[^\d.]/g,'')); if(!isFinite(n)||n<=0) return null;
  if(/مليون|m/.test(s)) return Math.round(n*1e6); if(/ألف|الف|k/.test(s)) return Math.round(n*1e3);
  // bare numbers: 5 / 7.5 = millions, 750 = thousands, 15000 / 4200000 = as written
  return n<100?Math.round(n*1e6):(n<1000?Math.round(n*1e3):Math.round(n));
}
const money=n=>{ if(n==null) return ''; n=+n; if(n>=1e6) return (Math.round(n/1e5)/10).toLocaleString('en-US')+' مليون';
  if(n>=1e3) return Math.round(n/1e3).toLocaleString('en-US')+' ألف'; return n.toLocaleString('en-US'); };
const waNum=p=>{ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('0')) d='2'+d; else if(d.length===10&&d.startsWith('1')) d='20'+d; return d; };
const areaOptions=sel=>Object.keys(GRP).map(g=>`<optgroup label="${GRP[g]}">`+AREAS.filter(a=>a.grp===g).map(a=>`<option value="${a.slug}" ${a.slug===sel?'selected':''}>${esc(a.label_ar)}</option>`).join('')+'</optgroup>').join('');
window.closeOv=id=>$(id).classList.remove('open');

async function boot(){
  S=HZ.session(); if(!S){ location.href='/login?next='+encodeURIComponent(location.pathname+location.search); return; }
  let broker=false; try{ const p=(await HZ.sbAuth('/profiles?select=role&id=eq.'+S.uid,S.token))[0]; broker=p&&p.role==='broker'; }catch(e){}
  if(!broker){ $('app').innerHTML=`<div class="notbroker"><h2>مجتمع البروكرز</h2><p style="color:var(--muted);margin:12px 0 18px">الميزة دي للبروكرز بس. فعّل حساب بروكر عشان تعرض طلبات عملائك ووحداتك وتتعاون مع بروكرز تانيين.</p><a class="btn btn-navy" href="/account">ابقى بروكر</a></div>`; return; }
  try{ AREAS=await HZ.sbAuth('/community_areas?select=slug,label_ar,grp,cluster&order=label_ar',S.token)||[]; }catch(e){}
  AREAS.forEach(a=>AREA_LABEL[a.slug]=a.label_ar);
  try{ MY_AREAS=await call('community_my_areas')||[]; }catch(e){}
  try{ MY_LISTINGS=await HZ.sbAuth('/listings?select=id,title,price,area,type,purpose,bedrooms&owner_id=eq.'+S.uid+'&status=eq.active&order=created_at.desc',S.token)||[]; }catch(e){}
  // old /community/<area> links and ?post= / ?tab= deep links
  const qs=new URLSearchParams(location.search), seg=location.pathname.split('/').filter(Boolean)[1];
  if(seg&&AREA_LABEL[seg]) F.areas=seg; else if(!MY_AREAS.length) F.areas='';
  FOCUS=qs.get('post'); if(qs.get('tab')==='collabs') TAB='collabs'; else if(qs.get('tab')==='updates') TAB='updates';
  render(); live();
}

function render(){
  $('app').innerHTML=`<h1>💬 مجتمع البروكرز</h1>
    <div class="sub">اعرض طلب عميلك أو وحدة عندك — Homzy بيوصّلها تلقائي للبروكرز اللي عندهم المناسب.</div>
    <div class="tabs">
      <button class="${TAB==='feed'?'on':''}" onclick="setTab('feed')">📋 الطلبات والوحدات</button>
      <button class="${TAB==='collabs'?'on':''}" onclick="setTab('collabs')">🤝 تعاوناتي<span id="cbDot"></span></button>
      <button class="${TAB==='updates'?'on':''}" onclick="setTab('updates')">📢 تحديثات المطورين</button>
    </div><div id="pane"></div>`;
  if(TAB==='feed') renderFeedShell(); else if(TAB==='collabs') loadCollabs(); else renderUpdatesShell();
  refreshCollabDot();
}
window.setTab=t=>{ TAB=t; history.replaceState(null,'','/community'+(t==='feed'?'':'?tab='+t)); render(); };

/* ---------------- feed ---------------- */
function renderFeedShell(){
  const areaSel=`<select onchange="F.areas=this.value;loadFeed(true)">
      ${MY_AREAS.length?`<option value="mine" ${F.areas==='mine'?'selected':''}>📍 مناطق شغلي</option>`:''}
      <option value="" ${!F.areas?'selected':''}>🌍 كل المناطق</option>${areaOptions(F.areas==='mine'?'':F.areas)}</select>`;
  $('pane').innerHTML=`
    <div class="newrow"><button class="nr" onclick="openPost('request')">🔔 طلب عميل</button><button class="nu" onclick="openPost('unit')">🏠 وحدة متاحة</button></div>
    ${!MY_AREAS.length?`<div class="note">📍 اختار <a href="/broker-setup">مناطق شغلك</a> عشان توصلك الطلبات الجديدة فيها أول بأول.</div>`:''}
    <div class="bar"><div class="seg">${[['','الكل'],['request','طلبات'],['unit','وحدات'],['mine','مشاركاتي']].map(([k,t])=>
        `<button class="${(k==='mine'?F.mine:(!F.mine&&F.kind===k))?'on':''}" onclick="setKind('${k}')">${t}</button>`).join('')}</div>${areaSel}</div>
    <div class="bar"><input id="fq" placeholder="ابحث في الطلبات والوحدات…" value="${esc(F.q)}" onkeydown="if(event.key==='Enter'){F.q=this.value.trim();loadFeed(true)}">
      <label style="font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center"><input type="checkbox" ${F.closed?'checked':''} onchange="F.closed=this.checked;loadFeed(true)"> اللي اتقفلوا</label></div>
    <div id="focus"></div><div id="feed"><div class="empty">…</div></div>`;
  loadFeed(true);
}
window.setKind=k=>{ if(k==='mine'){ F.mine=true; F.kind=''; } else { F.mine=false; F.kind=k; } renderFeedShell(); };
const feedAreas=()=>F.areas==='mine'?MY_AREAS:(F.areas?[F.areas]:null);
async function loadFeed(reset){
  if(reset){ POSTS=[]; BEFORE=null; DONE=false; }
  let rows=[]; try{ rows=await call('community_feed',{p_kind:F.kind||null,p_areas:feedAreas(),p_q:F.q||null,p_mine:F.mine,p_closed:F.closed,p_before:BEFORE,p_limit:25})||[]; }catch(e){}
  POSTS=POSTS.concat(rows); DONE=rows.length<25; if(rows.length) BEFORE=rows[rows.length-1].created_at;
  $('feed').innerHTML=POSTS.length?POSTS.map(card).join('')+(DONE?'':`<button class="more" onclick="loadFeed(false)">عرض أكتر</button>`)
    :`<div class="empty"><div style="font-size:32px">📭</div><b>${F.mine?'لسه مانزّلتش حاجة':'مفيش حاجة هنا لسه'}</b><div style="font-size:13px;margin-top:4px">${F.areas?'جرّب «كل المناطق» أو ':''}كن أول واحد ينزّل طلب عميل أو وحدة.</div></div>`;
  if(FOCUS&&reset) showFocus();
}
async function showFocus(){
  let r=[]; try{ r=await call('community_feed',{p_post:FOCUS})||[]; }catch(e){}
  if(!r.length){ FOCUS=null; return; }
  $('focus').innerHTML=`<div style="font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px">من التنبيه:</div>`+card(r[0],true);
  const el=$('focus').firstElementChild.nextElementSibling; el.classList.add('hl'); el.scrollIntoView({behavior:'smooth',block:'center'});
  toggleComments(r[0].id,true);
}
function card(p,focus){
  const a=p.author||{}, name=a.company||a.name||'بروكر';
  const facts=[`📍 ${esc(p.area_label)}`, TYPE_AR[p.prop_type]?esc(TYPE_AR[p.prop_type]):'', p.purpose==='rent'?'إيجار':'بيع',

async function live(){
  try{ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.45.4');
    const sb=createClient(window.SB_URL,window.SB_KEY,{auth:{persistSession:false,autoRefreshToken:false},global:{headers:{Authorization:'Bearer '+S.token}}});
    sb.realtime.setAuth(S.token);
    sb.channel('community').on('postgres_changes',{event:'*',schema:'public',table:'community_posts'},bump)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'community_comments'},bump)
      .on('postgres_changes',{event:'*',schema:'public',table:'community_collabs'},bump).subscribe();
  }catch(e){}
  setInterval(()=>{ if(!document.hidden) refreshCollabDot(); },60000);
}
boot();
</script>
