<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<script>/* auth gate */
(function(){try{var k=Object.keys(localStorage).find(function(x){return /sb-.*-auth-token/.test(x)});var t=k?JSON.parse(localStorage.getItem(k)):null;var ok=t&&t.access_token&&(!t.expires_at||t.expires_at*1000>Date.now());if(!ok){location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));}}catch(e){location.replace('/login');}})();</script>
<title>Homzy — مجتمع البروكرز</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=7">
<style>
  .cm{max-width:860px;margin:0 auto;padding:14px 12px 24px;}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--cream);border-radius:13px;padding:4px;margin-bottom:10px;}
  .tabs button{border:none;background:none;font-family:var(--ff);font-weight:800;font-size:13.5px;line-height:1.35;padding:8px 6px;border-radius:10px;cursor:pointer;color:var(--navy);position:relative;}
  .tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:100px;background:#E5484D;color:#fff;font-size:11px;padding:0 5px;margin-inline-start:4px;}
  @media(max-width:520px){ .tabs button{font-size:12.5px;} }
  /* ---- chat (WhatsApp-style group) ---- */
  .chat{display:flex;flex-direction:column;height:calc(100dvh - 170px);min-height:440px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#EFE7DD;}
  .chead{display:flex;gap:10px;align-items:center;background:#0B5563;color:#fff;padding:9px 12px;}
  .gav{width:38px;height:38px;border-radius:50%;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
  .chead b{display:block;font-size:15px;} .chead small{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chead .t{flex:1;min-width:0;}
  .cfil{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:#F7F3EE;border-bottom:1px solid #E4DCD2;}
  .cfil button{flex:none;border:1px solid #DDD3C7;background:#fff;border-radius:100px;padding:4px 11px;font-family:var(--ff);font-weight:800;font-size:12px;cursor:pointer;color:var(--navy);}
  .cfil button.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .cbody{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px;position:relative;
    background-image:radial-gradient(#e2d8cb 1px,transparent 1px);background-size:18px 18px;}
  .day{align-self:center;background:#E1F2F6;color:#3d5560;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 10px;margin:8px 0 4px;box-shadow:0 1px 1px #0001;}
  .older{align-self:center;border:none;background:#fff;border-radius:100px;padding:5px 14px;font-family:var(--ff);font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 1px 2px #0002;margin-bottom:4px;}
  .b{position:relative;max-width:82%;background:#fff;border-radius:10px;padding:6px 9px 4px;box-shadow:0 1px 1px #0000001f;font-size:14.5px;line-height:1.6;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere;}
  .b.me{align-self:flex-end;background:#D9FDD3;}
  .b.first{margin-top:6px;} .b.first:not(.me){border-top-right-radius:2px;} .b.first.me{border-top-left-radius:2px;}
  .b.card{max-width:92%;width:340px;}
  .b .nm{font-size:12.5px;font-weight:900;margin-bottom:1px;display:flex;gap:5px;align-items:center;}
  .b .nm a{color:inherit;text-decoration:none;} .b .nm small{color:var(--muted);font-weight:700;font-size:11px;}
  .b .tx{white-space:pre-wrap;color:#111b21;}
  .b .tm{float:left;margin:6px 8px 0 0;font-size:10.5px;color:#667781;direction:ltr;}
  .b .more{position:absolute;top:2px;inset-inline-end:2px;border:none;background:transparent;color:#8696a0;font-size:15px;cursor:pointer;width:24px;height:22px;border-radius:6px;opacity:.75;}
  .b .more:hover{background:#0000000d;opacity:1;}
  .b.del .tx{color:#8696a0;font-style:italic;}
  .q{display:block;border-inline-start:4px solid #06A77D;background:#0000000a;border-radius:6px;padding:4px 8px;margin:2px 0 4px;font-size:12.5px;cursor:pointer;color:#3b4a54;}
  .q b{display:block;color:#06A77D;font-size:12px;}
  .b.hl{animation:hl 2.4s ease;} @keyframes hl{0%{box-shadow:0 0 0 3px #F0B429}100%{box-shadow:0 1px 1px #0000001f}}
  .kb{display:inline-block;font-size:11.5px;font-weight:900;border-radius:7px;padding:2px 8px;margin:2px 0 4px;}
  .kb.request{background:#FFF1C9;color:#7A4E00;} .kb.unit{background:#D7F0EC;color:#0B5563;}
  .facts{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 4px;}
  .facts span{background:#F0F2F5;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;color:#3b4a54;}
  .b.me .facts span{background:#ffffff99;} .facts .money{background:#E6F6EC !important;color:#137a3e;}
  .lst{display:flex;gap:8px;margin:4px 0;border-radius:9px;overflow:hidden;text-decoration:none;color:inherit;background:#F0F2F5;}
  .b.me .lst{background:#ffffff99;}
  .lst .im{width:76px;min-height:60px;background:#d9d2c9 center/cover no-repeat;flex:none;}
  .lst div{padding:5px 2px;font-size:12.5px;} .lst b{display:block;color:var(--navy);}
  .pill{display:block;width:100%;text-align:start;margin:5px 0 2px;border:1.5px dashed #6CC3B5;background:#F2FBF9;color:#0B5563;font-family:var(--ff);font-weight:800;font-size:12.5px;border-radius:9px;padding:6px 9px;cursor:pointer;}
  .mlist{margin-top:5px;display:flex;flex-direction:column;gap:5px;}
  .mrow{display:flex;gap:7px;align-items:center;background:#F7F8FA;border-radius:9px;padding:5px 7px;font-size:12.5px;}
  .mrow .im{width:40px;height:34px;border-radius:6px;background:#d9d2c9 center/cover no-repeat;flex:none;}
  .mrow .t{flex:1;min-width:0;} .mrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mrow button{border:none;background:var(--teal);color:#fff;border-radius:7px;padding:4px 8px;font-family:var(--ff);font-weight:800;font-size:11.5px;cursor:pointer;}
  .st{display:inline-block;font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 8px;background:#F1F1F1;color:#6b7280;margin:3px 0;}
  .bacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid #0000000f;}
  .bacts button{flex:1;min-width:max-content;font-family:var(--ff);font-size:12px;font-weight:800;border-radius:8px;padding:6px 9px;border:none;background:#F0F2F5;cursor:pointer;color:#0B5563;}
  .bacts .go{background:#0B5563;color:#fff;} .bacts .wait{background:#FFF4E5;color:#9A5B00;} .bacts .ok{background:#E6F6EC;color:#137a3e;}
  .newbtn{position:sticky;bottom:6px;align-self:center;border:none;background:#0B5563;color:#fff;border-radius:100px;padding:6px 14px;font-family:var(--ff);font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 2px 6px #0003;}
  .cempty{margin:auto;text-align:center;background:#fffd;border-radius:12px;padding:16px 18px;font-size:13.5px;color:#3b4a54;max-width:300px;}
  .cbar{background:#F0F2F5;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #E4DCD2;}
  .rprev{display:flex;gap:8px;align-items:center;background:#fff;border-radius:9px;padding:5px 8px;margin-bottom:6px;font-size:12.5px;border-inline-start:4px solid #06A77D;}
  .rprev div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .rprev b{color:#06A77D;}
  .rprev button{border:none;background:none;font-size:17px;cursor:pointer;color:#667781;}
  .crow{display:flex;gap:6px;align-items:flex-end;}
  .crow textarea{flex:1;resize:none;border:none;border-radius:20px;padding:9px 14px;font-family:var(--ff);font-size:14.5px;line-height:1.45;max-height:120px;outline:none;background:#fff;}
  .crow .plus,.crow .send{flex:none;width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;}
  .crow .plus{background:#fff;color:#0B5563;font-size:24px;font-weight:700;} .crow .send{background:#0B5563;color:#fff;}
  .pmenu{position:absolute;bottom:58px;inset-inline-start:8px;background:#fff;border-radius:12px;box-shadow:0 6px 20px #0003;padding:6px;display:none;z-index:5;min-width:190px;}
  .pmenu.open{display:block;}
  .pmenu button{display:block;width:100%;text-align:start;border:none;background:none;font-family:var(--ff);font-weight:800;font-size:14px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--navy);}
  .pmenu button:hover{background:var(--cream);}
  .amenu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 6px 20px #0003;padding:5px;z-index:120;min-width:150px;display:none;}
  .amenu.open{display:block;}
  .amenu button{display:block;width:100%;text-align:start;border:none;background:none;font-family:var(--ff);font-weight:700;font-size:13.5px;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--navy);}
  .amenu button:hover{background:var(--cream);} .amenu .red{color:#B42318;}
  .cbwrap{position:relative;}
  .note{background:#FFF8E1;color:#7A4E00;font-size:12px;font-weight:700;padding:6px 10px;text-align:center;}
  .note a{color:inherit;}
  /* ---- collaborations / developer updates ---- */
  .empty{text-align:center;color:var(--muted);padding:38px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;}
  .more2{display:block;margin:6px auto 0;border:1.5px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 18px;font-family:var(--ff);font-weight:800;cursor:pointer;}
  .sec h3{font-size:15px;color:var(--navy);margin:16px 0 8px;}
  .cb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;font-size:13.5px;}
  .cb .ctx{color:var(--muted);font-size:12.5px;margin-top:4px;} .cb .body{margin-top:6px;white-space:pre-wrap;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .acts button,.acts a{font-family:var(--ff);font-size:12.5px;font-weight:800;border-radius:9px;padding:7px 11px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;color:var(--navy);text-decoration:none;}
  .acts .go{background:var(--teal);border-color:var(--teal);color:#fff;} .acts .ok{background:#E6F6EC;border-color:#BDE5CB;color:#137a3e;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .bar input{flex:1;min-width:140px;border:1.5px solid var(--line-2);border-radius:11px;padding:8px 11px;font-family:var(--ff);font-size:13px;background:#fff;}
  .du{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;}
  .du .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .du .h a{font-weight:900;color:var(--navy);text-decoration:none;font-size:14px;}
  .du .c{margin-top:6px;font-size:14px;line-height:1.75;color:#26313f;white-space:pre-wrap;}
  .cat{font-size:11px;font-weight:900;border-radius:100px;padding:2px 9px;background:#EEF2FF;color:#3949AB;}
  .cat.broker{background:#FDECEC;color:#B42318;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .chips button{flex:none;border:1.5px solid var(--line-2);background:#fff;border-radius:100px;padding:6px 12px;font-family:var(--ff);font-weight:800;font-size:12.5px;cursor:pointer;color:var(--navy);}
  .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .unote{background:#EEF2FF;color:#3949AB;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;margin-bottom:12px;}
  /* ---- dialogs ---- */
  .ov{position:fixed;inset:0;background:rgba(11,29,54,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow:auto;}
  .ov.open{display:flex;} .ovc{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:18px;margin:auto;}
  .ovc h3{margin:0 0 12px;font-size:17px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;}
  .ovc h3 button{border:none;background:var(--cream);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex:1;} .fld label{font-size:12.5px;font-weight:800;color:#40506a;}
  .fld input,.fld select,.fld textarea{border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;font-family:var(--ff);font-size:14px;width:100%;box-sizing:border-box;background:#fff;}
  .row2{display:flex;gap:8px;} .msg{font-weight:800;font-size:13px;margin:6px 0;} .msg.err{color:#B42318;} .msg.ok{color:#137a3e;}
  .btnp{width:100%;border:none;border-radius:12px;padding:12px;background:var(--teal);color:#fff;font-family:var(--ff);font-weight:900;font-size:15px;cursor:pointer;}
  .notbroker{padding:60px 20px;text-align:center;}
  body.chatmode #hz-footer{display:none;}
  /* the site-wide assistant buttons would sit on top of the send button */
  body.chatmode #hzChatFab, body.chatmode .chat-fab, body.chatmode .hz-asst-fab{display:none !important;}
  .cfil{scrollbar-width:none;} .cfil::-webkit-scrollbar{display:none;}
</style>
</head>
<body data-mode="broker">
<div id="hz-header"></div>
<div class="cm" id="app"><div style="padding:50px;text-align:center;color:var(--muted)">…</div></div>

<!-- new request / unit -->
<div class="ov" id="ovPost" onclick="if(event.target===this)closeOv('ovPost')"><div class="ovc">
  <h3><span id="pTitle"></span><button onclick="closeOv('ovPost')">×</button></h3>
  <div id="pBody"></div>
</div></div>
<!-- collaboration request -->
<div class="ov" id="ovCollab" onclick="if(event.target===this)closeOv('ovCollab')"><div class="ovc">
  <h3><span>🤝 اعرض تعاون</span><button onclick="closeOv('ovCollab')">×</button></h3>
  <div id="cBody"></div>
</div></div>
<div class="amenu" id="amenu"></div>

<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=19"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=[['apartment','شقة'],['villa','فيلا'],['townhouse','تاون هاوس'],['twinhouse','توين هاوس'],['duplex','دوبلكس'],['penthouse','بنتهاوس'],
  ['studio','ستوديو'],['chalet','شاليه'],['office','مكتب'],['shop','محل'],['clinic','عيادة'],['land','أرض'],['other','أخرى']];
const TYPE_AR=Object.fromEntries(TYPES);
const GRP={cairo:'القاهرة',giza:'الجيزة',alex:'الإسكندرية',coast:'الساحل والمدن الساحلية'};
const CATS=[['','الكل'],['price','💰 أسعار'],['launch','🚀 إطلاقات'],['new_phase','🏗️ مراحل جديدة'],['offer','🎁 عروض'],['payment_plan','📅 أنظمة سداد'],
  ['delivery','🔑 تسليم'],['construction','👷 إنشاءات'],['inventory','📦 متاح'],['event','📣 أحداث'],['brochure','📄 بروشورات'],['other','أخرى']];
const CAT_AR=Object.fromEntries(CATS.filter(c=>c[0]));
const ERR={brokers_only:'الكميونتي للبروكرز بس.',too_many:'وصلت للحد اليومي. جرّب بكرة.',area_required:'اختار المنطقة.',
  body_required:'اكتب التفاصيل.',listing_not_yours:'الوحدة دي مش منشورة باسمك.',already:'إنت بعت طلب تعاون على ده قبل كده.',
  own_post:'ده بوستك.',not_open:'البوست ده اتقفل.',bad_status:'الحالة اتغيّرت — حدّث الصفحة.',forbidden:'مش مسموح.'};
const NAME_COLORS=['#06A77D','#E5484D','#3949AB','#C2410C','#7C3AED','#0E7490','#B45309','#BE185D'];

let S=null, AREAS=[], AREA_LABEL={}, MY_AREAS=[], MY_LISTINGS=[], TAB='chat', FOCUS=null;
let CF='all', MSGS=[], OLDEST=null, NO_MORE=false, LAST=null, REPLY=null;
let DU={cat:'',q:''}, DUS=[], DU_BEFORE=null, DU_DONE=false, COLLABS=[];

const call=(fn,args)=>HZ.sbAuth('/rpc/'+fn,S.token,'POST',args||{});
const ago=t=>{ const s=(Date.now()-new Date(t))/1000; if(s<60) return 'دلوقتي'; if(s<3600) return 'من '+Math.floor(s/60)+' د';
  if(s<86400) return 'من '+Math.floor(s/3600)+' س'; if(s<86400*7) return 'من '+Math.floor(s/86400)+' يوم';
  return new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}); };
const hm=t=>new Date(t).toLocaleTimeString('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const dayKey=t=>new Date(t).toLocaleDateString('en-CA');
const dayLabel=t=>{ const k=dayKey(t), today=dayKey(Date.now()), y=dayKey(Date.now()-864e5);
  return k===today?'النهارده':(k===y?'امبارح':new Date(t).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})); };
// 5 → 5 مليون, 750 → 750 ألف, "٥ مليون", "2.5m", "800k"
function parseMoney(v){
  let s=String(v||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'').toLowerCase(); if(!s) return null;
  const n=parseFloat(s.replace(/[^\d.]/g,'')); if(!isFinite(n)||n<=0) return null;
  if(/مليون|m/.test(s)) return Math.round(n*1e6); if(/ألف|الف|k/.test(s)) return Math.round(n*1e3);
  // bare numbers: 5 / 7.5 = millions, 750 = thousands, 15000 / 4200000 = as written
  return n<100?Math.round(n*1e6):(n<1000?Math.round(n*1e3):Math.round(n));
}
const money=n=>{ if(n==null) return ''; n=+n; if(n>=1e6) return (Math.round(n/1e5)/10).toLocaleString('en-US')+' مليون';
  if(n>=1e3) return Math.round(n/1e3).toLocaleString('en-US')+' ألف'; return n.toLocaleString('en-US'); };
const waNum=p=>{ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('0')) d='2'+d; else if(d.length===10&&d.startsWith('1')) d='20'+d; return d; };
const areaOptions=sel=>Object.keys(GRP).map(g=>`<optgroup label="${GRP[g]}">`+AREAS.filter(a=>a.grp===g).map(a=>`<option value="${a.slug}" ${a.slug===sel?'selected':''}>${esc(a.label_ar)}</option>`).join('')+'</optgroup>').join('');
const nameColor=id=>NAME_COLORS[[...String(id)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%NAME_COLORS.length];
window.closeOv=id=>$(id).classList.remove('open');

async function boot(){
  S=HZ.session(); if(!S){ location.href='/login?next='+encodeURIComponent(location.pathname+location.search); return; }
  let broker=false; try{ const p=(await HZ.sbAuth('/profiles?select=role&id=eq.'+S.uid,S.token))[0]; broker=p&&p.role==='broker'; }catch(e){}
  if(!broker){ $('app').innerHTML=`<div class="notbroker"><h2>مجتمع البروكرز</h2><p style="color:var(--muted);margin:12px 0 18px">الميزة دي للبروكرز بس. فعّل حساب بروكر عشان تعرض طلبات عملائك ووحداتك وتتعاون مع بروكرز تانيين.</p><a class="btn btn-navy" href="/account">ابقى بروكر</a></div>`; return; }
  try{ AREAS=await HZ.sbAuth('/community_areas?select=slug,label_ar,grp,cluster&order=label_ar',S.token)||[]; }catch(e){}
  AREAS.forEach(a=>AREA_LABEL[a.slug]=a.label_ar);
  try{ MY_AREAS=await call('community_my_areas')||[]; }catch(e){}
  try{ MY_LISTINGS=await HZ.sbAuth('/listings?select=id,title,price,area,type,purpose,bedrooms&owner_id=eq.'+S.uid+'&status=eq.active&order=created_at.desc',S.token)||[]; }catch(e){}
  const qs=new URLSearchParams(location.search);
  FOCUS=qs.get('post'); if(qs.get('tab')==='collabs') TAB='collabs'; else if(qs.get('tab')==='updates') TAB='updates';
  render(); live();

window.grow=t=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; };
window.setFilter=k=>{ CF=k; renderChat(); };
const chatArgs=()=>({p_kinds:CF==='request'||CF==='unit'?[CF]:(CF==='areas'?['request','unit']:null),p_areas:CF==='areas'?MY_AREAS:null});
const nearBottom=()=>{ const b=$('cbody'); return !b||b.scrollHeight-b.scrollTop-b.clientHeight<140; };
const toBottom=()=>{ const b=$('cbody'); if(b) b.scrollTop=b.scrollHeight; };
function track(rows){ rows.forEach(r=>{ const t=r.updated_at>r.created_at?r.updated_at:r.created_at; if(!LAST||t>LAST) LAST=t; }); }
async function loadChat(){
  MSGS=[]; OLDEST=null; NO_MORE=false; LAST=null;
  let rows=[]; try{ rows=await call('community_chat',{...chatArgs(),p_limit:50})||[]; }catch(e){}
  MSGS=rows.reverse(); NO_MORE=rows.length<50; if(MSGS.length) OLDEST=MSGS[0].created_at; track(MSGS);
  if(FOCUS){ for(let i=0;i<6&&!MSGS.some(m=>m.id===FOCUS)&&!NO_MORE;i++) await older(true); }
  drawChat(); if(FOCUS) jump(FOCUS); else toBottom(); FOCUS=null;
}
window.older=async(silent)=>{ const b=$('cbody'), h=b?b.scrollHeight:0;
  let rows=[]; try{ rows=await call('community_chat',{...chatArgs(),p_before:OLDEST,p_limit:50})||[]; }catch(e){}
  NO_MORE=rows.length<50; if(rows.length){ MSGS=rows.reverse().concat(MSGS); OLDEST=MSGS[0].created_at; }
  if(silent!==true){ drawChat(); if(b) b.scrollTop=b.scrollHeight-h; } };
async function pullNew(scroll){
  if(TAB!=='chat'||!$('cbody')) return; const stick=scroll||nearBottom();
  let rows=[]; try{ rows=await call('community_chat',{...chatArgs(),p_after:LAST,p_limit:100})||[]; }catch(e){ return; }
  if(!rows.length) return; track(rows); let added=0;
  rows.reverse().forEach(r=>{ const i=MSGS.findIndex(m=>m.id===r.id); if(i>=0) MSGS[i]=r; else { MSGS.push(r); added++; } });
  MSGS.sort((a,b)=>a.created_at<b.created_at?-1:1);
  const top=$('cbody').scrollTop; drawChat();
  if(stick) toBottom(); else { $('cbody').scrollTop=top; if(added&&!$('newbtn')) $('cbody').insertAdjacentHTML('beforeend',`<button class="newbtn" id="newbtn" onclick="this.remove();toBottom()">⬇ رسايل جديدة</button>`); }
}
function drawChat(){
  const b=$('cbody'); if(!b) return;
  if(!MSGS.length){ b.innerHTML=`<div class="cempty"><div style="font-size:30px">👋</div><b>${CF==='all'?'لسه محدش كتب في الجروب':'مفيش حاجة بالفلتر ده'}</b><div style="margin-top:4px">${CF==='all'?'ابدأ إنت: اكتب رسالة، أو دوس ＋ واعرض طلب عميل أو وحدة.':'جرّب «الكل».'}</div></div>`; return; }
  let html=NO_MORE?'':`<button class="older" onclick="older()">⬆ رسايل أقدم</button>`, prev=null;
  MSGS.forEach(m=>{
    if(!prev||dayKey(prev.created_at)!==dayKey(m.created_at)) html+=`<div class="day">${dayLabel(m.created_at)}</div>`;
    const first=!prev||prev.author.id!==m.author.id||dayKey(prev.created_at)!==dayKey(m.created_at)||(new Date(m.created_at)-new Date(prev.created_at))>5*60e3||m.kind!=='message'||prev.kind!=='message';
    html+=bubble(m,first); prev=m;
  });
  b.innerHTML=html;
}
function bubble(m,first){
  const a=m.author||{}, name=a.company||a.name||'بروكر', card=m.kind!=='message';
  const head=(!m.mine&&(first||card))?`<div class="nm" style="color:${nameColor(a.id)}"><a href="/broker/${a.id}" target="_blank">${esc(name)}</a>${a.verified?'<span title="رقم متأكد منه" style="color:#1E8E5A">✔︎</span>':''}${a.collabs_won>0?`<small>🤝 ${a.collabs_won}</small>`:''}</div>`:'';
  const quote=m.reply?`<span class="q" onclick="jump('${m.reply.id}')"><b>${m.reply.mine?'إنت':esc(m.reply.name||'بروكر')}</b>${m.reply.body==null?'🚫 رسالة اتمسحت':(m.reply.kind==='request'?'🔔 ':m.reply.kind==='unit'?'🏠 ':'')+esc(m.reply.body)}</span>`:'';
  const tm=`<span class="tm">${hm(m.created_at)}</span>`;
  const more=m.status==='deleted'?'':`<button class="more" onclick="menu(event,'${m.id}')">⌄</button>`;
  const cls=`b ${m.mine?'me':''} ${first?'first':''} ${card?'card':''} ${m.status==='deleted'?'del':''}`;
  if(m.status==='deleted') return `<div class="${cls}" id="m-${m.id}">${head}<div class="tx">🚫 ${m.mine?'إنت مسحت الرسالة دي':'الرسالة دي اتمسحت'}</div>${tm}<div style="clear:both"></div></div>`;
  if(m.status==='hidden') return `<div class="${cls}" id="m-${m.id}">${head}<div class="tx" style="color:#B42318">⚑ اتخفت بعد بلاغات — مستنية مراجعة</div>${tm}<div style="clear:both"></div></div>`;
  if(!card) return `<div class="${cls}" id="m-${m.id}">${more}${head}${quote}<div class="tx">${esc(m.body)}</div>${tm}<div style="clear:both"></div></div>`;
  // request / unit card inside the chat
  const facts=[m.area_label?`📍 ${esc(m.area_label)}`:'', TYPE_AR[m.prop_type]?esc(TYPE_AR[m.prop_type]):'', m.purpose==='rent'?'إيجار':'بيع',
    m.bedrooms!=null?`${m.bedrooms} غرف`:'', m.delivery==='ready'?'🔑 فوري':(m.delivery==='under_construction'?'🏗️ تحت الإنشاء':'')].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
  const budget=m.kind==='request'?((m.budget_min||m.budget_max)?`<span class="money">💰 ${m.budget_min?'من '+money(m.budget_min)+' ':''}${m.budget_max?'لحد '+money(m.budget_max):''}</span>`:'')
    :(m.price?`<span class="money">💰 ${money(m.price)}</span>`:'');
  const l=m.listing;
  const lst=l?`<a class="lst" href="/listing/${m.listing_id}" target="_blank"><span class="im" style="${l.cover?`background-image:url('${esc(l.cover)}')`:''}"></span><div><b>${esc(l.title||'')}</b>${l.price?money(l.price)+' ج':''}${l.size?' · '+esc(l.size)+' م²':''}<br><span style="color:#0B5563;font-weight:800">الصور والتفاصيل ←</span></div></a>`:'';
  const open=m.status==='open'&&!m.expired;
  const st=m.status==='closed'?`<span class="st">✔︎ اتقفل${m.closed_reason?' — '+esc(m.closed_reason):''}</span>`:(m.expired?`<span class="st">انتهت مدته</span>`:'');
  let pill='';
  if(m.kind==='request'&&m.my_matches>0) pill=`<button class="pill" onclick="toggleMatches('${m.id}')">🎯 عندك ${m.my_matches} ${m.my_matches==1?'وحدة تناسب':'وحدات تناسب'} الطلب ده</button>`;
  else if(m.mine&&m.kind==='request'&&m.total_matches>0) pill=`<button class="pill" onclick="toggleMatches('${m.id}')">🎯 Homzy لقى ${m.total_matches} ${m.total_matches==1?'وحدة مناسبة':'وحدات مناسبة'} وبلّغ أصحابها</button>`;
  let acts=`<button onclick="replyTo('${m.id}')">↩️ رد</button>`;
  if(m.mine){
    if(m.collab_pending>0) acts+=`<button class="wait" onclick="setTab('collabs')">🤝 ${m.collab_pending} طلب تعاون</button>`;
    acts+=open?`<button onclick="postAct('${m.id}','close')">✔︎ اتقفل</button>`:`<button onclick="postAct('${m.id}','renew')">🔄 ${m.status==='closed'?'افتحه تاني':'جدّده'}</button>`;
  } else if(open){
    acts+=m.my_collab==='pending'?`<button class="wait" onclick="setTab('collabs')">⏳ مستني موافقته</button>`
      :(m.my_collab==='accepted'||m.my_collab==='won')?`<button class="ok" onclick="setTab('collabs')">✅ اتفقتوا</button>`
      :`<button class="go" onclick="openCollab('${m.id}')">🤝 اعرض تعاون</button>`;
  }
  return `<div class="${cls}" id="m-${m.id}">${more}${head}${quote}<span class="kb ${m.kind}">${m.kind==='request'?'🔔 طلب عميل':'🏠 وحدة متاحة'}</span>
    <div class="facts">${facts}${budget}</div>${lst}${m.body&&(!l||m.body!==l.title)?`<div class="tx">${esc(m.body)}</div>`:''}
    ${st}${pill}<div class="mlist" id="ml-${m.id}" hidden></div><div class="bacts">${acts}</div>${tm}<div style="clear:both"></div></div>`;
}
window.jump=id=>{ const el=$('m-'+id); if(!el) return; el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl'); };

window.sendCollab=async id=>{ const m=$('cmsg'); $('csend').disabled=true;
  try{ const r=await call('community_collab_request',{p_post:id,p_msg:$('cm').value.trim()||null,p_listing:($('cl')&&$('cl').value)||null});
    if(!r||!r.ok){ m.className='msg err'; m.textContent=ERR[r&&r.error]||'تعذّر الإرسال.'; $('csend').disabled=false; return; }
    m.className='msg ok'; m.textContent='اتبعت ✓ — هنبلّغك أول ما يرد.'; setTimeout(()=>{ closeOv('ovCollab'); pullNew(false); },1300);
  }catch(e){ m.className='msg err'; m.textContent='تعذّر الإرسال.'; $('csend').disabled=false; } };
async function refreshCollabDot(){ try{ COLLABS=await call('community_collabs_mine')||[]; }catch(e){ COLLABS=[]; }
  const n=COLLABS.filter(c=>c.role==='owner'&&c.status==='pending').length; const d=$('cbDot'); if(d) d.innerHTML=n?`<span class="dot">${n}</span>`:''; }
async function loadCollabs(){
  $('pane').innerHTML='<div class="empty">…</div>'; await refreshCollabDot();
  const ctx=c=>{ const p=c.post; return `${p.kind==='request'?'🔔 طلب':'🏠 وحدة'}: ${esc(TYPE_AR[p.prop_type]||'')} في ${esc(p.area)}${p.budget_max?' — لحد '+money(p.budget_max):''}${p.price?' — '+money(p.price):''}`+(c.listing?`<br>🏠 <a href="/listing/${c.listing.id}" target="_blank">${esc(c.listing.title||'وحدة')}</a>`:''); };
  const who=c=>`<b>${esc(c.other.company||c.other.name||'بروكر')}</b>${c.other.verified?' <span style="color:#1E8E5A">✔︎</span>':''} · <a href="/broker/${c.other.id}" target="_blank" style="font-size:12px">صفحته</a>`;
  const phone=c=>{ const w=waNum(c.other.phone); return w?`<div class="acts" style="border:none;padding-top:6px"><a class="go" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent('أهلاً، بخصوص التعاون على Homzy')}">💬 واتساب</a><a href="tel:+${w}">📞 ${esc(c.other.phone)}</a></div>`:''; };
  const sec=(t,list,f)=>list.length?`<div class="sec"><h3>${t} (${list.length})</h3>${list.map(f).join('')}</div>`:'';
  const inc=COLLABS.filter(c=>c.role==='owner'&&c.status==='pending'), act=COLLABS.filter(c=>c.status==='accepted'),
        out=COLLABS.filter(c=>c.role==='requester'&&c.status==='pending'), old=COLLABS.filter(c=>['won','lost','declined','cancelled'].includes(c.status));
  const ST={won:'🎉 اتقفل بصفقة',lost:'اتقفل من غير صفقة',declined:'اتعتذر',cancelled:'اتلغى'};
  $('pane').innerHTML=(sec('📥 طلبات مستنية موافقتك',inc,c=>`<div class="cb">${who(c)} عايز يتعاون معاك<div class="ctx">${ctx(c)}</div>${c.message?`<div class="body" style="font-size:13.5px">«${esc(c.message)}»</div>`:''}
        <div class="acts"><button class="go" onclick="collabSet('${c.id}','accepted')">✅ موافق — اظهر رقمي له</button><button onclick="collabSet('${c.id}','declined')">اعتذر</button></div></div>`)
    +sec('🤝 شغالين مع بعض',act,c=>`<div class="cb">${who(c)}<div class="ctx">${ctx(c)}</div>${phone(c)}
        <div class="acts"><button class="ok" onclick="collabSet('${c.id}','won')">🎉 اتقفلت بصفقة</button><button onclick="collabSet('${c.id}','lost')">ماتمّتش</button></div></div>`)
    +sec('📤 طلباتك المبعوتة',out,c=>`<div class="cb">مستني رد ${who(c)}<div class="ctx">${ctx(c)}</div><div class="acts"><button onclick="collabSet('${c.id}','cancelled')">إلغاء الطلب</button></div></div>`)
    +sec('🗂️ اللي خلص',old,c=>`<div class="cb">${who(c)} — <b>${ST[c.status]}</b><div class="ctx">${ctx(c)}</div>${c.status==='won'||c.status==='lost'?phone(c):''}</div>`))
    ||`<div class="empty"><div style="font-size:32px">🤝</div><b>مفيش تعاونات لسه</b><div style="font-size:13px;margin-top:4px">اعرض تعاون على أي طلب أو وحدة في الفيد — الرقم بيظهر بس لما الطرفين يوافقوا.</div></div>`;
}
window.collabSet=async(id,st)=>{ if((st==='declined'||st==='cancelled')&&!confirm('متأكد؟')) return;
  try{ const r=await call('community_collab_set',{p_id:id,p_status:st}); if(!r||!r.ok) alert(ERR[r&&r.error]||'تعذّر التنفيذ.'); }catch(e){ alert('تعذّر التنفيذ.'); }
  loadCollabs(); };

/* ---------------- developer updates (own tab, never mixed into the feed) ---------------- */
function renderUpdatesShell(){
  $('pane').innerHTML=`<div class="unote">تحديثات المطورين من جروبات الواتساب — أسعار، إطلاقات، مراحل، عروض. اللي عليها «للبروكرز» ماتبعتهاش للعملاء.</div>
    <div class="chips">${CATS.map(([k,t])=>`<button class="${DU.cat===k?'on':''}" onclick="DU.cat='${k}';renderUpdatesShell()">${t}</button>`).join('')}</div>
    <div class="bar"><input placeholder="ابحث بالمشروع أو المطور…" value="${esc(DU.q)}" onkeydown="if(event.key==='Enter'){DU.q=this.value.trim();loadUpdates(true)}"></div>
    <div id="dus"><div class="empty">…</div></div>`;
  loadUpdates(true);
}
async function loadUpdates(reset){
  if(reset){ DUS=[]; DU_BEFORE=null; DU_DONE=false; }
  let rows=[]; try{ rows=await call('community_dev_updates',{p_category:DU.cat||null,p_q:DU.q||null,p_before:DU_BEFORE,p_limit:30})||[]; }catch(e){}
  DUS=DUS.concat(rows); DU_DONE=rows.length<30; if(rows.length) DU_BEFORE=rows[rows.length-1].observed_at;
  $('dus').innerHTML=DUS.length?DUS.map(u=>`<div class="du"><div class="h">${u.project_id?`<a href="/project/${u.project_id}" target="_blank">${esc(u.project||'')}</a>`:`<b style="color:var(--navy)">${esc(u.project||u.developer||'')}</b>`}
      ${u.developer&&u.project?`<span>${esc(u.developer)}</span>`:''}${u.project_area?`<span>· ${esc(u.project_area)}</span>`:''}
      <span class="cat">${esc(CAT_AR[u.category]||u.category)}</span>${u.tier==='broker'?'<span class="cat broker">للبروكرز</span>':''}
      <span style="margin-inline-start:auto">${ago(u.observed_at)}</span></div><div class="c">${esc(u.content_ar)}</div></div>`).join('')
      +(DU_DONE?'':`<button class="more2" onclick="loadUpdates(false)">عرض أكتر</button>`)
    :'<div class="empty">مفيش تحديثات بالفلتر ده.</div>';
}

/* ---------------- live updates (Supabase realtime; a slow poll as backup) ---------------- */
let LIVE_T=null;
function bump(){ clearTimeout(LIVE_T); LIVE_T=setTimeout(()=>{ if(document.hidden) return;
  if(TAB==='chat') pullNew(false); else if(TAB==='collabs') loadCollabs(); refreshCollabDot(); },500); }
async function live(){
  try{ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.45.4');
    const sb=createClient(window.SB_URL,window.SB_KEY,{auth:{persistSession:false,autoRefreshToken:false},global:{headers:{Authorization:'Bearer '+S.token}}});
    sb.realtime.setAuth(S.token);
    sb.channel('community').on('postgres_changes',{event:'*',schema:'public',table:'community_posts'},bump)
      .on('postgres_changes',{event:'*',schema:'public',table:'community_collabs'},bump).subscribe();
  }catch(e){}
  setInterval(()=>{ if(document.hidden) return; if(TAB==='chat') pullNew(false); refreshCollabDot(); },20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&TAB==='chat') pullNew(false); });
}
boot();
</script>
