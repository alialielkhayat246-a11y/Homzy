<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>/* auth gate */
(function(){try{var k=Object.keys(localStorage).find(function(x){return /sb-.*-auth-token/.test(x)});var t=k?JSON.parse(localStorage.getItem(k)):null;var ok=t&&t.access_token&&(!t.expires_at||t.expires_at*1000>Date.now());if(!ok){location.replace('/login?next='+encodeURIComponent(location.pathname));}}catch(e){location.replace('/login');}})();</script>
<title>Homzy — مجتمع البروكرز</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css">
<style>
  .cm{max-width:900px;margin:0 auto;padding:18px 16px 90px;}
  .cm-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .cm-top h1{font-size:22px;} .cm-top .sp{flex:1;}
  .back{display:inline-flex;align-items:center;gap:5px;color:var(--teal-d);font-weight:800;font-size:13.5px;text-decoration:none;margin-bottom:6px;}
  .areasel{border:1.5px solid var(--line-2);border-radius:12px;padding:9px 12px;font-family:var(--ff);font-weight:700;background:#fff;}
  .hint{background:var(--teal-l);color:var(--teal-d);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;margin-bottom:12px;}
  .log{display:flex;flex-direction:column;gap:10px;min-height:46vh;}
  .m{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .m.req{border:2px solid var(--amber);background:#FFFDF5;}
  .m.mine{background:var(--teal-l);border-color:var(--teal-l);}
  .m .h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .m .who{font-weight:800;font-size:14px;} .m .co{color:var(--muted);font-weight:600;font-size:12px;}
  .m .t{color:#33404f;margin-top:6px;font-size:14.5px;white-space:pre-wrap;}
  .m .tm{color:var(--muted);font-size:11px;}
  .m .badge{background:var(--amber);color:#3a2c00;font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px;}
  .m .wa{display:inline-block;margin-top:8px;background:var(--green);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:9px;text-decoration:none;}
  .composer{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .composer .row{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center;}
  .composer input{flex:1;border:1.5px solid var(--line-2);border-radius:100px;padding:11px 16px;font-family:var(--ff);outline:none;}
  .composer button{flex:none;border:none;border-radius:50%;width:46px;height:46px;background:var(--teal);color:#fff;cursor:pointer;font-size:18px;}
  .composer .reqbtn{width:auto;border-radius:12px;padding:0 14px;background:var(--amber);color:#3a2c00;font-weight:800;font-size:13px;}
  .notbroker{padding:60px 20px;text-align:center;}
  /* hub */
  .search{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 14px;font-family:var(--ff);font-size:14px;margin-bottom:16px;outline:none;}
  .grp{margin-bottom:22px;}
  .grp h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .acard{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;text-decoration:none;color:var(--navy);position:relative;transition:border-color .15s,transform .1s;}
  .acard:hover{border-color:var(--teal);transform:translateY(-1px);}
  .acard .nm{font-weight:800;font-size:14px;}
  .acard .go{color:var(--muted);font-size:12px;}
  .acard .cbadge{position:absolute;inset-inline-start:10px;top:10px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:100px;display:flex;align-items:center;justify-content:center;}
  .ov{position:fixed;inset:0;background:rgba(11,29,54,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .ov.open{display:flex;} .ovc{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:22px;}
  .ovc .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;} .ovc label{font-size:13px;font-weight:700;color:#40506a;}
  .ovc input,.ovc select,.ovc textarea{border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;font-family:var(--ff);}
</style>
</head>
<body data-mode="broker">
<div id="hz-header"></div>
<div class="cm" id="app"><div style="padding:50px;text-align:center;color:var(--muted)">…</div></div>

<div class="ov" id="reqOv"><div class="ovc">
  <h2 style="font-size:19px">🔔 اعرض ريكوست على البروكرز</h2>
  <p style="color:var(--muted);font-size:13px;margin:6px 0 14px">اكتب طلب عميلك — البروكرز في المنطقة هيشوفوه ويقدروا يقفلوا معاك.</p>
  <div style="display:flex;gap:10px"><div class="fld" style="flex:1"><label>النوع</label><select id="rqType"><option value="apartment">شقة</option><option value="villa">فيلا</option><option value="duplex">دوبلكس</option><option value="chalet">شاليه</option><option value="office">مكتب</option><option value="shop">محل</option><option value="other">أخرى</option></select></div>
  <div class="fld" style="flex:1"><label>الميزانية</label><input id="rqBudget" placeholder="مثلاً 5 مليون"></div></div>
  <div class="fld"><label>التفاصيل</label><textarea id="rqBody" rows="3" placeholder="عميل عايز شقة 3 غرف استلام فوري…"></textarea></div>
  <div id="rqMsg" style="font-weight:800;margin-bottom:8px"></div>
  <div style="display:flex;gap:10px"><button class="btn btn-teal" style="flex:1" onclick="postRequest()">اعرض الريكوست</button><button class="btn btn-ghost" onclick="document.getElementById('reqOv').classList.remove('open')">إلغاء</button></div>
</div></div>

<div id="hz-footer"></div>
<script src="/assets/eg-areas.js"></script>
<script src="/assets/homzy.js"></script>
<script>
const ar=()=>HZ.lang==='ar';
const AREA_LABEL={};
(window.EG_AREA_GROUPS||[]).forEach(([g])=>(EG_AREAS[g]||[]).forEach(([s,nm])=>AREA_LABEL[s]=nm));
function areaOptions(){
  return (window.EG_AREA_GROUPS||[]).map(([g,gname])=>
    `<optgroup label="${gname}">`+(EG_AREAS[g]||[]).map(a=>`<option value="${a[0]}" ${a[0]===AREA?'selected':''}>${a[1]}</option>`).join('')+`</optgroup>`
  ).join('');
}
// area from the URL path (/community/<slug>) or ?area=, resolved to a known area.
// Falls back to a normalized match (HZ.normArea) so slugs coming from the SEO
// area pages (e.g. "6th-of-october") still land on the right chat ("6-october").
function resolveArea(raw){
  if(!raw) return '';
  raw = decodeURIComponent(raw);
  if(AREA_LABEL[raw]) return raw;                       // exact slug
  const norm = s => (window.HZ && HZ.normArea) ? HZ.normArea(String(s).replace(/-/g,' ')) : String(s).toLowerCase().replace(/-/g,' ').trim();
  const target = norm(raw);
  // try matching the normalized slug OR the Arabic/English label of each area
  for(const [g] of (window.EG_AREA_GROUPS||[])){
    for(const a of (EG_AREAS[g]||[])){
      if(norm(a[0])===target || norm(a[1])===target) return a[0];
    }
  }
  return '';
}
function areaFromUrl(){
  const parts=location.pathname.split('/').filter(Boolean);
  const raw = (parts[0]==='community' && parts[1]) ? parts[1] : (new URLSearchParams(location.search).get('area')||'');
  return resolveArea(raw);
}
let S=null, ISBROKER=false, AREA=areaFromUrl(), TIMER=null, COUNTS={};

function fmtTime(t){ const d=new Date(t); const now=new Date(); const sameDay=d.toDateString()===now.toDateString();
  return sameDay ? d.toLocaleTimeString(ar()?'ar-EG':'en-US',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString(ar()?'ar-EG':'en-US',{day:'numeric',month:'short'}); }
function waNum(p){ let d=(p||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('00'))d=d.slice(2); else if(d.startsWith('0'))d='2'+d; else if(!d.startsWith('2'))d='2'+d; return d; }

/* ---------- HUB: a page listing every area (Cairo/Giza/Alex) ---------- */
async function loadCounts(){
  try{ const rows=await HZ.sbAuth('/broker_area_chat?select=area_slug', S.token)||[];
    COUNTS={}; rows.forEach(r=>{ COUNTS[r.area_slug]=(COUNTS[r.area_slug]||0)+1; });
  }catch(e){ COUNTS={}; }
}
function renderHub(){
  stopArea();
  const q=(document.getElementById('hubQ')?document.getElementById('hubQ').value:'').trim();
  const grid=(window.EG_AREA_GROUPS||[]).map(([g,gname])=>{
    const areas=(EG_AREAS[g]||[]).filter(a=>!q || a[1].includes(q) || a[0].includes(q.toLowerCase()));
    if(!areas.length) return '';
    return `<div class="grp"><h2>📍 ${gname}</h2><div class="grid">`+areas.map(a=>{
      const c=COUNTS[a[0]]||0;
      return `<a class="acard" href="/community/${a[0]}">${c?`<span class="cbadge">${c>99?'99+':c}</span>`:''}
        <span class="nm">${HZ.esc(a[1])}</span><span class="go">${c?(ar()?c+' رسالة':c+' msgs'):(ar()?'ابدأ الشات →':'Start chat →')}</span></a>`;
    }).join('')+`</div></div>`;
  }).join('');
  document.getElementById('app').innerHTML=`
    <h1 style="font-size:22px">💬 ${ar()?'مجتمع البروكرز حسب المنطقة':'Brokers community by area'}</h1>
    <div class="hint" style="margin:10px 0 14px">${ar()?'اختر منطقتك عشان تشوف شات البروكرز فيها — اعرض طلب عميلك أو اقفل ديل مع بروكر عنده الوحدة.':'Pick your area to open its live broker chat — post a client request or co-broke a deal.'}</div>
    <input class="search" id="hubQ" oninput="renderHub()" placeholder="${ar()?'ابحث عن منطقة…':'Search area…'}" value="${HZ.esc(q)}">
    ${grid || `<div style="color:var(--muted);text-align:center;padding:30px">${ar()?'مفيش منطقة بالاسم ده':'No area matches'}</div>`}`;
  const inp=document.getElementById('hubQ'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}

/* ---------- AREA: the live chat for one area ---------- */
async function loadMsgs(){
  if(!ISBROKER || !AREA) return;
  let rows=[]; try{ rows=await HZ.sbAuth('/broker_area_chat?area_slug=eq.'+AREA+'&select=*&order=created_at.desc&limit=80', S.token)||[]; }catch(e){}
  rows.reverse();
  const log=document.getElementById('log'); if(!log) return;
  const atBottom = (log.scrollHeight - log.scrollTop - log.clientHeight) < 120;
  log.innerHTML = rows.length ? rows.map(m=>{
    const mine=m.sender_id===S.uid;
    const wa = (!mine && m.sender_phone) ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(m.sender_phone)}?text=${encodeURIComponent('بخصوص طلبك في مجتمع Homzy')}">💬 كلّمه</a>` : '';
    const meta = m.meta||{};
    const reqLine = m.kind==='request' ? `<div class="co">${[meta.type,meta.budget].filter(Boolean).map(HZ.esc).join(' · ')}</div>` : '';
    return `<div class="m ${m.kind==='request'?'req':''} ${mine?'mine':''}">
      <div class="h"><div><span class="who">${HZ.esc(m.sender_name||(ar()?'بروكر':'Broker'))}</span> ${m.sender_company?`<span class="co">· ${HZ.esc(m.sender_company)}</span>`:''}</div>
        <div style="display:flex;gap:8px;align-items:center">${m.kind==='request'?`<span class="badge">🔔 ${ar()?'ريكوست':'Request'}</span>`:''}<span class="tm">${fmtTime(m.created_at)}</span></div></div>
      ${reqLine}<div class="t">${HZ.esc(m.body)}</div>${wa}</div>`;
  }).join('') : `<div style="text-align:center;color:var(--muted);padding:44px 20px">
      <div style="font-size:34px">💬</div>
      <div style="font-weight:800;margin-top:8px">${ar()?'لسه محدش كتب في '+AREA_LABEL[AREA]:'No messages in '+AREA_LABEL[AREA]+' yet'}</div>
      <div style="font-size:13px;margin-top:4px">${ar()?'كن أول بروكر يعرض طلب عميل أو وحدة متاحة 👇':'Be the first broker to post a request or a unit 👇'}</div></div>`;
  if(atBottom) log.scrollTop=log.scrollHeight;
}
function renderArea(){
  document.title='Homzy — بروكرز '+(AREA_LABEL[AREA]||'');
  document.getElementById('app').innerHTML=`
    <a class="back" href="/community">← ${ar()?'كل المناطق':'All areas'}</a>
    <div class="cm-top"><h1>💬 ${ar()?'بروكرز':'Brokers'} · ${HZ.esc(AREA_LABEL[AREA]||'')}</h1><span class="sp"></span>
      <select class="areasel" onchange="pickArea(this.value)">${areaOptions()}</select></div>
    <div class="hint">${ar()?'اعرض طلب عميلك على بروكرز المنطقة، أو اقفل ديل مع حد عنده الوحدة المناسبة. كل بروكر بيظهر باسمه ورقمه للتواصل.':'Post your client\'s request to area brokers, or close a deal with whoever has the right unit.'}</div>
    <div class="log" id="log"><div style="text-align:center;color:var(--muted);padding:40px">…</div></div>`;
  loadMsgs(); composer();
  if(TIMER) clearInterval(TIMER); TIMER=setInterval(loadMsgs, 4000);
}
function stopArea(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } const c=document.getElementById('cmComposer'); if(c) c.remove(); }
// switching area from the dropdown navigates to that area's page (shareable URL)
window.pickArea=(a)=>{ if(a && a!==AREA){ location.href='/community/'+a; } };

function composer(){
  if(document.getElementById('cmComposer')) return;
  const c=document.createElement('div'); c.className='composer'; c.id='cmComposer';
  c.innerHTML=`<form class="row" id="cmForm"><button type="button" class="reqbtn" onclick="document.getElementById('reqOv').classList.add('open')">🔔 ${ar()?'ريكوست':'Request'}</button>
    <input id="cmInput" autocomplete="off" placeholder="${ar()?'اكتب رسالة لبروكرز '+(AREA_LABEL[AREA]||''):'Message brokers…'}"><button type="submit">➤</button></form>`;
  document.body.appendChild(c);
  document.getElementById('cmForm').addEventListener('submit', async e=>{
    e.preventDefault(); const inp=document.getElementById('cmInput'); const body=(inp.value||'').trim(); if(!body) return; inp.value='';
    try{ await HZ.sbAuth('/rpc/post_area_msg', S.token,'POST',{p_area:AREA,p_body:body,p_kind:'message',p_meta:null}); }catch(e){}
    loadMsgs();
  });
}
window.postRequest=async()=>{
  const body=(document.getElementById('rqBody').value||'').trim(); const msg=document.getElementById('rqMsg');
  if(body.length<3){ msg.style.color='#B42318'; msg.textContent='اكتب تفاصيل الطلب'; return; }
  const meta={type:document.getElementById('rqType').options[document.getElementById('rqType').selectedIndex].text, budget:(document.getElementById('rqBudget').value||'').trim()};
  try{ await HZ.sbAuth('/rpc/post_area_msg', S.token,'POST',{p_area:AREA,p_body:body,p_kind:'request',p_meta:meta}); }catch(e){}
  document.getElementById('reqOv').classList.remove('open'); document.getElementById('rqBody').value=''; document.getElementById('rqBudget').value='';
  loadMsgs();
};

function draw(){
  if(!ISBROKER){
    stopArea();
    document.getElementById('app').innerHTML=`<div class="notbroker"><h2>${ar()?'مجتمع البروكرز':'Brokers community'}</h2>
      <p style="color:var(--muted);margin:12px 0 18px">${ar()?'الميزة دي للبروكرز فقط. فعّل حساب بروكر عشان تتواصل وتقفل ديلز مع بروكرز تانيين.':'This is for brokers only. Become a broker to connect and co-broke deals.'}</p>
      <a class="btn btn-navy" href="/account">${ar()?'ابقى بروكر':'Become a broker'}</a></div>`;
    return;
  }
  if(AREA) renderArea(); else renderHub();
}
async function boot(){
  S=HZ.session(); if(!S){ location.href='/login?next='+encodeURIComponent(location.pathname); return; }
  try{ const p=(await HZ.sbAuth('/profiles?select=role&id=eq.'+S.uid, S.token))[0]; ISBROKER = p&&p.role==='broker'; }catch(e){ ISBROKER=false; }
  if(ISBROKER && !AREA){ await loadCounts(); }
  draw();
  HZ.applyLang();
}
document.addEventListener('hz:lang', ()=>{ draw(); });
window.addEventListener('beforeunload', ()=>{ if(TIMER) clearInterval(TIMER); });
boot();
</script>
</body>
</html>
