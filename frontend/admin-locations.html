<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>/* auth gate */
(function(){try{var k=Object.keys(localStorage).find(function(x){return /sb-.*-auth-token/.test(x)});var t=k?JSON.parse(localStorage.getItem(k)):null;var ok=t&&t.access_token&&(!t.expires_at||t.expires_at*1000>Date.now());if(!ok){location.replace('/login?next='+encodeURIComponent(location.pathname));}}catch(e){location.replace('/login');}})();</script>
<title>Homzy — مراجعة أماكن المشروعات</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=7">
<style>
  .ad{max-width:1080px;margin:0 auto;padding:22px;}
  .filters{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
  .filters button{padding:7px 13px;border-radius:100px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--ff);}
  .filters button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:14px;}
  .row img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;cursor:zoom-in;}
  .row .b{flex:1;min-width:0;}
  .row .t{font-weight:800;font-size:16px;} .row .m{color:#40506a;font-size:13.5px;margin-top:5px;line-height:1.7;}
  .cmp{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;font-weight:700;}
  .cmp span{padding:5px 10px;border-radius:9px;background:#F2F4F7;}
  .cmp .new{background:#E7F6EC;color:#137a3e;} .cmp .old{background:#FDECEC;color:#B42318;text-decoration:line-through;}
  .q{background:#FFF8E6;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px;direction:auto;}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .acts button,.acts select{font-size:13px;padding:7px 12px;border-radius:9px;border:1.5px solid var(--line-2);background:#fff;font-weight:800;cursor:pointer;font-family:var(--ff);}
  .acts .ok{border-color:#137a3e;color:#137a3e;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  @media(max-width:600px){ .row{flex-direction:column;} .row img{width:100%;height:160px;} }
</style>
</head>
<body data-mode="broker">
<div id="hz-header"></div>
<div class="ad">
  <h1>مراجعة أماكن المشروعات</h1>
  <p style="color:var(--muted);margin-top:6px">الفحص الآلي بيقرا غلاف كل مشروع والبروشور والوصف وتحديثات الجروبات، ويطلّع المكان المكتوب فعلاً. اللي كان واضح اتصلّح لوحده، وهنا اللي محتاج قرارك، واللي اتغيّر تلقائي عشان تراجعه لو حابب.</p>
  <div class="filters" id="filters"></div>
  <div id="content"><div class="empty">…</div></div>
</div>
<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=21"></script>
<script>
let S=null, ROWS=[], FILTER='review';
const esc=HZ.esc;
const rpc=(fn,a)=>HZ.sbAuth('/rpc/'+fn, S.token, 'POST', a||{});
const AREAS=['New Cairo','New Capital','Mostakbal City','El Shorouk','Madinaty','El Obour','Badr City','New Heliopolis','Heliopolis',
  'Sheraton','Nasr City','Maadi','Zahraa El Maadi','Mokattam','Old Cairo','6th of October','October Gardens','New October',
  'Sheikh Zayed','New Zayed','North Coast','Ras El Hekma','New Alamein','Alexandria','Ain Sokhna','Galala','Ras Sudr',
  'Hurghada','El Gouna','Sahl Hasheesh','Soma Bay','Makadi Bay','Red Sea','Sharm El Sheikh','Marsa Alam','New Mansoura','Dreamland'];
const TAB={review:'محتاجة قرارك',changed:'اتصلّحت تلقائي',country:'خارج مصر'};
const SRC={cover:'الغلاف',image:'صورة',brochure:'البروشور',description:'الوصف',whatsapp:'الجروبات',name:'الاسم',none:'—'};
function renderFilters(){
  document.getElementById('filters').innerHTML=Object.keys(TAB).map(k=>{
    const n=ROWS.filter(r=>r.action===k && !(k==='review'&&r.reviewed_at)).length;
    return `<button class="${k===FILTER?'on':''}" onclick="FILTER='${k}';render()">${TAB[k]} (${n})</button>`; }).join('');
}
function render(){
  renderFilters();
  const rows=ROWS.filter(r=>r.action===FILTER), box=document.getElementById('content');
  if(!rows.length){ box.innerHTML='<div class="empty">مفيش حاجة هنا 👌</div>'; return; }
  box.innerHTML=rows.map(r=>{
    const found=AREAS.includes(r.found_area)?r.found_area:'';
    return `<div class="row">
    ${r.cover?`<img loading="lazy" src="${esc(r.cover)}" onclick="window.open('${esc(r.cover)}','_blank')">`:''}
    <div class="b">
      <div class="t">${esc(r.name_ar||r.name||'')}</div>
      <div class="m">${esc(r.developer||'')}</div>
      <div class="cmp">
        <span class="${r.old_area&&r.old_area!==r.found_area?'old':''}">المسجّل: ${esc(r.old_area||'مفيش')}</span>
        <span class="new">المكتوب: ${esc(r.found_area||'مش واضح')}${r.found_country&&r.found_country!=='EG'?' ('+esc(r.found_country)+')':''}</span>
        ${r.location_ar?`<span>📍 ${esc(r.location_ar)}</span>`:''}
        <span>المصدر: ${SRC[r.source]||esc(r.source||'')} · ثقة ${Math.round((r.confidence||0)*100)}%</span>
      </div>
      ${r.quote?`<div class="q">«${esc(r.quote)}»</div>`:''}
      ${r.note?`<div class="m">${esc(r.note)}</div>`:''}
      ${r.reviewed_at?`<div class="m">✔️ اتراجعت: ${esc(r.review_decision||'')}</div>`:`
      <div class="acts">
        ${found?`<button class="ok" onclick="decide(${r.id},'${esc(found)}','EG')">✅ اعتمد ${esc(found)}</button>`:''}
        <select id="sel${r.id}"><option value="">اختار منطقة…</option>${AREAS.map(a=>`<option ${a===r.area_now?'selected':''}>${a}</option>`).join('')}</select>
        <button onclick="pick(${r.id})">حفظ المنطقة</button>
        <button onclick="decide(${r.id},'',prompt('كود الدولة (مثلاً AE):','AE')||'')">🌍 خارج مصر</button>
      </div>`}
    </div></div>`; }).join('');
}
async function load(){
  try{ ROWS=await rpc('admin_location_review',{p_all:true})||[]; }
  catch(e){ document.getElementById('content').innerHTML='<div class="empty">الصفحة دي للأدمن بس.</div>'; return; }
  render();
}
window.pick=id=>{ const v=document.getElementById('sel'+id).value; if(!v) return alert('اختار منطقة'); decide(id,v,'EG'); };
window.decide=async(id,area,country)=>{
  if(!country) return;
  const r=ROWS.find(x=>x.id===id)||{};
  try{ await rpc('admin_location_decide',{p_audit:id,p_area:area,p_country:country,p_location:r.location_ar||null}); await load(); }
  catch(e){ alert('تعذّر الحفظ: '+(e.message||e)); }
};
(async()=>{ S=HZ.session(); if(!S) return; await load(); })();
</script>
</body>
</html>
