<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>باقات Homzy — اشتراكات البروكرز</title>
<meta name="description" content="باقات Homzy الشهرية للبروكرز والمكاتب — CRM، مساعد مبيعات ذكي، وحدات غير محدودة، ليدز، واستضافة Homzy Stays." />
<link rel="canonical" href="https://homzy-ai.com/pricing" />
<meta property="og:type" content="website" /><meta property="og:site_name" content="Homzy" />
<meta property="og:title" content="باقات Homzy" /><meta property="og:description" content="اشتراكات شهرية لأدوات البروكر في Homzy." />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B1D36" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=4">
<style>
  .price-hero{text-align:center;padding:56px 0 20px;}
  .price-hero h1{font-size:clamp(28px,4vw,42px);font-family:var(--fd);}
  .price-hero p{color:#5b6b82;font-size:17px;margin-top:12px;}
  .cyc{display:inline-flex;gap:4px;background:#fff;border:1.5px solid var(--line-2);border-radius:100px;padding:4px;margin-top:20px;}
  .cyc button{border:none;background:none;font-family:var(--ff);font-weight:800;font-size:14px;padding:8px 18px;border-radius:100px;cursor:pointer;color:var(--muted);}
  .cyc button.on{background:var(--navy);color:#fff;}
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1000px;margin:34px auto 0;align-items:start;}
  @media(max-width:860px){.plans{grid-template-columns:1fr;max-width:420px;}}
  .plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;box-shadow:var(--shadow-sm);}
  .plan.pop{border:2px solid var(--teal);box-shadow:var(--shadow);}
  .plan .tag{position:absolute;top:-13px;inset-inline-start:50%;transform:translateX(50%);background:var(--teal);color:#fff;font-size:12px;font-weight:800;padding:5px 14px;border-radius:100px;}
  .plan h3{font-size:22px;}
  .plan .price{margin:14px 0 4px;} .plan .price b{font-size:38px;font-family:var(--fd);} .plan .price span{color:var(--muted);font-weight:600;}
  .plan .yr{color:var(--teal-d);font-size:13px;font-weight:700;min-height:18px;}
  .plan ul{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:10px;}
  .plan li{display:flex;gap:9px;font-size:14.5px;color:#33404f;}
  .plan li .ic{color:var(--teal);font-weight:900;flex:none;}
  .plan li.off{color:#aab2bd;} .plan li.off .ic{color:#cfd6dd;}
  .plan .cta{width:100%;margin-top:8px;}
  .cur{text-align:center;font-weight:800;color:#137a3e;padding:12px;}
  .note{max-width:760px;margin:34px auto 0;color:var(--muted);font-size:13.5px;text-align:center;line-height:1.9;}
  /* current-subscription banner */
  .curplan{max-width:1000px;margin:26px auto 0;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow);}
  .curplan .cp-badge{display:inline-block;background:rgba(255,255,255,.18);border-radius:100px;padding:3px 11px;font-size:12px;font-weight:800;margin-bottom:7px;}
  .curplan b{font-size:23px;font-family:var(--fd);display:block;line-height:1.1;}
  .curplan .cp-status{font-size:13px;opacity:.92;display:inline-block;margin-top:4px;}
  .curplan .cp-r{text-align:end;font-size:13.5px;opacity:.95;line-height:1.75;}
  .curplan .cp-r .up{display:inline-block;margin-top:8px;background:#fff;color:var(--navy);font-weight:800;font-size:13px;padding:8px 15px;border-radius:10px;text-decoration:none;}
  .curplan .cp-btns{display:flex;gap:8px;margin-top:11px;justify-content:flex-end;flex-wrap:wrap;}
  .curplan .cp-btns button{font-family:var(--ff);font-weight:800;font-size:13px;border-radius:10px;padding:8px 15px;cursor:pointer;border:none;transition:opacity .15s,background .15s;}
  .curplan .cp-change{background:#fff;color:var(--navy);}
  .curplan .cp-cancel{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.45);}
  .curplan .cp-cancel:hover{background:rgba(255,255,255,.2);}
  .curplan .cp-btns button:disabled{opacity:.6;cursor:default;}
  @media(max-width:560px){.curplan{flex-direction:column;align-items:flex-start;} .curplan .cp-r{text-align:start;} .curplan .cp-btns{justify-content:flex-start;}}
</style>
</head>
<body data-mode="broker">
<div id="hz-header"></div>
<section class="section" style="padding-top:20px">
  <div class="wrap">
    <div class="price-hero">
      <span class="eyebrow" data-ar="Homzy للمحترفين" data-en="Homzy for pros">Homzy للمحترفين</span>
      <h1 data-ar="اختر باقتك" data-en="Choose your plan">اختر باقتك</h1>
      <p data-ar="أدوات احترافية للبروكرز والمكاتب — ادفع شهري، وابدأ بتجربة مجانية 3 شهور." data-en="Professional tools for brokers and agencies — pay monthly, start with a free 3-month trial.">أدوات احترافية للبروكرز والمكاتب — ادفع شهري، وابدأ بتجربة مجانية 3 شهور.</p>
      <div class="cyc"><button class="on" id="cM" onclick="setCyc('monthly')" data-ar="شهري" data-en="Monthly">شهري</button><button id="cY" onclick="setCyc('yearly')" data-ar="سنوي · وفّر شهرين" data-en="Yearly · save 2 months">سنوي · وفّر شهرين</button></div>
    </div>
    <div class="curplan" id="curplan" hidden>
      <div><span class="cp-badge" data-ar="باقتك الحالية" data-en="Your current plan">باقتك الحالية</span><b id="cpName">—</b><span class="cp-status" id="cpStatus"></span></div>
      <div class="cp-r" id="cpMeta"></div>
    </div>
    <div id="plans" class="plans"><div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">…</div></div>
    <div class="note">
      <span data-ar="💳 الدفع الشهري عبر بوابة الدفع — بيتفعّل قريبًا. دلوقتي تقدر تبدأ <b>تجربة مجانية 3 شهور</b>." data-en="💳 Monthly payment via the payment gateway — coming soon. For now you can start a <b>free 3-month trial</b>.">💳 الدفع الشهري عبر بوابة الدفع — بيتفعّل قريبًا. دلوقتي تقدر تبدأ <b>تجربة مجانية 3 شهور</b>.</span><br>
      <span data-ar="الأسعار بالجنيه المصري شاملة، وممكن تتغير." data-en="Prices are in EGP, inclusive, and may change.">الأسعار بالجنيه المصري شاملة، وممكن تتغير.</span>
    </div>
  </div>
</section>
<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=4"></script>
<script>
let PLANS=[], CYC='monthly', CURRENT='free', PAY_ON=false;
const ar=()=>!(window.HZ&&HZ.lang==='en');
const L=(a,e)=>ar()?a:e;
const money=n=>Number(n).toLocaleString(ar()?'ar-EG':'en-US');
const cur=()=>L('ج.م','EGP');
function featRow(on,txt){ return `<li class="${on?'':'off'}"><span class="ic">${on?'✓':'—'}</span><span>${txt}</span></li>`; }
function planCard(p){
  const f=p.features||{};
  const price = CYC==='yearly' ? p.price_yearly : p.price_monthly;
  const per = CYC==='yearly' ? L('سنويًا','yr') : L('شهريًا','mo');
  const yr = (CYC==='monthly' && p.price_yearly>0) ? L('أو '+money(p.price_yearly)+' ج.م سنويًا (وفّر شهرين)','or '+money(p.price_yearly)+' EGP/yr (save 2 months)') : '';
  const isCur = p.plan===CURRENT;
  const feats = [
    featRow(true, p.max_listings==null?L('وحدات غير محدودة','Unlimited listings'):L('حتى '+p.max_listings+' وحدات','Up to '+p.max_listings+' listings')),
    featRow(true, p.max_clients==null?L('عملاء بلا حدود (CRM)','Unlimited CRM clients'):L('CRM حتى '+p.max_clients+' عميل','CRM up to '+p.max_clients+' clients')),
    featRow(f.ai_sales, L('مساعد المبيعات الذكي','AI sales assistant')),
    featRow(f.branded_pdf, L('عروض PDF باسمك ولوجوك','Branded PDF offers')),
    featRow(f.logo_watermark, L('لوجوك تلقائيًا على صور الوحدات','Auto logo watermark on photos')),
    featRow(f.voice, L('إدخال صوتي في الـCRM','Voice input in the CRM')),
    featRow(p.leads_included>0, p.leads_included>0?L(p.leads_included+' ليد مضمّنة/شهر',p.leads_included+' leads included/mo'):L('ليدز مضمّنة','Included leads')),
    featRow(true, L('استضافة Homzy Stays','Homzy Stays hosting')),
    featRow(p.team_seats>1, p.team_seats>1?L(p.team_seats+' حسابات فريق',p.team_seats+' team seats'):L('حساب واحد','Single seat')),
    featRow(f.featured, L('وحدات مميّزة في البحث','Featured units in search')),
    featRow(f.analytics, L('تحليلات + دعم أولوية','Analytics + priority support')),
  ].join('');
  let cta;
  if(p.plan==='free') cta = isCur?`<div class="cur">${L('باقتك الحالية','Your current plan')}</div>`:`<a class="btn btn-ghost cta" href="/my-listings">${L('ابدأ مجانًا','Start free')}</a>`;
  else if(isCur) cta = `<div class="cur">${L('باقتك الحالية ✓','Your current plan ✓')}</div>`;
  else {
    const payBtn = PAY_ON ? `<button class="btn ${p.plan==='pro'?'btn-teal':'btn-navy'} cta" onclick="payPlan('${p.plan}')">${L('اشترك الآن','Subscribe now')} · ${money(price)} ${cur()}</button>` : '';
    cta = payBtn + `<button class="btn ${PAY_ON?'btn-ghost':(p.plan==='pro'?'btn-teal':'btn-navy')} cta" style="${PAY_ON?'margin-top:8px':''}" onclick="subscribe('${p.plan}')">${L('ابدأ تجربة 3 شهور مجانًا','Start 3-month free trial')}</button>`;
  }
  return `<div class="plan ${p.plan==='pro'?'pop':''}">${p.plan==='pro'?`<span class="tag">${L('الأكثر رواجًا','Most popular')}</span>`:''}
    <h3>${HZ.esc(ar()?p.name_ar:(p.name_en||p.name_ar))}</h3>
    <div class="price">${price>0?`<b>${money(price)}</b> <span>${cur()} / ${per}</span>`:`<b>${L('مجاني','Free')}</b>`}</div>
    <div class="yr">${yr}</div>
    <ul>${feats}</ul>
    ${cta}</div>`;
}
function render(){ document.getElementById('plans').innerHTML = PLANS.map(planCard).join(''); }
window.setCyc=(c)=>{ CYC=c; document.getElementById('cM').classList.toggle('on',c==='monthly'); document.getElementById('cY').classList.toggle('on',c==='yearly'); render(); };
window.subscribe=async(plan)=>{
  const s=HZ.session(); if(!s){ location.href='/login?next='+encodeURIComponent('/pricing'); return; }
  let r; try{ r=await HZ.sbAuth('/rpc/start_trial', s.token,'POST',{p_plan:plan}); }catch(e){ r={ok:false}; }
  if(r&&r.ok){ alert(L('تم تفعيل تجربتك المجانية 3 شهور لباقة '+plan.toUpperCase()+' 🎉','Your 3-month free trial of '+plan.toUpperCase()+' is active 🎉')); location.href='/my-listings'; }
  else{
    const m=ar()?{already_subscribed:'عندك اشتراك فعّال بالفعل.',trial_used:'استخدمت التجربة المجانية قبل كده — الدفع هيتفعّل قريبًا.',not_authenticated:'سجّل دخولك الأول.'}
                :{already_subscribed:'You already have an active subscription.',trial_used:'You already used the free trial — paid activation is coming soon.',not_authenticated:'Please sign in first.'};
    alert(m[r&&r.error]||L('تعذّر التفعيل — حاول تاني.','Could not activate — try again.'));
  }
};
window.payPlan=async(plan)=>{ const r=await HZ.pay('subscription',{plan,cycle:CYC}); if(!(r&&r.ok)) alert(L('تعذّر فتح صفحة الدفع: ','Could not open checkout: ')+((r&&r.error)||'')); };
let SUB=null;
const fmtDate=d=>{ try{ return new Date(d).toLocaleDateString(ar()?'ar-EG':'en-US',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } };
const daysLeft=d=>{ const n=Math.ceil((new Date(d)-Date.now())/864e5); return n>0?n:0; };
function renderCurrentBanner(){
  const s=HZ.session(); const box=document.getElementById('curplan');
  if(!s){ box.hidden=true; return; }
  const plan=PLANS.find(p=>p.plan===CURRENT);
  const name = plan ? (ar()?plan.name_ar:(plan.name_en||plan.name_ar)) : (CURRENT==='free'?L('المجانية','Free'):CURRENT.toUpperCase());
  document.getElementById('cpName').textContent = name;
  let status='', meta='';
  const st = SUB && SUB.plan===CURRENT ? SUB.status : (CURRENT==='free'?'free':null);
  if(st==='trialing'){
    status=L('🎁 تجربة مجانية','🎁 Free trial');
    if(SUB&&SUB.trial_end) meta = L('تنتهي التجربة في '+fmtDate(SUB.trial_end)+' · باقي <b>'+daysLeft(SUB.trial_end).toLocaleString('ar-EG')+'</b> يوم','Trial ends '+fmtDate(SUB.trial_end)+' · <b>'+daysLeft(SUB.trial_end)+'</b> days left');
  } else if(st==='active'){
    status=L('✅ مفعّلة','✅ Active')+(SUB&&SUB.billing_cycle?(' · '+(SUB.billing_cycle==='yearly'?L('سنوي','yearly'):L('شهري','monthly'))):'');
    if(SUB&&SUB.current_period_end) meta = L('تتجدد في ','Renews ')+fmtDate(SUB.current_period_end);
  } else if(CURRENT==='free'){
    status=L('باقة مجانية','Free plan');
    meta = L('طوّر باقتك عشان تفتح كل الأدوات 👇','Upgrade to unlock every tool 👇');
  } else {
    status = st ? st : '';
  }
  document.getElementById('cpStatus').textContent = status;
  // paid (trial/active) subscribers get change-plan + cancel actions
  const paid = (st==='trialing' || st==='active');
  const actions = paid
    ? `<div class="cp-btns"><button class="cp-change" onclick="scrollToPlans()">${L('تغيير الباقة','Change plan')}</button>`
      + `<button class="cp-cancel" id="cancelBtn" onclick="cancelSub()">${L('إلغاء الاشتراك','Cancel subscription')}</button></div>`
    : '';
  document.getElementById('cpMeta').innerHTML = (meta||'') + actions;
  box.hidden=false;
}
window.scrollToPlans=()=>{ document.getElementById('plans').scrollIntoView({behavior:'smooth',block:'start'}); };
window.cancelSub=async()=>{
  const s=HZ.session(); if(!s){ location.href='/login?next='+encodeURIComponent('/pricing'); return; }
  if(!confirm(L('متأكد إنك عايز تلغي اشتراكك؟ هترجع للباقة المجانية.','Cancel your subscription? You will return to the free plan.'))) return;
  const btn=document.getElementById('cancelBtn'); if(btn){ btn.disabled=true; btn.textContent=L('...جاري الإلغاء','Cancelling…'); }
  let r; try{ r=await HZ.sbAuth('/rpc/cancel_subscription', s.token,'POST',{}); }catch(e){ r={ok:false}; }
  if(r&&r.ok){ alert(L('تم إلغاء اشتراكك ورجعت للباقة المجانية.','Your subscription was cancelled — you are back on the free plan.')); location.reload(); }
  else{
    const m=ar()?{no_active_subscription:'مفيش اشتراك فعّال حاليًا.',not_authenticated:'سجّل دخولك الأول.'}
               :{no_active_subscription:'No active subscription right now.',not_authenticated:'Please sign in first.'};
    alert(m[r&&r.error]||L('تعذّر الإلغاء — حاول تاني.','Could not cancel — try again.'));
    if(btn){ btn.disabled=false; btn.textContent=L('إلغاء الاشتراك','Cancel subscription'); }
  }
};
async function boot(){
  try{ PAY_ON = await HZ.checkPay(); }catch(e){ PAY_ON=false; }
  try{ PLANS=await HZ.sb('/plan_limits?select=*&active=eq.true&order=sort')||[]; }catch(e){ PLANS=[]; }
  const s=HZ.session();
  if(s){
    try{ const cp=await HZ.rpc('current_plan',{p_uid:s.uid}); CURRENT=(typeof cp==='string')?cp:((cp&&cp[0])||'free'); }catch(e){}
    try{ SUB=(await HZ.sbAuth('/subscriptions?user_id=eq.'+s.uid+'&select=plan,status,billing_cycle,trial_end,current_period_end', s.token))[0]||null; }catch(e){}
  }
  render();
  renderCurrentBanner();
}
document.addEventListener('hz:lang', ()=>{ if(PLANS.length){ render(); renderCurrentBanner(); } });
boot();
</script>
</body>
</html>
