<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homzy Stays — إيجارات قصيرة المدى في مصر</title>
<meta name="description" content="اكتشف إقامتك المثالية في مصر — شقق وفيلات وشاليهات وشاليهات على البحر للإيجار قصير المدى مع Homzy Stays. احجز بثقة مع مضيفين موثّقين." />
<meta name="keywords" content="إيجار شاليهات, إيجار شقق مصر, إيجار فيلات, الساحل الشمالي, الجونة, شرم الشيخ, حجز إقامة, Homzy Stays" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://homzy-ai.com/stays" />
<meta property="og:site_name" content="Homzy" /><meta property="og:locale" content="ar_EG" /><meta property="og:type" content="website" />
<meta property="og:url" content="https://homzy-ai.com/stays" />
<meta property="og:title" content="Homzy Stays — اكتشف إقامتك المثالية في مصر" />
<meta property="og:description" content="شقق وفيلات وشاليهات للإيجار قصير المدى مع مضيفين موثّقين." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B1D36" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=2">
<style>
  .stays-hero{position:relative; padding:34px 0 22px; background:linear-gradient(160deg,#0B1D36,#0B5563);}
  .stays-hero .wrap{position:relative;}
  .stays-hero h1{color:#fff; font-size:clamp(24px,3.4vw,36px); font-family:var(--fd); letter-spacing:-.5px;}
  .stays-hero p{color:#d7e6ea; font-size:15px; margin-top:8px; max-width:560px;}
  /* search box — destination full width, dates side by side, guests own row */
  .searchbar{margin-top:18px; background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:9px;}
  .searchbar .f{display:flex; flex-direction:column; gap:4px; border:1.5px solid var(--line); border-radius:12px; padding:8px 12px;}
  .searchbar .frow{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .searchbar label{font-size:11.5px; font-weight:700; color:var(--muted);}
  .searchbar input,.searchbar select{border:none; font-family:var(--ff); font-size:15px; font-weight:700; color:var(--navy); background:transparent; outline:none; width:100%; padding:2px 0;}
  .searchbar .go button{height:50px; width:100%; border-radius:12px; font-size:16px;}
  /* guests stepper row */
  .guests{display:flex; gap:9px;}
  .guests .g{flex:1; display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line); border-radius:12px; padding:7px 12px;}
  .guests .g .lab{font-size:12.5px;} .guests .g .lab b{display:block; color:var(--navy); font-size:13.5px;} .guests .g .lab span{color:var(--muted); font-size:11px;}
  .guests .stp{display:flex; align-items:center; gap:9px;}
  .guests .stp button{width:30px; height:30px; border-radius:9px; border:1.5px solid var(--line-2); background:#fff; color:var(--navy); font-size:17px; font-weight:800; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;}
  .guests .stp button:disabled{opacity:.4; cursor:default;}
  .guests .stp .v{min-width:16px; text-align:center; font-weight:800; color:var(--navy);}
  @media(min-width:760px){ .searchbar{display:grid; grid-template-columns:1.5fr 1fr 1fr auto; grid-template-areas:"dest dates dates go" "guests guests guests go"; align-items:end;}
    .searchbar .destf{grid-area:dest;} .searchbar .datesrow{grid-area:dates;} .searchbar .guestsf{grid-area:guests;} .searchbar .go{grid-area:go; align-self:stretch; display:flex; align-items:flex-end;} .searchbar .go button{min-width:150px;} }
  /* host-join banner (state-aware) */
  .hostbanner{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:#EAF2F2; border:1px solid #CFE1E1; border-radius:16px; padding:14px 18px; margin:20px 0 26px;}
  .hostbanner .txt b{color:var(--navy); font-size:16px;} .hostbanner .txt p{color:#4a6068; font-size:13px; margin-top:3px;}
  .hostbanner .hb-cta{background:var(--navy); color:#fff; font-weight:800; font-size:14px; padding:11px 18px; border-radius:11px; text-decoration:none; white-space:nowrap; border:none; cursor:pointer; transition:background .15s;}
  .hostbanner .hb-cta:hover{background:var(--navy-2,#122744);}
  .hostbanner .st{font-size:12px; font-weight:800; padding:4px 10px; border-radius:100px; margin-inline-end:8px;}
  .hostbanner .st.review{background:#FFF4E5; color:#B45309;} .hostbanner .st.rejected{background:#FDE8E4; color:#B42318;} .hostbanner .st.suspended{background:#eee; color:#555;}
  @media(max-width:560px){ .hostbanner{flex-direction:column; align-items:stretch; text-align:start;} .hostbanner .hb-cta{text-align:center;} }
  /* no-image card state */
  .pcard .ph .noimg{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#9fb0b7; background:#eef2f4;}
  .pcard .ph .noimg svg{width:34px; height:34px;} .pcard .ph .noimg span{font-size:12px; font-weight:700;}
  .pcard .ph.nocover img{display:none;} .pcard .ph.nocover{background:#eef2f4;}

  .chips{display:flex; flex-wrap:wrap; gap:10px; padding:6px 2px 2px; margin-top:18px;}
  /* on phones: one smooth horizontal-scroll row instead of wrapping */
  @media(max-width:640px){ .chips{flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch;} .chips .chip{scroll-snap-align:start;} }
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; background:#fff; border:1.5px solid var(--line-2); border-radius:100px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; color:var(--navy); transition:.15s;}
  .chip:hover,.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}

  .row-head{display:flex; align-items:center; justify-content:space-between; margin:8px 0 16px;}
  .row-head h2{font-size:22px;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  @media(max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(max-width:820px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .pcard{cursor:pointer; background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--line); transition:transform .15s, box-shadow .2s;}
  .pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .pcard .ph{position:relative; aspect-ratio:4/3; background:#e9eef1; overflow:hidden;}
  .pcard .ph img{width:100%; height:100%; object-fit:cover;}
  .pcard .badges{position:absolute; top:10px; inset-inline-start:10px; display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:100px; background:#fff; color:var(--navy); box-shadow:var(--shadow-sm);}
  .badge.fav{background:#fff; color:#B42318;}
  .badge.super{background:var(--navy); color:#fff;}
  .pcard .b{padding:13px 14px 16px;}
  .pcard .t{font-weight:800; font-size:15.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:42px;}
  .pcard .loc{color:var(--muted); font-size:13px; margin-top:4px;}
  .pcard .meta{color:#5b6b82; font-size:13px; margin-top:8px;}
  .pcard .pr{display:flex; align-items:baseline; justify-content:space-between; margin-top:11px;}
  .pcard .pr b{font-size:17px;} .pcard .pr .u{font-size:13px; color:var(--muted); font-weight:600;}
  .pcard .rate{font-size:13.5px; font-weight:800;}
  .empty{text-align:center; padding:60px 20px; color:var(--muted);}
  .skel{background:linear-gradient(90deg,#eef1f3,#f6f8f9,#eef1f3); background-size:200% 100%; animation:sh 1.2s infinite;}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-mode="client">
<div id="hz-header"></div>

<section class="stays-hero">
  <div class="wrap">
    <h1 data-ar="إقامتك الجاية في مصر" data-en="Your next stay in Egypt">إقامتك الجاية في مصر</h1>
    <p data-ar="شقق، فيلات وشاليهات للإجازات وإقامات العمل" data-en="Apartments, villas & chalets for holidays and work stays">شقق، فيلات وشاليهات للإجازات وإقامات العمل</p>

    <div class="searchbar">
      <div class="f destf">
        <label for="sDest" data-ar="الوجهة" data-en="Destination">الوجهة</label>
        <select id="sDest"><option value="" data-ar="رايح فين؟" data-en="Where to?">رايح فين؟</option></select>
      </div>
      <div class="frow datesrow">
        <div class="f"><label for="sIn" data-ar="الوصول" data-en="Check-in">الوصول</label><input type="date" id="sIn" onchange="onCheckIn()" /></div>
        <div class="f"><label for="sOut" data-ar="المغادرة" data-en="Check-out">المغادرة</label><input type="date" id="sOut" /></div>
      </div>
      <div class="guestsf guests">
        <div class="g"><span class="lab"><b data-ar="الكبار" data-en="Adults">الكبار</b><span data-ar="١٣+ سنة" data-en="13+ yrs">١٣+ سنة</span></span>
          <span class="stp"><button type="button" aria-label="نقص الكبار" onclick="stepG('adults',-1)">−</button><span class="v" id="gAdults">2</span><button type="button" aria-label="زيادة الكبار" onclick="stepG('adults',1)">+</button></span></div>
        <div class="g"><span class="lab"><b data-ar="الأطفال" data-en="Children">الأطفال</b><span data-ar="٠–١٢ سنة" data-en="0–12 yrs">٠–١٢ سنة</span></span>
          <span class="stp"><button type="button" aria-label="نقص الأطفال" onclick="stepG('children',-1)">−</button><span class="v" id="gChildren">0</span><button type="button" aria-label="زيادة الأطفال" onclick="stepG('children',1)">+</button></span></div>
      </div>
      <div class="go">
        <button class="btn btn-teal" onclick="doSearch()" data-ar="ابحث عن إقامة" data-en="Search stays">ابحث عن إقامة</button>
      </div>
    </div>

    <div class="chips" id="destChips"></div>
  </div>
</section>

<section class="section" style="padding:0;">
  <div class="wrap">
    <!-- state-aware host-join banner (Section 8) -->
    <div class="hostbanner" id="hostBanner" hidden>
      <div class="txt"><b data-ar="انضم كمضيف على Homzy Stays" data-en="Become a host on Homzy Stays">انضم كمضيف على Homzy Stays</b>
        <p data-ar="اعرض شقتك أو فيلتك أو شاليهك، وحدّد سعرك وتستلمه بالكامل." data-en="List your apartment, villa or chalet, set your price and keep it in full.">اعرض شقتك أو فيلتك أو شاليهك، وحدّد سعرك وتستلمه بالكامل.</p></div>
      <div id="hostBannerAction"></div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:40px;">
  <div class="wrap">
    <div id="results" style="display:none;"></div>
    <div id="sections"></div>
  </div>
</section>

<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=2"></script>
<script>
const SBv='/rest/v1';
let CARDS=[], DESTS=[];
const ar=()=>HZ.lang==='ar';
const money=n=> (n==null?'':Number(n).toLocaleString(ar()?'ar-EG':'en-US'));
const nm=d=> ar()? d.name_ar : d.name_en;

const curLabel=cur=> (ar() && (cur==='EGP'||!cur)) ? 'جنيه' : (cur||'EGP');
const num=n=> ar()? Number(n||0).toLocaleString('ar-EG') : n;
const bedLabel=n=> (!n||n===0) ? (ar()?'استوديو':'Studio') : (num(n)+' '+(ar()?'غرف':'bd'));
function card(c){
  const loc=[c.area||c.city, c.governorate].filter(Boolean).join('، ');
  const type=ar()?c.type_ar:c.type_en;
  // Guest-facing badges only when they reflect real, earned criteria (real data).
  const favB = c.is_guest_favorite ? `<span class="badge fav">${ar()?'مفضّل لدى الضيوف':'Guest Favorite'}</span>`:'';
  const supB = c.is_super_host ? `<span class="badge super">${ar()?'مضيف متميز':'Super Host'}</span>`:'';
  const rate = c.reviews_count>0 ? `<span class="rate">★ ${Number(c.rating_avg).toFixed(1)} <span style="color:var(--muted);font-weight:600">(${c.reviews_count})</span></span>`:'';
  // Real photo, or an honest "no photo yet" state — never a random stock image.
  const ph = c.cover
    ? `<img loading="lazy" src="${HZ.esc(c.cover)}" alt="${HZ.esc(c.title)}" onerror="this.closest('.ph').classList.add('nocover')"/>`
    : `<div class="noimg"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="10" r="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M4 17l4.5-4 3 2.5L15 12l5 5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>${ar()?'لا توجد صورة بعد':'No photo yet'}</span></div>`;
  return `<div class="pcard" onclick="location.href='/stays/${c.id}'">
    <div class="ph"><div class="badges">${favB}${supB}</div>${ph}</div>
    <div class="b">
      <div class="t">${HZ.esc(c.title)}</div>
      <div class="loc">${HZ.esc(type)} · ${HZ.esc(loc)}</div>
      <div class="meta">${num(c.max_guests)} ${ar()?'ضيوف':'guests'} · ${bedLabel(c.bedrooms)} · ${num(c.bathrooms)} ${ar()?'حمام':'ba'}</div>
      <div class="pr"><span><b>${money(HZ.guestPrice(c.base_price))}</b> <span class="u">${curLabel(c.currency)} / ${ar()?'ليلة':'night'}</span></span>${rate}</div>
    </div></div>`;
}

function sectionRow(titleAr,titleEn,list){
  if(!list.length) return '';
  return `<div class="row-head"><h2>${ar()?titleAr:titleEn}</h2></div>
    <div class="grid" style="margin-bottom:38px">${list.map(card).join('')}</div>`;
}

function renderSections(){
  const s=document.getElementById('sections');
  const fav=CARDS.filter(c=>c.is_guest_favorite);
  const top=[...CARDS].sort((a,b)=>b.rating_avg-a.rating_avg).slice(0,8);
  const nw=[...CARDS].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);
  const beach=CARDS.filter(c=>['north-coast','ain-sokhna','el-gouna','hurghada','sharm-el-sheikh','dahab','sahel','ras-el-hekma'].includes(c.destination_slug));
  if(!CARDS.length){ s.innerHTML=`<div class="empty">${ar()?'لسه مفيش إقامات متاحة — كن أول مضيف!':'No stays yet — be the first host!'}</div>`; return; }
  s.innerHTML =
      sectionRow('مفضّلة لدى الضيوف','Guest Favorites',fav)
    + sectionRow('الأعلى تقييمًا','Highly rated',top)
    + sectionRow('إقامات على البحر','Beach stays',beach)
    + sectionRow('أضيفت حديثًا','New listings',nw);
}

// ---- guests steppers (adults + children) ----
const G={adults:2, children:0};
window.stepG=(kind,delta)=>{
  const min = kind==='adults'?1:0;
  G[kind]=Math.max(min, Math.min(16, G[kind]+delta));
  document.getElementById(kind==='adults'?'gAdults':'gChildren').textContent = ar()? G[kind].toLocaleString('ar-EG') : G[kind];
};
const totalGuests=()=> G.adults + G.children;
// ---- prevent checkout <= checkin ----
window.onCheckIn=()=>{
  const inp=document.getElementById('sIn'), out=document.getElementById('sOut'), v=inp.value;
  if(!v) return;
  const next=new Date(v); next.setDate(next.getDate()+1); const min=next.toISOString().slice(0,10);
  out.min=min; if(!out.value || out.value<=v) out.value=min;
};

function doSearch(){
  const dest=document.getElementById('sDest').value;
  const guests=totalGuests();
  let list=CARDS.filter(c=> (!dest||c.destination_slug===dest) && (!guests||c.max_guests>=guests));
  const res=document.getElementById('results'), sec=document.getElementById('sections');
  sec.style.display='none'; res.style.display='block';
  const label = dest ? (DESTS.find(d=>d.slug===dest)||{}) : null;
  res.innerHTML = `<div class="row-head"><h2>${list.length} ${ar()?'إقامة':'stays'}${label?(' — '+nm(label)):''}</h2>
      <button class="btn btn-ghost btn-sm" onclick="clearSearch()">${ar()?'مسح':'Clear'}</button></div>`
    + (list.length? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${ar()?'مفيش نتائج مطابقة — جرّب وجهة تانية.':'No matches — try another destination.'}</div>`);
  window.scrollTo({top:document.querySelector('.stays-hero').offsetHeight-20,behavior:'smooth'});
}
function clearSearch(){ document.getElementById('results').style.display='none'; document.getElementById('sections').style.display='block'; document.getElementById('sDest').value=''; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); }

// ---- state-aware host-join banner (reuses the existing stay_hosts status) ----
async function renderHostBanner(){
  const banner=document.getElementById('hostBanner'), act=document.getElementById('hostBannerAction');
  if(!banner||!act) return; banner.hidden=false;
  const s=HZ.session();
  let cta=`<a class="hb-cta" href="/host">${ar()?'أضف وحدتك +':'List your place +'}</a>`;
  if(s){
    try{
      const h=(await HZ.sbAuth('/stay_hosts?user_id=eq.'+s.uid+'&select=verification_status', s.token))||[];
      if(h.length){
        const vs=h[0].verification_status;
        if(vs==='verified') cta=`<a class="hb-cta" href="/host/properties">${ar()?'لوحة المضيف':'Host dashboard'}</a>`;
        else if(vs==='rejected') cta=`<span class="st rejected">${ar()?'مرفوض':'Rejected'}</span><a class="hb-cta" href="/host/verification">${ar()?'أعد التقديم':'Re-apply'}</a>`;
        else if(vs==='suspended') cta=`<span class="st suspended">${ar()?'موقوف':'Suspended'}</span><a class="hb-cta" href="/host/verification">${ar()?'التفاصيل':'Details'}</a>`;
        else { // pending: distinguish draft (no docs) vs in-review (docs uploaded)
          let docs=[]; try{ docs=await HZ.sbAuth('/stay_verifications?user_id=eq.'+s.uid+'&select=id&limit=1', s.token)||[]; }catch(e){}
          cta = docs.length
            ? `<span class="st review">${ar()?'قيد المراجعة':'In review'}</span><a class="hb-cta" href="/host/verification">${ar()?'تابع طلب التفعيل':'Track application'}</a>`
            : `<a class="hb-cta" href="/host/verification">${ar()?'استكمل تسجيلك':'Complete signup'}</a>`;
        }
      }
    }catch(e){}
  }
  act.innerHTML=cta;
}

async function boot(){
  // default dates: tomorrow + 3 nights
  const t=new Date(Date.now()+864e5), o=new Date(Date.now()+4*864e5);
  document.getElementById('sIn').value=t.toISOString().slice(0,10);
  document.getElementById('sOut').value=o.toISOString().slice(0,10);
  document.getElementById('sIn').min=new Date().toISOString().slice(0,10);
  document.getElementById('sOut').min=new Date(Date.now()+2*864e5).toISOString().slice(0,10);
  renderHostBanner();

  try{ DESTS=await HZ.sb('/stay_destinations?select=*&active=eq.true&order=sort')||[]; }catch(e){ DESTS=[]; }
  const sel=document.getElementById('sDest');
  sel.insertAdjacentHTML('beforeend', DESTS.map(d=>`<option value="${d.slug}" data-ar="${HZ.esc(d.name_ar)}" data-en="${HZ.esc(d.name_en)}">${HZ.esc(nm(d))}</option>`).join(''));
  document.getElementById('destChips').innerHTML = DESTS.slice(0,10).map(d=>`<div class="chip" data-slug="${d.slug}" onclick="chipPick('${d.slug}')" data-ar="${HZ.esc(d.name_ar)}" data-en="${HZ.esc(d.name_en)}">${HZ.esc(nm(d))}</div>`).join('');

  await HZ.loadStaysRate();   // inclusive guest prices (platform markup hidden)
  try{ CARDS=await HZ.sb('/stay_cards?select=*&order=created_at.desc')||[]; }catch(e){ CARDS=[]; }
  renderSections();
  HZ.applyLang();
}
window.chipPick=(slug)=>{ document.getElementById('sDest').value=slug; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.slug===slug)); doSearch(); };
document.addEventListener('hz:lang', ()=>{
  document.getElementById('gAdults').textContent = ar()?G.adults.toLocaleString('ar-EG'):G.adults;
  document.getElementById('gChildren').textContent = ar()?G.children.toLocaleString('ar-EG'):G.children;
  renderHostBanner();
  if(document.getElementById('results').style.display!=='none') doSearch(); else renderSections();
});
boot();
</script>
</body>
</html>
