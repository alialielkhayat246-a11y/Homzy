<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homzy Stays — إيجارات قصيرة المدى في مصر</title>
<meta name="description" content="اكتشف إقامتك المثالية في مصر — شقق وفيلات وشاليهات وشاليهات على البحر للإيجار قصير المدى مع Homzy Stays. احجز بثقة مع مضيفين موثّقين." />
<meta name="keywords" content="إيجار شاليهات, إيجار شقق مصر, إيجار فيلات, الساحل الشمالي, الجونة, شرم الشيخ, حجز إقامة, Homzy Stays" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://homzy-ai.com/stays" />
<meta property="og:site_name" content="Homzy" /><meta property="og:locale" content="ar_EG" /><meta property="og:type" content="website" />
<meta property="og:url" content="https://homzy-ai.com/stays" />
<meta property="og:title" content="Homzy Stays — اكتشف إقامتك المثالية في مصر" />
<meta property="og:description" content="شقق وفيلات وشاليهات للإيجار قصير المدى مع مضيفين موثّقين." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0B1D36" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css">
<style>
  .stays-hero{position:relative; padding:56px 0 34px; background:linear-gradient(160deg,#0B1D36,#0B5563);}
  .stays-hero .wrap{position:relative;}
  .stays-hero h1{color:#fff; font-size:clamp(28px,4vw,44px); font-family:var(--fd); letter-spacing:-.5px;}
  .stays-hero p{color:#d7e6ea; font-size:17px; margin-top:12px; max-width:560px;}
  /* search bar */
  .searchbar{margin-top:26px; background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:10px; display:grid; grid-template-columns:1.4fr 1fr 1fr .8fr auto; gap:8px; align-items:end;}
  .searchbar .f{display:flex; flex-direction:column; gap:5px; padding:8px 12px;}
  .searchbar .f + .f{border-inline-start:1px solid var(--line);}
  .searchbar label{font-size:12px; font-weight:700; color:var(--muted);}
  .searchbar input,.searchbar select{border:none; font-family:var(--ff); font-size:15px; font-weight:600; color:var(--navy); background:transparent; outline:none; width:100%;}
  .searchbar .go{padding:0;}
  .searchbar .go button{height:54px; width:100%; border-radius:13px;}
  @media(max-width:820px){ .searchbar{grid-template-columns:1fr 1fr; } .searchbar .f + .f{border-inline-start:none;} .searchbar .go{grid-column:1/-1;} }

  .chips{display:flex; gap:10px; overflow-x:auto; padding:6px 0 2px; margin-top:18px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; background:#fff; border:1.5px solid var(--line-2); border-radius:100px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; color:var(--navy); transition:.15s;}
  .chip:hover,.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}

  .row-head{display:flex; align-items:center; justify-content:space-between; margin:8px 0 16px;}
  .row-head h2{font-size:22px;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
  @media(max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(max-width:820px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .pcard{cursor:pointer; background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--line); transition:transform .15s, box-shadow .2s;}
  .pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .pcard .ph{position:relative; aspect-ratio:4/3; background:#e9eef1; overflow:hidden;}
  .pcard .ph img{width:100%; height:100%; object-fit:cover;}
  .pcard .badges{position:absolute; top:10px; inset-inline-start:10px; display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:100px; background:#fff; color:var(--navy); box-shadow:var(--shadow-sm);}
  .badge.fav{background:#fff; color:#B42318;}
  .badge.super{background:var(--navy); color:#fff;}
  .pcard .b{padding:13px 14px 16px;}
  .pcard .t{font-weight:800; font-size:15.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:42px;}
  .pcard .loc{color:var(--muted); font-size:13px; margin-top:4px;}
  .pcard .meta{color:#5b6b82; font-size:13px; margin-top:8px;}
  .pcard .pr{display:flex; align-items:baseline; justify-content:space-between; margin-top:11px;}
  .pcard .pr b{font-size:17px;} .pcard .pr .u{font-size:13px; color:var(--muted); font-weight:600;}
  .pcard .rate{font-size:13.5px; font-weight:800;}
  .empty{text-align:center; padding:60px 20px; color:var(--muted);}
  .skel{background:linear-gradient(90deg,#eef1f3,#f6f8f9,#eef1f3); background-size:200% 100%; animation:sh 1.2s infinite;}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-mode="client">
<div id="hz-header"></div>

<section class="stays-hero">
  <div class="wrap">
    <h1 data-ar="اكتشف إقامتك المثالية في مصر" data-en="Find your perfect stay in Egypt">اكتشف إقامتك المثالية في مصر</h1>
    <p data-ar="شقق، فيلات، وشاليهات على البحر — من مضيفين موثّقين، بحجز آمن." data-en="Apartments, villas and beach chalets — from verified hosts, booked securely.">شقق، فيلات، وشاليهات على البحر — من مضيفين موثّقين، بحجز آمن.</p>

    <div class="searchbar">
      <div class="f">
        <label data-ar="الوجهة" data-en="Destination">الوجهة</label>
        <select id="sDest"><option value="" data-ar="كل الوجهات" data-en="Anywhere">كل الوجهات</option></select>
      </div>
      <div class="f">
        <label data-ar="الوصول" data-en="Check-in">الوصول</label>
        <input type="date" id="sIn" />
      </div>
      <div class="f">
        <label data-ar="المغادرة" data-en="Check-out">المغادرة</label>
        <input type="date" id="sOut" />
      </div>
      <div class="f">
        <label data-ar="الضيوف" data-en="Guests">الضيوف</label>
        <input type="number" id="sGuests" min="1" value="2" />
      </div>
      <div class="f go">
        <button class="btn btn-teal" onclick="doSearch()" data-ar="بحث" data-en="Search">بحث</button>
      </div>
    </div>

    <div class="chips" id="destChips"></div>
  </div>
</section>

<section class="section" style="padding-top:40px;">
  <div class="wrap">
    <div id="results" style="display:none;"></div>
    <div id="sections"></div>
  </div>
</section>

<!-- Host CTA -->
<section class="section" style="background:#fff; border-block:1px solid var(--line);">
  <div class="wrap" style="display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;">
    <div>
      <h2 style="font-size:24px" data-ar="عندك وحدة؟ اكسب منها مع Homzy Stays." data-en="Have a property? Earn from it with Homzy Stays.">عندك وحدة؟ اكسب منها مع Homzy Stays.</h2>
      <p style="color:#5b6b82; margin-top:8px" data-ar="اعرض وحدتك، حدّد سعرك، واستقبل حجوزات من ضيوف موثّقين — وHomzy بتاخد 7% بس." data-en="List your place, set your price, and get bookings from verified guests — Homzy takes just 7%.">اعرض وحدتك، حدّد سعرك، واستقبل حجوزات من ضيوف موثّقين — وHomzy بتاخد 7% بس.</p>
    </div>
    <a class="btn btn-navy" href="/host" data-ar="أضف وحدتك" data-en="List your property">أضف وحدتك</a>
  </div>
</section>

<div id="hz-footer"></div>
<script src="/assets/homzy.js"></script>
<script>
const SBv='/rest/v1';
let CARDS=[], DESTS=[];
const ar=()=>HZ.lang==='ar';
const money=n=> (n==null?'':Number(n).toLocaleString(ar()?'ar-EG':'en-US'));
const nm=d=> ar()? d.name_ar : d.name_en;

function card(c){
  const loc=[c.area||c.city, c.governorate].filter(Boolean).join('، ');
  const type=ar()?c.type_ar:c.type_en;
  const favB = c.is_guest_favorite ? `<span class="badge fav">${ar()?'مفضّل لدى الضيوف':'Guest Favorite'}</span>`:'';
  const supB = c.is_super_host ? `<span class="badge super">${ar()?'مضيف متميز':'Super Host'}</span>`:'';
  const rate = c.reviews_count>0 ? `<span class="rate">★ ${Number(c.rating_avg).toFixed(1)} <span style="color:var(--muted);font-weight:600">(${c.reviews_count})</span></span>`:'';
  return `<div class="pcard" onclick="location.href='/stays/${c.id}'">
    <div class="ph"><div class="badges">${favB}${supB}</div>
      <img loading="lazy" src="${HZ.esc(c.cover||'')}" alt="${HZ.esc(c.title)}" onerror="this.style.opacity=0"/></div>
    <div class="b">
      <div class="t">${HZ.esc(c.title)}</div>
      <div class="loc">${HZ.esc(type)} · ${HZ.esc(loc)}</div>
      <div class="meta">${c.max_guests} ${ar()?'ضيوف':'guests'} · ${c.bedrooms} ${ar()?'غرف':'bd'} · ${c.bathrooms} ${ar()?'حمام':'ba'}</div>
      <div class="pr"><span><b>${money(c.base_price)}</b> <span class="u">${c.currency}/${ar()?'ليلة':'night'}</span></span>${rate}</div>
    </div></div>`;
}

function sectionRow(titleAr,titleEn,list){
  if(!list.length) return '';
  return `<div class="row-head"><h2>${ar()?titleAr:titleEn}</h2></div>
    <div class="grid" style="margin-bottom:38px">${list.map(card).join('')}</div>`;
}

function renderSections(){
  const s=document.getElementById('sections');
  const fav=CARDS.filter(c=>c.is_guest_favorite);
  const top=[...CARDS].sort((a,b)=>b.rating_avg-a.rating_avg).slice(0,8);
  const nw=[...CARDS].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);
  const beach=CARDS.filter(c=>['north-coast','ain-sokhna','el-gouna','hurghada','sharm-el-sheikh','dahab','sahel','ras-el-hekma'].includes(c.destination_slug));
  if(!CARDS.length){ s.innerHTML=`<div class="empty">${ar()?'لسه مفيش إقامات متاحة — كن أول مضيف!':'No stays yet — be the first host!'}</div>`; return; }
  s.innerHTML =
      sectionRow('مفضّلة لدى الضيوف','Guest Favorites',fav)
    + sectionRow('الأعلى تقييمًا','Highly rated',top)
    + sectionRow('إقامات على البحر','Beach stays',beach)
    + sectionRow('أضيفت حديثًا','New listings',nw);
}

function doSearch(){
  const dest=document.getElementById('sDest').value;
  const guests=parseInt(document.getElementById('sGuests').value||'1',10);
  let list=CARDS.filter(c=> (!dest||c.destination_slug===dest) && (!guests||c.max_guests>=guests));
  const res=document.getElementById('results'), sec=document.getElementById('sections');
  sec.style.display='none'; res.style.display='block';
  const label = dest ? (DESTS.find(d=>d.slug===dest)||{}) : null;
  res.innerHTML = `<div class="row-head"><h2>${list.length} ${ar()?'إقامة':'stays'}${label?(' — '+nm(label)):''}</h2>
      <button class="btn btn-ghost btn-sm" onclick="clearSearch()">${ar()?'مسح':'Clear'}</button></div>`
    + (list.length? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${ar()?'مفيش نتائج مطابقة — جرّب وجهة تانية.':'No matches — try another destination.'}</div>`);
  window.scrollTo({top:document.querySelector('.stays-hero').offsetHeight-20,behavior:'smooth'});
}
function clearSearch(){ document.getElementById('results').style.display='none'; document.getElementById('sections').style.display='block'; document.getElementById('sDest').value=''; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); }

async function boot(){
  // default dates: tomorrow + 3 nights
  const t=new Date(Date.now()+864e5), o=new Date(Date.now()+4*864e5);
  document.getElementById('sIn').value=t.toISOString().slice(0,10);
  document.getElementById('sOut').value=o.toISOString().slice(0,10);
  document.getElementById('sIn').min=new Date().toISOString().slice(0,10);

  try{ DESTS=await HZ.sb('/stay_destinations?select=*&active=eq.true&order=sort')||[]; }catch(e){ DESTS=[]; }
  const sel=document.getElementById('sDest');
  sel.insertAdjacentHTML('beforeend', DESTS.map(d=>`<option value="${d.slug}" data-ar="${HZ.esc(d.name_ar)}" data-en="${HZ.esc(d.name_en)}">${HZ.esc(nm(d))}</option>`).join(''));
  document.getElementById('destChips').innerHTML = DESTS.slice(0,10).map(d=>`<div class="chip" data-slug="${d.slug}" onclick="chipPick('${d.slug}')" data-ar="${HZ.esc(d.name_ar)}" data-en="${HZ.esc(d.name_en)}">${HZ.esc(nm(d))}</div>`).join('');

  try{ CARDS=await HZ.sb('/stay_cards?select=*&order=created_at.desc')||[]; }catch(e){ CARDS=[]; }
  renderSections();
  HZ.applyLang();
}
window.chipPick=(slug)=>{ document.getElementById('sDest').value=slug; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.slug===slug)); doSearch(); };
document.addEventListener('hz:lang', ()=>{ if(document.getElementById('results').style.display!=='none') doSearch(); else renderSections(); });
boot();
</script>
</body>
</html>
