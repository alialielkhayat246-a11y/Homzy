<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homzy — انضم لفريقك</title>
<meta name="robots" content="noindex" />
<meta property="og:site_name" content="Homzy" />
<meta property="og:title" content="تمت إضافتك لفريق على Homzy" />
<meta property="og:description" content="كمّل تسجيلك بالاسم والموبايل وكلمة المرور وابدأ شغلك مع فريقك على Homzy CRM." />
<meta property="og:image" content="https://homzy-ai.com/assets/icon-512.png" />
<meta property="og:type" content="website" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<meta name="theme-color" content="#0B1D36" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=7">
<style>
  body{background:linear-gradient(160deg,#0B1D36,#0B5563);min-height:100vh;}
  .wc{max-width:460px;margin:0 auto;padding:44px 18px;}
  .card{background:#fff;border-radius:20px;padding:26px;box-shadow:var(--shadow);}
  .ag{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .ag .lg{width:56px;height:56px;border-radius:14px;background:#f1f5f9 center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;}
  .ag h1{font-size:21px;font-family:var(--fd);line-height:1.3;} .ag small{color:var(--muted);font-size:13.5px;}
  .fld{margin-bottom:13px;} .fld label{display:block;font-weight:800;font-size:14px;margin-bottom:6px;}
  .fld input{width:100%;border:1.5px solid var(--line-2,#D8CFC0);border-radius:12px;padding:11px 13px;font:600 15px var(--ff);}
  .fld input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,85,99,.12);}
  .phone{display:flex;direction:ltr;border:1.5px solid var(--line-2,#D8CFC0);border-radius:12px;overflow:hidden;}
  .phone span{display:flex;align-items:center;padding:0 12px;background:#faf8f5;font-weight:800;color:var(--muted);}
  .phone input{border:none;border-radius:0;}
  .msg{min-height:22px;font-weight:700;font-size:14px;margin:4px 0 10px;color:#B42318;} .msg.ok{color:#137a3e;}
  .go{width:100%;} .sw{text-align:center;margin-top:14px;font-size:14px;} .sw a{color:var(--teal);font-weight:800;cursor:pointer;}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wc"><div class="card">
  <div class="ag"><div class="lg" id="agLogo">🏢</div><div><h1 id="agName">…</h1><small id="agRole"></small></div></div>
  <div class="msg" id="msg" role="alert" aria-live="polite"></div>

  <div id="authBox" hidden>
    <div class="fld" id="fName"><label for="name">الاسم</label><input id="name" type="text" autocomplete="name" placeholder="اسمك بالكامل" /></div>
    <div class="fld"><label for="phone">رقم الموبايل</label><div class="phone"><span>+20</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="10XXXXXXXX" /></div></div>
    <div class="fld"><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="new-password" placeholder="6 حروف أو أكتر" /></div>
    <button class="btn btn-navy go" id="goBtn">انضم للفريق</button>
    <div class="sw" id="swTxt">عندك حساب على Homzy؟ <a id="swLink">سجّل دخول</a></div>
    <div class="note">بالانضمام انت موافق على <a href="/terms" target="_blank">الشروط والأحكام</a> و<a href="/privacy" target="_blank">سياسة الخصوصية</a>.</div>
  </div>
  <div id="joinBox" hidden>
    <button class="btn btn-navy go" id="joinBtn">انضم للفريق</button>
    <div class="note" id="whoami"></div>
  </div>
</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://ceoqtkbpdxnkuptnnwjg.supabase.co';
const SB_KEY='sb_publishable_akQqDzkDbBhYJP0q6Z4Dtg_xjQh_Xfb';
const sb=createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
const $=id=>document.getElementById(id);
const CODE=(location.pathname.split('/').pop()||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let MODE='register', BUSY=false;

function normPhone(v){ let d=(v||'').replace(/[^\d]/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('0')) d='20'+d.slice(1); else if(!d.startsWith('20')) d='20'+d; return d; }
const phoneEmail=v=>'p'+normPhone(v)+'@homzy.app';   // same synthetic email as /login
function msg(t,ok){ $('msg').textContent=t||''; $('msg').className='msg'+(ok?' ok':''); }
async function rpc(fn, body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+(session?session.access_token:SB_KEY),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text()); return r.json();
}
const ERR={invalid:'رابط الإضافة ده مش شغال — اطلب رابط جديد من مدير الشركة.',
  seats_full:'مقاعد الفريق مكتملة — كلّم مدير الشركة يزوّد المقاعد وجرّب تاني. (وصله تنبيه بالفعل)'};

async function join(){
  msg('جاري الانضمام…',true);
  let r; try{ r=await rpc('accept_invite',{p_code:CODE}); }catch(e){ r={ok:false}; }
  if(!r||!r.ok){ msg(ERR[r&&r.error]||'حصلت مشكلة — جرّب تاني.'); BUSY=false; $('goBtn').disabled=false; $('joinBtn').disabled=false; return; }
  try{ localStorage.setItem('hz_mode','broker'); }catch(e){}
  msg('انضميت للفريق ✓',true); location.replace('/crm');
}

function setMode(m){
  MODE=m; $('fName').hidden = m!=='register';
  $('goBtn').textContent = m==='register' ? 'انضم للفريق' : 'سجّل دخول وانضم';
  $('pw').autocomplete = m==='register' ? 'new-password' : 'current-password';
  $('swTxt').innerHTML = m==='register' ? 'عندك حساب على Homzy؟ <a id="swLink">سجّل دخول</a>' : 'أول مرة على Homzy؟ <a id="swLink">اعمل حساب</a>';
  $('swLink').onclick=()=>setMode(m==='register'?'login':'register'); msg('');
}

$('goBtn').onclick=async()=>{
  if(BUSY) return;
  const phone=normPhone($('phone').value), pw=$('pw').value, name=$('name').value.trim();
  if(phone.length<12){ msg('تأكد من رقم الموبايل.'); return; }
  if(pw.length<6){ msg('كلمة المرور لازم تكون 6 حروف أو أكتر.'); return; }
  if(MODE==='register' && name.length<2){ msg('اكتب اسمك.'); return; }
  BUSY=true; $('goBtn').disabled=true; msg(MODE==='register'?'جاري إنشاء الحساب…':'جاري تسجيل الدخول…',true);
  try{
    const email=phoneEmail($('phone').value);
    if(MODE==='register'){
      const {error}=await sb.auth.signUp({ email, password:pw, options:{ data:{ role:'broker', phone, name, full_name:name } } });
      if(error) throw error;
      if(!(await sb.auth.getSession()).data.session){ const {error:e2}=await sb.auth.signInWithPassword({email,password:pw}); if(e2) throw e2; }
    }else{
      const {error}=await sb.auth.signInWithPassword({ email, password:pw }); if(error) throw error;
    }
    await join();
  }catch(e){
    const t=String(e&&e.message||e);
    msg(/registered|exists/i.test(t)?'الرقم ده عليه حساب بالفعل — سجّل دخول.':/Invalid login/i.test(t)?'الرقم أو كلمة المرور غلط.':'حصلت مشكلة — جرّب تاني.');
    if(/registered|exists/i.test(t)) setMode('login');
    BUSY=false; $('goBtn').disabled=false;
  }
};
$('joinBtn').onclick=()=>{ if(BUSY) return; BUSY=true; $('joinBtn').disabled=true; join(); };

(async()=>{
  let info; try{ info=await rpc('invite_info',{p_code:CODE}); }catch(e){ info={ok:false}; }
  if(!info||!info.ok){ $('agName').textContent='رابط غير صالح'; msg(ERR.invalid); return; }
  $('agName').textContent='انضم لفريق '+info.agency;
  $('agRole').textContent='هتنضم بدور: '+(info.role_ar||'سيلز');
  if(info.logo){ $('agLogo').style.backgroundImage="url('"+info.logo+"')"; $('agLogo').textContent=''; }
  if(info.seats_full) msg(ERR.seats_full);
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    $('joinBox').hidden=false;
    try{ const r=await fetch(SB_URL+'/rest/v1/profiles?select=full_name,phone&id=eq.'+session.user.id,{headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}}); const p=(await r.json())[0]||{};
      $('whoami').innerHTML='داخل باسم <b>'+(p.full_name||p.phone||'حسابك')+'</b> · <a href="#" id="outLink">مش انت؟</a>';
      $('outLink').onclick=async(e)=>{ e.preventDefault(); await sb.auth.signOut(); location.reload(); };
    }catch(e){}
  }else{ $('authBox').hidden=false; setMode('register'); }
})();
</script>
<script>
// Phone fields: digits only (Arabic digits converted, leading + kept). This page
// doesn't load homzy.js, which applies the same rule everywhere else.
document.addEventListener('input',function(e){ var el=e.target; if(!el||el.tagName!=='INPUT'||(el.type!=='tel'&&el.inputMode!=='tel')) return;
  var v=el.value.replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-0x0660);}).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-0x06F0);});
  var lead=v.trim().charAt(0)==='+'; v=(lead?'+':'')+v.replace(/[^\d\s\-]/g,'').replace(/^\s+/,'');
  if(v!==el.value){ var p=el.selectionStart-(el.value.length-v.length); el.value=v; try{ el.setSelectionRange(p,p); }catch(_){} } },true);
</script>
</body>
</html>
