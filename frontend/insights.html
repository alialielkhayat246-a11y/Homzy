<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Homzy — أدائي</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/homzy.css?v=4">
<style>
  .wrap2{max-width:940px;margin:0 auto;padding:18px 14px 44px;}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .top h1{font-size:21px;}
  .seg{display:flex;background:#fff;border:1.5px solid var(--line-2);border-radius:100px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;font-family:Cairo;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:100px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--navy);color:#fff;}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr 1fr;}}
  @media(max-width:460px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center;}
  .kpi .n{font-size:19px;font-weight:900;color:var(--navy);} .kpi .l{color:var(--muted);font-size:11.5px;margin-top:3px;}
  .kpi.g .n{color:#137a3e;} .kpi.t .n{color:var(--teal-d);} .kpi.o .n{color:#B45309;} .kpi.h .n{color:#B42318;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}
  .card h2{font-size:15px;margin-bottom:14px;}
  .funnel .row{margin-bottom:11px;}
  .funnel .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  .funnel .bar{height:11px;border-radius:100px;background:var(--teal-l);overflow:hidden;}
  .funnel .fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--teal),var(--navy));min-width:2px;}
  .brk .row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .brk .k{width:88px;font-size:12.5px;font-weight:700;color:var(--navy);flex:none;}
  .brk .bar{flex:1;height:10px;border-radius:100px;background:var(--cream);overflow:hidden;}
  .brk .fill{height:100%;border-radius:100px;}
  .brk .v{width:34px;text-align:left;font-size:12px;color:var(--muted);flex:none;}
  .src{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .src:last-child{border-bottom:none;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;}
</style>
<link rel="stylesheet" href="/assets/broker-workspace.css?v=1">
</head>
<body class="broker-workspace" data-mode="broker">
<div id="hz-header"></div>
<div class="wrap2"><a class="btn btn-teal" href="/clients?overview=1" data-ar="كفاءة المبيعات وتوصيات الذكاء الاصطناعي" data-en="Sales efficiency and AI recommendations">كفاءة المبيعات وتوصيات الذكاء الاصطناعي</a></div>
<div class="wrap2">
  <div class="top"><h1 data-ar="📊 أدائي" data-en="📊 My performance">📊 أدائي</h1>
    <div class="seg" id="seg">
      <button data-d="7" data-ar="7 أيام" data-en="7 days">7 أيام</button><button data-d="30" class="on" data-ar="30 يوم" data-en="30 days">30 يوم</button><button data-d="90" data-ar="90 يوم" data-en="90 days">90 يوم</button><button data-d="365" data-ar="سنة" data-en="1 year">سنة</button>
    </div>
  </div>
  <div id="app"><div style="padding:40px;text-align:center;color:var(--muted)">…</div></div>
</div>
<div id="hz-footer"></div>
<script src="/assets/homzy.js?v=4"></script>
<script src="/assets/broker-session.js?v=1"></script>
<script>
const $=id=>document.getElementById(id);
const ar=()=>HZ.lang==='ar';
const L=(a,e)=>ar()?a:e;
const money=n=>Number(n||0).toLocaleString(ar()?'ar-EG':'en-US')+' '+L('ج.م','EGP');
let S=null, DAYS=30;
async function boot(){
  S=await HZ.requireSession(); if(!S)return;
  try{ const p=(await HZ.sbAuth('/profiles?select=role&id=eq.'+S.uid,S.token))[0]; if(!p||p.role!=='broker'){ $('app').innerHTML=`<div style="padding:60px;text-align:center"><h2>${L('أدائي','My performance')}</h2><p style="color:var(--muted);margin:12px 0 18px">${L('مساحة عمل البروكر.','Broker workspace.')}</p><a class="btn btn-navy" href="/account">${L('ابقى بروكر','Become a broker')}</a></div>`; return; } }catch(e){}
  $('seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    [...$('seg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); DAYS=+b.dataset.d; load(); });
  load();
}
async function load(){
  $('app').innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">…</div>';
  const since=new Date(Date.now()-DAYS*864e5).toISOString();
  let r, attr; try{ [r, attr]=await Promise.all([
    HZ.sbAuth('/rpc/crm_broker_stats',S.token,'POST',{p_since:since}),
    HZ.sbAuth('/rpc/crm_attribution',S.token,'POST',{p_since:since}).catch(()=>null)
  ]); }catch(e){ r=null; }
  if(!r||!r.ok){ $('app').innerHTML=`<div class="empty">${L('تعذّر تحميل الإحصائيات.','Could not load stats.')}</div>`; return; }
  window.__attr=attr;
  const f=r.funnel||{};
  const tempColors={very_hot:'#B42318',hot:'#B45309',warm:'#C99700',cold:'#8894a6'};
  const tempLab=ar()?{very_hot:'ساخن جدًا',hot:'ساخن',warm:'دافئ',cold:'بارد'}:{very_hot:'Very hot',hot:'Hot',warm:'Warm',cold:'Cold'};
  const stageLab=ar()?{new:'جديد',contact:'تواصل',contacted:'تم التواصل',viewing:'معاينة',negotiation:'تفاوض',negotiate:'تفاوض',closed:'مغلق',won:'مكسوب',lost:'خسارة'}:{new:'New',contact:'Contact',contacted:'Contacted',viewing:'Viewing',negotiation:'Negotiation',negotiate:'Negotiation',closed:'Closed',won:'Won',lost:'Lost'};

  const kpi=(cls,n,l)=>`<div class="kpi ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const maxF=Math.max(1,f.leads||0);
  const frow=(lab,v,base)=>`<div class="row"><div class="lab"><span>${lab}</span><span>${v||0}</span></div><div class="bar"><div class="fill" style="width:${Math.round((v||0)/base*100)}%"></div></div></div>`;

  const temps=r.by_temperature||{}; const tmax=Math.max(1,...Object.values(temps));
  const none=`<div class="empty">${L('لا يوجد','None')}</div>`;
  const tempRows=['very_hot','hot','warm','cold'].map(k=>temps[k]?`<div class="row"><div class="k">${tempLab[k]}</div><div class="bar"><div class="fill" style="width:${Math.round(temps[k]/tmax*100)}%;background:${tempColors[k]}"></div></div><div class="v">${temps[k]}</div></div>`:'').join('')||none;

  const stages=r.by_stage||{}; const smax=Math.max(1,...Object.values(stages));
  const stageRows=Object.entries(stages).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><div class="k">${stageLab[k]||k}</div><div class="bar"><div class="fill" style="width:${Math.round(v/smax*100)}%;background:var(--teal)"></div></div><div class="v">${v}</div></div>`).join('')||none;

  const sources=(r.by_source||[]);
  const srcRows=sources.length?sources.map(s=>`<div class="src"><span>${HZ.esc(s.source)}</span><span style="font-weight:800">${s.count}</span></div>`).join(''):none;

  $('app').innerHTML=`
    <div class="kpis">
      ${kpi('t', r.leads_total||0, L('إجمالي العملاء','Total clients'))}
      ${kpi('g', (r.conversion_rate||0)+'%', L('نسبة التحويل','Conversion rate'))}
      ${kpi('g', money(r.commission_total), L('إجمالي العمولات','Total commissions'))}
      ${kpi('h', r.hot_now||0, L('ساخنون الآن','Hot now'))}
      ${kpi('o', r.overdue_followups||0, L('متابعات متأخرة','Overdue follow-ups'))}
    </div>
    <div class="grid">
      <div class="card"><h2>🔻 ${L('قمع المبيعات (كل الوقت)','Sales funnel (all-time)')}</h2><div class="funnel">
        ${frow(L('عملاء','Leads'), f.leads, maxF)}
        ${frow(L('تم التواصل','Contacted'), f.contacted, maxF)}
        ${frow(L('معاينات تمّت','Viewings done'), f.viewings, maxF)}
        ${frow(L('صفقات مفتوحة','Open deals'), f.deals_open, maxF)}
        ${frow(L('صفقات مكسوبة','Won deals'), f.deals_won, maxF)}
      </div></div>
      <div class="card"><h2>🌡️ ${L('حرارة العملاء','Lead temperature')}</h2><div class="brk">${tempRows}</div></div>
      <div class="card"><h2>📍 ${L('مراحل خط سير العملاء','Pipeline stages')}</h2><div class="brk">${stageRows}</div></div>
      <div class="card"><h2>📥 ${L('مصادر العملاء','Lead sources')}</h2>${srcRows}</div>
    </div>
    <div class="kpis" style="margin-top:16px">
      ${kpi('t', r.leads_period||0, L('عملاء جدد بالفترة','New leads (period)'))}
      ${kpi('g', r.deals_won_period||0, L('صفقات مكسوبة بالفترة','Won deals (period)'))}
      ${kpi('g', money(r.commission_period), L('عمولات الفترة','Commissions (period)'))}
      ${kpi('', r.avg_score||0, L('متوسط السكور','Avg. score'))}
      ${kpi('', (f.deals_lost||0), L('صفقات خاسرة','Lost deals'))}
    </div>
    <div class="card" style="margin-top:16px"><h2>💰 ${L('عائد التسويق حسب الحملة (ROI)','Marketing ROI by campaign')}</h2>${attrHTML(attr)}</div>`;
}
function attrHTML(a){
  const rows=(a&&a.ok&&a.rows)||[];
  if(!rows.length) return `<div class="empty">${L('لا توجد بيانات حملات بعد — العملاء بيتوسموا تلقائيًا بالمصدر/الحملة (source/utm).','No campaign data yet — leads are auto-tagged by source/utm.')}</div>`;
  const roiTxt=x=>x.roi==null?'—':`<b style="color:${x.roi>=0?'#137a3e':'#B42318'}">${x.roi>=0?'+':''}${x.roi}%</b>`;
  const body=rows.map(x=>`<tr>
    <td style="font-weight:800">${HZ.esc(x.campaign)}</td>
    <td>${x.leads}</td><td>${x.deals_won}</td>
    <td style="color:var(--teal-d);font-weight:700">${money(x.commission)}</td>
    <td>${x.spend?money(x.spend):'<span style="color:var(--muted)">—</span>'}</td>
    <td>${roiTxt(x)}</td>
    <td>${x.cost_per_lead!=null?money(x.cost_per_lead):'—'}</td>
    <td><button onclick="editSpend('${encodeURIComponent(x.campaign)}',${x.spend||0})" style="font-size:11px;border:1.5px solid var(--line-2);background:#fff;border-radius:7px;padding:4px 8px;cursor:pointer">✎ ${L('إنفاق','Spend')}</button></td></tr>`).join('');
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">
    <thead><tr style="color:var(--muted);font-size:11.5px;text-align:${ar()?'right':'left'}">
      <th style="padding:6px">${L('الحملة','Campaign')}</th><th>${L('عملاء','Leads')}</th><th>${L('صفقات','Deals')}</th><th>${L('عمولة','Commission')}</th><th>${L('إنفاق','Spend')}</th><th>ROI</th><th>${L('تكلفة/عميل','Cost/lead')}</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <style>#app table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}</style>`;
}
window.editSpend=async(campEnc,cur)=>{
  const camp=decodeURIComponent(campEnc);
  const v=prompt(L('إنفاق حملة "'+camp+'" (ج.م):','Spend for "'+camp+'" (EGP):'), cur||'');
  if(v===null) return; const n=Number(v); if(isNaN(n)){ alert(L('رقم غير صحيح','Invalid number')); return; }
  try{ await HZ.sbAuth('/rpc/crm_set_campaign_spend',S.token,'POST',{p_name:camp,p_spend:n,p_channel:null}); load(); }catch(e){ alert(L('حصل خطأ','Something went wrong')); }
};
document.addEventListener('hz:lang', ()=>{ if(S) load(); });
boot();
</script>
</body>
</html>
